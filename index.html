            ctx.beginPath();
            ctx.arc(58, 14, 2.5, 0, Math.PI * 2);
            ctx.fill();

            zeichneJohanni(t);

            // Flügel mit Federverlauf
            const schlag = Math.sin(t * 12) * 0.55;
            ctx.save();
            ctx.translate(30, 23);
            ctx.rotate(-0.5 + schlag);
            ctx.strokeStyle = '#8fbbe6';
            ctx.lineWidth = 1.3;
            for (let i = 2; i >= 0; i--) {
                const fx = -4 - i * 5, fy = -8 + i * 2;
                const feder = ctx.createLinearGradient(fx, fy - 12, fx, fy + 12);
                feder.addColorStop(0, '#ffffff');
                feder.addColorStop(1, i === 0 ? '#d4e7fa' : '#c2dbf4');
                ctx.fillStyle = feder;
                ctx.beginPath();
                ctx.ellipse(fx, fy, 5, 13 - i * 2, -0.35 - i * 0.25, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }
            glanzlicht(-5, -14, 1.6, 5, -0.35, 0.8);
            ctx.restore();

            ctx.restore();
        }

        // Weicher Schatten von Glacier auf der Wiese: je höher, desto kleiner und blasser
        function zeichneBodenschatten(cx, unterkante) {
            const boden = bodenHoehe(cx);
            const abstand = Math.max(0, boden - unterkante);
            const s = Math.max(0.35, 1 - abstand / 380);
            const g = ctx.createRadialGradient(cx, boden, 2, cx, boden, 34 * s);
            g.addColorStop(0, `rgba(30, 50, 40, ${0.35 * s})`);
            g.addColorStop(1, 'rgba(30, 50, 40, 0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.ellipse(cx, boden, 34 * s, 8 * s, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        function zeichneFiligraneWolke(x, y, width, height) {
            // Rosa Gewitterwolke: kräftiger als der Himmel, damit man sie gut sieht
            ctx.save();
            const r = height * 0.35;
            const blasen = [
                [0.3, 0.5, 1], [0.5, 0.4, 1.2], [0.7, 0.5, 1], [0.5, 0.6, 1.1]
            ];
            const wolkenPfad = () => {
                ctx.beginPath();
                for (const [fx, fy, fr] of blasen) {
                    ctx.moveTo(x + width * fx + r * fr, y + height * fy);
                    ctx.arc(x + width * fx, y + height * fy, r * fr, 0, Math.PI * 2);
                }
            };

            // Blitz unter der Wolke (flackert)
            if (Math.floor(spielRahmen / 8 + x / 50) % 5 === 0) {
                ctx.fillStyle = '#ffe14d';
                ctx.strokeStyle = '#e0a800';
                ctx.lineWidth = 1.5;
                const bx = x + width * 0.5, by = y + height * 0.8;
                ctx.beginPath();
                ctx.moveTo(bx, by);
                ctx.lineTo(bx - 8, by + 16);
                ctx.lineTo(bx - 1, by + 16);
                ctx.lineTo(bx - 6, by + 30);
                ctx.lineTo(bx + 8, by + 11);
                ctx.lineTo(bx + 1, by + 11);
                ctx.lineTo(bx + 5, by);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            // Dunkle Gewitterwolke mit Volumen: Rand, dunkle Unterseite, helle Oberkante
            wolkenPfad();
            ctx.strokeStyle = 'rgba(30, 30, 50, 0.55)';
            ctx.lineWidth = 3;
            ctx.stroke();
            const koerper = ctx.createLinearGradient(0, y, 0, y + height);
            koerper.addColorStop(0, '#9da2bf');
            koerper.addColorStop(0.55, '#6b6f8f');
            koerper.addColorStop(1, '#3e4160');
            ctx.fillStyle = koerper;
            ctx.fill();
            // Lichtsaum oben
            ctx.save();
            ctx.globalAlpha = 0.55;
            ctx.fillStyle = '#d3d6e8';
            ctx.beginPath();
            ctx.ellipse(x + width * 0.42, y + height * 0.3, r * 0.75, r * 0.32, -0.15, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            // Leuchten im Inneren, wenn es blitzt
            if (Math.floor(spielRahmen / 8 + x / 50) % 5 === 0) {
                const glut = ctx.createRadialGradient(x + width * 0.5, y + height * 0.6, 2, x + width * 0.5, y + height * 0.6, r * 1.2);
                glut.addColorStop(0, 'rgba(255, 245, 190, 0.55)');
                glut.addColorStop(1, 'rgba(255, 245, 190, 0)');
                ctx.fillStyle = glut;
                ctx.beginPath();
                ctx.arc(x + width * 0.5, y + height * 0.6, r * 1.2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        function zeichneEchtenStern(cx, cy, spikes, outerRadius, innerRadius, istPowerUp) {
            ctx.save();
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;
            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;
                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            
            if (istPowerUp) {
                ctx.fillStyle = Math.floor(spielRahmen / 5) % 2 === 0 ? '#00ffff' : '#ff00ff';
            } else {
                ctx.fillStyle = '#ffdf00';
            }
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
        }

        function zeichneMagnetSymbol(x, y, groesse) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(groesse / 20, groesse / 20);
            ctx.lineCap = 'butt';
            ctx.lineWidth = 7;
            ctx.strokeStyle = '#7a1f2e';
            ctx.beginPath();
            ctx.arc(0, 0, 9, Math.PI, 0, false);
            ctx.stroke();
            ctx.strokeStyle = '#ff4d5e';
            ctx.lineWidth = 5;
            ctx.stroke();
            ctx.fillStyle = '#e8eef5';
            ctx.strokeStyle = '#7a1f2e';
            ctx.lineWidth = 1.5;
            ctx.fillRect(-12.5, 0, 7, 8); ctx.strokeRect(-12.5, 0, 7, 8);
            ctx.fillRect(5.5, 0, 7, 8); ctx.strokeRect(5.5, 0, 7, 8);
            glanzlicht(-5, -7, 3, 1.2, -0.4, 0.8);
            ctx.restore();
        }

        function zeichneSchildSymbol(x, y, groesse) {
            ctx.save();
            const r = groesse * 0.55;
            ctx.fillStyle = kugelVerlauf(x, y, r, 'rgba(230, 250, 255, 0.95)', 'rgba(120, 200, 255, 0.75)', 'rgba(40, 120, 220, 0.9)');
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = '#ffffff';
            ctx.font = Math.round(r * 1.1) + 'px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('★', x, y + 1);
            glanzlicht(x - r * 0.35, y - r * 0.4, r * 0.3, r * 0.15, -0.6, 0.9);
            ctx.restore();
        }

        function zeichneSammelobjekt(st) {
            const wippen = Math.sin(spielRahmen / 10 + st.x / 60) * 3;
            if (st.typ === 'herz') zeichneHerz(st.x, st.y + wippen, 26, true);
            else if (st.typ === 'magnet') zeichneMagnetSymbol(st.x, st.y + wippen, 30);
            else if (st.typ === 'schild') zeichneSchildSymbol(st.x, st.y + wippen, 34);
            else zeichneEchtenStern(st.x, st.y, 5, st.radius, st.radius / 2, st.typ === 'kraft');
        }

        function erstelleStern(typ) {
            const yPosition = Math.random() * (H - 80) + 40;
            if (!typ) {
                const r = Math.random();
                typ = 'stern';
                if (bossPhase) {
                    if (herzen < MAX_HERZEN && r < 0.12) typ = 'herz';
                } else if (r < 0.13) typ = 'kraft';
                else if (level >= 2 && r < 0.19 && magnetTimer <= 0) typ = 'magnet';
                else if (level >= 4 && r < 0.25 && !schildAktiv) typ = 'schild';
                else if (herzen < MAX_HERZEN && r < 0.31) typ = 'herz';
            }
            sterne.push({
                x: W + 20,
                y: yPosition,
                radius: typ === 'stern' ? 15 : 18,
                baseSpeed: 140,
                typ: typ
            });
        }

        function erstelleHindernis() {
            const breite = 85;
            const hoehe = 60 + Math.random() * 40; 
            const yPosition = Math.random() * (H - hoehe);
            hindernisse.push({ 
                x: W, 
                y: yPosition, 
                width: breite, 
                height: hoehe, 
                baseSpeed: 140 
            });
        }


        // ===== DRACHEN =====
        // Ab Level 3 fliegen Drachen auf Glacier zu. Mit jedem Level kommen
        // sie öfter, schneller und mit größeren Wellenbewegungen.
        // Ab Level 7 versuchen manche, Glacier zu verfolgen.
        const DRACHE_B = 80;
        const DRACHE_H = 50;

        function drachenEinstellung(lvl) {
            if (lvl < 3) return null;
            const stufe = lvl - 3;
            return {
                takt: Math.max(2.0, 5.5 - stufe * 0.5),   // Sekunden zwischen Drachen
                tempo: 230 + stufe * 25,                  // Pixel pro Sekunde
                amplitude: 15 + stufe * 7,                // Höhe der Wellenbewegung
                wellenTempo: 2 + stufe * 0.25,
                verfolgerChance: lvl >= 7 ? 0.25 + (lvl - 7) * 0.1 : 0
            };
        }

        function erstelleDrache(e) {
            // Startposition so wählen, dass keine undurchdringliche Wand
            // mit einer gerade erschienenen Wolke entsteht
            let y = 0;
            for (let versuch = 0; versuch < 12; versuch++) {
                y = 30 + Math.random() * (H - DRACHE_H - 60);
                const blockiert = hindernisse.some(w =>
                    w.x > W - 260 &&
                    y + DRACHE_H + 50 > w.y && y - 50 < w.y + w.height);
                if (!blockiert) break;
            }
            Klang.spiele('warnung');
            drachen.push({
                x: W + 10,
                basisY: y,
                y: y,
                phase: Math.random() * Math.PI * 2,
                tempo: e.tempo,
                amplitude: e.amplitude,
                wellenTempo: e.wellenTempo,
                verfolgt: Math.random() < e.verfolgerChance,
                warnung: 0.9,          // Sekunden Vorwarnung am rechten Rand
                verscheucht: false,
                drehung: 0
            });
        }

        function zeichneWarnung(y, verfolgt) {
            if (Math.floor(spielRahmen / 6) % 2 === 0) return;
            const cx = W - 26, cy = y + DRACHE_H / 2;
            ctx.save();
            ctx.fillStyle = verfolgt ? '#ff5a5a' : '#ff9a3c';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(cx, cy, 16, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#ffffff';
            ctx.font = '22px Spielschrift, Arial';
            ctx.textAlign = 'center';
            ctx.fillText('!', cx, cy + 8);
            ctx.restore();
        }

        // ===== DRACHEN ALS BILDER =====
        // Alle Posen liegen in einer Bilddatei (drachen.png). Daraus entstehen beim Laden
        // drei Farbvarianten: türkis (normale Drachen), rot (Verfolger), lila (Drachenkönig).
        const DRACHEN_TEILE = {"oben": [0, 0, 211, 150], "unten": [215, 0, 232, 145], "idle": [451, 0, 224, 151], "angriff": [679, 0, 225, 165], "feuer": [0, 169, 312, 163], "getroffen": [316, 169, 198, 171], "f1": [518, 169, 112, 44], "f2": [634, 169, 114, 54], "f3": [752, 169, 154, 64]};
        // Kopfposition je Pose (Anteil von Breite/Höhe im Originalbild, Blick nach rechts)
        const DRACHEN_KOPF = { oben: [0.9, 0.36], unten: [0.95, 0.33], idle: [0.92, 0.33], angriff: [0.93, 0.47], feuer: [0.68, 0.45], getroffen: [0.93, 0.5] };
        const DRACHE_MASSSTAB = 100 / 211;
        const drachenAtlas = { bild: new Image(), bereit: false, v: {} };
        drachenAtlas.bild.onload = () => {
            const farben = { rot: null, tuerkis: '#1fb3a6', lila: '#8a4be0' };
            for (const [variante, farbe] of Object.entries(farben)) {
                drachenAtlas.v[variante] = {};
                for (const [name, [x, y, b, h]] of Object.entries(DRACHEN_TEILE)) {
                    if (name[0] === 'f' && name.length === 2 && variante !== 'rot') continue;   // Feuer nur einmal
                    const c = document.createElement('canvas');
                    c.width = b; c.height = h;
                    const g = c.getContext('2d');
                    g.drawImage(drachenAtlas.bild, x, y, b, h, 0, 0, b, h);
                    if (farbe) {
                        g.globalCompositeOperation = 'hue';
                        g.fillStyle = farbe;
                        g.fillRect(0, 0, b, h);
                        if (variante === 'lila') {
                            g.globalCompositeOperation = 'multiply';
                            g.fillStyle = '#c9b8e8';
                            g.fillRect(0, 0, b, h);
                        }
                        g.globalCompositeOperation = 'destination-in';
                        g.drawImage(drachenAtlas.bild, x, y, b, h, 0, 0, b, h);
                        if (name === 'feuer') {
                            // Feueratem rechts vom Maul in Originalfarbe zurückholen
                            const ab = Math.round(b * 0.7);
                            g.globalCompositeOperation = 'source-over';
                            g.clearRect(ab, 0, b - ab, h);
                            g.drawImage(drachenAtlas.bild, x + ab, y, b - ab, h, ab, 0, b - ab, h);
                        }
                    }
                    drachenAtlas.v[variante][name] = c;
                }
            }
            drachenAtlas.bereit = true;
        };
        if (location.protocol.startsWith('http')) drachenAtlas.bild.src = 'drachen.png';

        const FLUG_ZYKLUS = ['oben', 'idle', 'unten', 'idle'];
        function flugPose(phase) {
            return FLUG_ZYKLUS[Math.floor(Math.abs(spielRahmen / 6 + phase * 3)) % 4];
        }

        // Zeichnet eine Drachen-Pose gespiegelt (Blick nach links), zentriert auf (cx, cy)
        function zeichneDrachenPose(variante, pose, cx, cy, massstab, drehung) {
            const bild = drachenAtlas.v[variante][pose];
            const b = bild.width * massstab, h = bild.height * massstab;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(drehung || 0);
            ctx.scale(-1, 1);
            ctx.drawImage(bild, -b / 2, -h * 0.55, b, h);
            ctx.restore();
            // Kopfposition (gespiegelt) zurückgeben, z. B. für Krone oder Feuer
            const k = DRACHEN_KOPF[pose] || [0.9, 0.35];
            return { x: cx - (k[0] - 0.5) * b, y: cy - h * 0.55 + k[1] * h, b: b, h: h };
        }

        function zeichneDrache(d) {
            if (drachenAtlas.bereit && !d.boss) {
                const pose = d.verscheucht ? 'getroffen' : flugPose(d.phase);
                zeichneDrachenPose(d.verfolgt ? 'rot' : 'tuerkis', pose,
                    d.x + DRACHE_B / 2, d.y + DRACHE_H / 2, DRACHE_MASSSTAB, d.drehung);
                return;
            }
            const t = spielRahmen / 60;
            const umriss = d.boss ? '#4b2a7a' : (d.verfolgt ? '#7a2b2b' : '#2f7a50');
            const koerper = d.boss ? '#a77be6' : (d.verfolgt ? '#ff7d6b' : '#5cc98a');
            ctx.save();
            ctx.translate(d.x + DRACHE_B / 2, d.y + DRACHE_H / 2);
            ctx.rotate(d.drehung);
            ctx.translate(-DRACHE_B / 2, -DRACHE_H / 2);
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.lineWidth = 2;

            // Schwanz mit Spitze (nach rechts, Drache schaut nach links)
            ctx.strokeStyle = umriss;
            ctx.lineWidth = 9;
            ctx.beginPath();
            const wedeln = Math.sin(t * 6 + d.phase) * 5;
            ctx.moveTo(52, 30);
            ctx.quadraticCurveTo(68, 34 + wedeln, 76, 24 - wedeln);
            ctx.stroke();
            ctx.strokeStyle = koerper;
            ctx.lineWidth = 6;
            ctx.stroke();
            ctx.fillStyle = '#ffd34d';
            ctx.strokeStyle = umriss;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(74, 26 - wedeln);
            ctx.lineTo(84, 18 - wedeln);
            ctx.lineTo(79, 30 - wedeln);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // hinterer Flügel
            const schlag = Math.sin(t * 9 + d.phase);
            const zeichneFluegel = (dx, farbe) => {
                // Fledermaus-Flügel, der von der Schulter aus auf- und zuklappt
                ctx.save();
                ctx.translate(40 + dx, 22);
                ctx.scale(1, 0.45 + 0.55 * (schlag * 0.5 + 0.5));
                ctx.fillStyle = farbe;
                ctx.strokeStyle = '#6a46b8';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(-4, 0);
                ctx.lineTo(2, -24);                       // Flügelspitze
                ctx.quadraticCurveTo(6, -14, 9, -14);
                ctx.lineTo(14, -20);                      // zweite Spitze
                ctx.quadraticCurveTo(15, -8, 20, -6);
                ctx.lineTo(22, -10);
                ctx.quadraticCurveTo(20, -2, 14, 0);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                // Flügelknochen
                ctx.beginPath();
                ctx.moveTo(-2, -1); ctx.lineTo(9, -14);
                ctx.moveTo(-1, -1); ctx.lineTo(18, -7);
                ctx.stroke();
                ctx.restore();
            };
            zeichneFluegel(6, '#9a76e8');

            // Körper + Bauch
            ctx.fillStyle = koerper;
            ctx.strokeStyle = umriss;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(40, 30, 18, 12, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#ffe9a8';
            ctx.beginPath();
            ctx.ellipse(38, 35, 12, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            // Beinchen
            ctx.strokeStyle = umriss;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(32, 40); ctx.lineTo(30, 46);
            ctx.moveTo(46, 40); ctx.lineTo(45, 46);
            ctx.stroke();

            // Kopf
            ctx.fillStyle = koerper;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(18, 20, 13, 11, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(8, 25, 9, 7, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            // Hals-Naht überdecken
            ctx.beginPath();
            ctx.ellipse(27, 26, 7, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            // Hörner
            ctx.fillStyle = '#fff3c4';
            ctx.strokeStyle = umriss;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(20, 10); ctx.lineTo(26, 0); ctx.lineTo(25, 11);
            ctx.moveTo(14, 10); ctx.lineTo(16, 1); ctx.lineTo(19, 10);
            ctx.fill();
            ctx.stroke();

            // Nasenloch, Auge, Augenbraue
            ctx.fillStyle = umriss;
            ctx.beginPath();
            ctx.arc(3, 23, 1.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(16, 18, 4.5, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#2b2440';
            ctx.beginPath();
            ctx.arc(14.8, 18.5, 2.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(14, 17.5, 0.9, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = umriss;
            ctx.lineWidth = 2;
            ctx.beginPath();
            if (d.verscheucht) {
                ctx.moveTo(11, 11); ctx.lineTo(20, 13);   // erschrocken
            } else {
                ctx.moveTo(11, 13); ctx.lineTo(20, 10);   // frech
            }
            ctx.stroke();

            // kleine Rauchwölkchen aus der Nase
            if (!d.verscheucht) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                const r = (t * 2 + d.phase) % 1;
                ctx.beginPath();
                ctx.arc(-3 - r * 10, 22 - r * 6, 2 + r * 3, 0, Math.PI * 2);
                ctx.fill();
            }

            // vorderer Flügel
            zeichneFluegel(-4, '#b48cff');

            ctx.restore();
        }

        function aktualisiereDrachen() {
            const e = drachenEinstellung(level);
            if (e && !bossPhase) {
                drachenTimer += dt;
                if (drachenTimer >= e.takt) {
                    erstelleDrache(e);
                    drachenTimer = 0;
                }
            }

            for (let i = drachen.length - 1; i >= 0; i--) {
                const d = drachen[i];

                if (d.warnung > 0) {
                    d.warnung -= dt;
                    zeichneWarnung(d.basisY, d.verfolgt);
                    continue;
                }

                if (d.verscheucht) {
                    // Mit Regenbogen-Kraft berührt: Drache flieht nach oben rechts
                    d.x += 320 * dt;
                    d.y -= 260 * dt;
                    d.drehung += 6 * dt;
                } else {
                    d.x -= d.tempo * dt;
                    d.phase += d.wellenTempo * dt;
                    if (d.verfolgt && d.x > einhorn.x + 60) {
                        const ziel = einhorn.y - 5;
                        d.basisY += Math.sign(ziel - d.basisY) * Math.min(Math.abs(ziel - d.basisY), 70 * dt);
                    }
                    d.y = d.basisY + Math.sin(d.phase) * d.amplitude;
                    d.y = Math.max(0, Math.min(H - DRACHE_H, d.y));
                }

                zeichneDrache(d);

                if (!d.verscheucht &&
                    einhorn.x + 8 < d.x + DRACHE_B * 0.85 &&
                    einhorn.x + einhorn.width - 6 > d.x + DRACHE_B * 0.1 &&
                    einhorn.y + 5 < d.y + DRACHE_H * 0.9 &&
                    einhorn.y + einhorn.height - 4 > d.y + DRACHE_H * 0.1
                ) {
                    if (unverwundbarTimer > 0) {
                        d.verscheucht = true;
                        Klang.spiele('verscheucht');
                        partikelExplosion(d.x + DRACHE_B / 2, d.y + DRACHE_H / 2, 14, ['#b48cff', '#5cc98a', '#ffffff'], 'stern');
                    } else if (schutzTimer <= 0 && zustand === 'spiel') {
                        d.verscheucht = true;   // fliegt nach dem Treffer davon
                        treffer('drache');
                    }
                }

                if (d.x < -DRACHE_B - 20 || d.y < -DRACHE_H - 20 || d.x > W + 120) {
                    drachen.splice(i, 1);
                }
            }
        }

        // ===== EFFEKTE =====
        let partikel = [];
        let schwebeTexte = [];
        let spurTimer = 0;
        let wackelZeit = 0, wackelStaerke = 0;
        let blitzZeit = 0;
        let komboZaehler = 0, komboTimer = 0;
        const MAX_PARTIKEL = 220;

        function neuesPartikel(p) {
            if (partikel.length >= MAX_PARTIKEL) partikel.shift();
            partikel.push(p);
        }

        function partikelExplosion(x, y, anzahl, farben, form, tempo) {
            tempo = tempo || 220;
            for (let i = 0; i < anzahl; i++) {
                const w = Math.random() * Math.PI * 2;
                const v = tempo * (0.4 + Math.random() * 0.8);
                const leben = 0.5 + Math.random() * 0.5;
                neuesPartikel({
                    x: x, y: y,
                    vx: Math.cos(w) * v, vy: Math.sin(w) * v - 40,
                    leben: leben, max: leben,
                    farbe: farben[i % farben.length],
                    r: 2.5 + Math.random() * 3,
                    form: form || 'kreis',
                    schwere: 260
                });
            }
        }

        function schwebeText(x, y, text, farbe, groesse) {
            schwebeTexte.push({ x: x, y: y, text: text, farbe: farbe || '#ffffff', groesse: groesse || 20, leben: 1.1, max: 1.1 });
        }

        function wackeln(staerke, zeit) {
            wackelStaerke = Math.max(wackelStaerke, staerke);
            wackelZeit = Math.max(wackelZeit, zeit);
        }

        function zeichneFunkeln(x, y, r) {
            ctx.beginPath();
            ctx.moveTo(x, y - r * 2); ctx.lineTo(x + r * 0.45, y - r * 0.45);
            ctx.lineTo(x + r * 2, y); ctx.lineTo(x + r * 0.45, y + r * 0.45);
            ctx.lineTo(x, y + r * 2); ctx.lineTo(x - r * 0.45, y + r * 0.45);
            ctx.lineTo(x - r * 2, y); ctx.lineTo(x - r * 0.45, y - r * 0.45);
            ctx.closePath();
            ctx.fill();
        }

        function aktualisiereEffekte() {
            // Glitzerspur hinter Glacier
            spurTimer += dt;
            if (glacierAmBoden() && unverwundbarTimer <= 0) spurTimer = 0;
            while (spurTimer > 0.028) {
                spurTimer -= 0.028;
                const kraft = unverwundbarTimer > 0;
                const farbe = kraft
                    ? `hsl(${(spielRahmen * 6 + Math.random() * 60) % 360}, 100%, 72%)`
                    : ['#ffffff', '#ffd6ef', '#d8c8ff', '#c8f0ff'][Math.floor(Math.random() * 4)];
                neuesPartikel({
                    x: einhorn.x + 4 + Math.random() * 6,
                    y: einhorn.y + 24 + Math.random() * 12,
                    vx: -150 - Math.random() * 60, vy: (Math.random() - 0.5) * 30,
                    leben: kraft ? 0.7 : 0.45, max: kraft ? 0.7 : 0.45,
                    farbe: farbe, r: kraft ? 2.6 : 1.8, form: 'stern', schwere: 0
                });
            }

            for (let i = partikel.length - 1; i >= 0; i--) {
                const p = partikel[i];
                p.leben -= dt;
                if (p.leben <= 0) { partikel.splice(i, 1); continue; }
                p.vy += p.schwere * dt;
                p.x += p.vx * dt;
                p.y += p.vy * dt;
            }
            for (let i = schwebeTexte.length - 1; i >= 0; i--) {
                const t = schwebeTexte[i];
                t.leben -= dt;
                t.y -= 45 * dt;
                if (t.leben <= 0) schwebeTexte.splice(i, 1);
            }
            if (komboTimer > 0) {
                komboTimer -= dt;
                if (komboTimer <= 0) komboZaehler = 0;
            }
            if (wackelZeit > 0) wackelZeit -= dt;
            if (blitzZeit > 0) blitzZeit -= dt;
        }

        function zeichnePartikel() {
            ctx.save();
            for (const p of partikel) {
                ctx.globalAlpha = Math.max(0, p.leben / p.max);
                ctx.fillStyle = p.farbe;
                if (p.form === 'stern') {
                    zeichneFunkeln(p.x, p.y, p.r);
                } else if (p.form === 'herz') {
                    ctx.restore(); ctx.save();
                    ctx.globalAlpha = Math.max(0, p.leben / p.max);
                    zeichneHerz(p.x, p.y, p.r * 4, true);
                } else {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.restore();
            for (const t of schwebeTexte) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, Math.min(1, t.leben / t.max * 1.6));
                konturText(t.text, t.x, t.y, t.groesse + 'px Spielschrift, Arial', t.farbe, '#1e1638', 5);
                ctx.restore();
            }
        }

        // ===== POWER-UPS =====
        const MAGNET_DAUER = 8;
        const SCHILD_DAUER = 15;
        let magnetTimer = 0;
        let schildAktiv = false;
        let schildTimer = 0;

        function zeichnePowerUpEffekte() {
            const cx = einhorn.x + 35, cy = einhorn.y + 22;
            if (magnetTimer > 0) {
                const puls = (spielRahmen / 40) % 1;
                ctx.save();
                ctx.strokeStyle = `rgba(255, 90, 110, ${0.5 * (1 - puls)})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(cx, cy, 30 + puls * 70, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
            if (schildAktiv) {
                const endetBald = schildTimer < 3 && Math.floor(spielRahmen / 6) % 2 === 0;
                ctx.save();
                ctx.globalAlpha = endetBald ? 0.35 : 0.9;
                const g = ctx.createRadialGradient(cx - 12, cy - 14, 8, cx, cy, 50);
                g.addColorStop(0, 'rgba(255, 255, 255, 0.05)');
                g.addColorStop(0.75, 'rgba(140, 210, 255, 0.18)');
                g.addColorStop(1, 'rgba(90, 170, 255, 0.55)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(cx, cy, 48, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(200, 235, 255, 0.9)';
                ctx.lineWidth = 2;
                ctx.stroke();
                glanzlicht(cx - 20, cy - 26, 10, 4, -0.6, 0.7);
                ctx.restore();
            }
        }

        function zeichnePowerUpLeiste() {
            // kleine Anzeige oben in der Mitte für aktive Power-ups
            const eintraege = [];
            if (unverwundbarTimer > 0) eintraege.push({ text: 'Regenbogen ' + Math.ceil(unverwundbarTimer / 60) + 's', farbe: '#7dffe0', anteil: unverwundbarTimer / 420 });
            if (magnetTimer > 0) eintraege.push({ text: 'Magnet ' + Math.ceil(magnetTimer) + 's', farbe: '#ff8a98', anteil: magnetTimer / MAGNET_DAUER });
            if (schildAktiv) eintraege.push({ text: 'Schild ' + Math.ceil(schildTimer) + 's', farbe: '#9fd6ff', anteil: schildTimer / SCHILD_DAUER });
            if (komboZaehler >= 3) eintraege.push({ text: 'Kombo x' + komboZaehler, farbe: '#ffe14d', anteil: komboTimer / 1.8 });
            // links neben den runden Knöpfen, damit nichts die Punkteanzeige verdeckt
            const y0 = bossPhase ? 58 : 14;
            const b = 112, abstand = 6;
            let x = bossPhase ? W / 2 - (eintraege.length * b + (eintraege.length - 1) * abstand) / 2 : 110;
            for (const e of eintraege) {
                ctx.fillStyle = 'rgba(14, 12, 34, 0.45)';
                ctx.beginPath();
                ctx.roundRect(x, y0, b, 30, 10);
                ctx.fill();
                ctx.fillStyle = e.farbe;
                ctx.font = '14px Spielschrift, Arial';
                ctx.textAlign = 'center';
                ctx.fillText(e.text, x + b / 2, y0 + 18);
                ctx.fillRect(x + 10, y0 + 23, (b - 20) * Math.max(0, Math.min(1, e.anteil)), 3);
                x += b + abstand;
            }
        }

        // ===== LEVEL-BILDSCHIRM =====
        let levelUpAusstehend = null;
        let levelUpInfo = null;

        function levelInfo(lvl, neueWelt) {
            const texte = {
                2: ['Neu: Sternen-Magnet! Er zieht Sterne zu dir.', 'Die Wolken kommen jetzt öfter.'],
                3: ['Achtung, Drachen! Sie fliegen in Wellen auf dich zu.', 'Ein „!“ am rechten Rand warnt dich vorher.'],
                4: ['Neu: Schutzschild! Er fängt einen Treffer ab.', 'Die Drachen werden schneller.'],
                5: ['Die Drachen kommen jetzt öfter.', 'Sammle Regenbogen-Sterne und verscheuche sie!'],
                6: ['Die Drachen werden noch schneller.', 'Bleib in Bewegung!'],
                7: ['Ein Gewitter zieht auf – und rote Drachen verfolgen dich!', 'Weiche ihnen geschickt aus.'],
                8: ['Noch mehr rote Drachen!', 'Kombos geben Extra-Sterne.'],
                9: ['Fast geschafft!', 'Glühwürmchen leuchten dir den Weg.'],
                10: ['Letztes Level!', 'Noch ein paar Sterne bis zum Drachenkönig …']
            };
            return {
                titel: 'Level ' + lvl + ' erreicht!',
                unter: lvl === 7 ? 'Es wird stürmisch …' : (neueWelt !== null ? 'Es wird ' + WELTEN[neueWelt].name : ''),
                zeilen: texte[lvl] || [],
                boss: false
            };
        }

        const FINALE_INFO = {
            titel: 'Finale: Der Drachenkönig!',
            unter: 'Du hast 100 Sterne – jetzt wird es ernst!',
            zeilen: ['Er spuckt Feuerbälle – weiche ihnen aus.',
                     'Hol dir einen Regenbogen-Stern und flieg in ihn hinein.',
                     'Drei Treffer, und der Himmel ist gerettet!'],
            boss: true
        };

        function standbildMachen() {
            standbild = document.createElement('canvas');
            standbild.width = canvas.width;
            standbild.height = canvas.height;
            standbild.getContext('2d').drawImage(canvas, 0, 0);
        }

        function zeigeLevelUp(info) {
            levelUpInfo = info;
            standbildMachen();
            zustand = 'levelup';
            eingabeGesperrtBis = performance.now() + 700;
            Klang.musikStopp();
        }

        function weiterNachLevelUp() {
            if (performance.now() < eingabeGesperrtBis) return;
            Klang.spiele('weiter');
            zustand = 'spiel';
            schutzTimer = Math.max(schutzTimer, 1.2);
            if (levelUpInfo && levelUpInfo.boss) starteBoss();
            Klang.musikStart();
        }

        function zeichneLevelUp() {
            if (standbild) {
                ctx.save();
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.drawImage(standbild, 0, 0, canvas.width, canvas.height);
                ctx.restore();
            }
            const info = levelUpInfo;
            ctx.fillStyle = info.boss ? 'rgba(30, 5, 40, 0.65)' : 'rgba(14, 12, 34, 0.5)';
            ctx.fillRect(0, 0, W, H);

            // Karte mit leichtem Hereinzoomen
            ctx.save();
            ctx.fillStyle = info.boss ? 'rgba(60, 16, 40, 0.93)' : 'rgba(22, 18, 50, 0.92)';
            ctx.beginPath();
            ctx.roundRect(150, 40, 500, 310, 22);
            ctx.fill();
            ctx.strokeStyle = info.boss ? '#ff8a5c' : '#c9a24e';
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.restore();

            // Sterne-Kranz
            for (let i = 0; i < 5; i++) {
                ctx.fillStyle = i <= Math.floor(spielRahmen / 12) % 6 ? '#ffd34d' : 'rgba(200, 180, 120, 0.4)';
                zeichneFunkeln(W / 2 - 80 + i * 40, 70, 5);
            }

            konturText(info.titel, W / 2, 118, '34px Spielschrift, Arial', '#ffe08a', '#1e1638', 7);
            if (info.unter) konturText(info.unter, W / 2, 150, '18px Spielschrift, Arial', '#ffffff', '#1e1638', 5);

            ctx.fillStyle = '#f0e6cf';
            ctx.font = '17px Arial';
            ctx.textAlign = 'center';
            info.zeilen.forEach((z, i) => ctx.fillText(z, W / 2, 190 + i * 27));

            ctx.font = '16px Spielschrift, Arial';
            ctx.fillStyle = '#c9a24e';
            ctx.fillText('★ ' + score + ' Sterne   ·   ' + '♥'.repeat(herzen) + '   ·   ' + formatZeit(spielZeit), W / 2, 275);

            if (performance.now() >= eingabeGesperrtBis) {
                zeichneKnopf(info.boss ? 'Auf in den Kampf!' : 'Weiter!', W / 2 - 130, 290, 260, '#ffdf00', weiterNachLevelUp, 48);
            }
        }

        // ===== ENDBOSS: DRACHENKÖNIG =====
        const BOSS_B = DRACHE_B * 2, BOSS_H = DRACHE_H * 2;
        let bossPhase = false;
        let boss = null;
        let feuerbaelle = [];
        let bossKraftTimer = 0;

        function starteBoss() {
            bossPhase = true;
            hindernisse = [];
            drachen.forEach(d => { d.verscheucht = true; d.warnung = 0; });
            boss = { x: W + 40, y: 140, phase: 0, leben: 3, trefferBlink: 0, feuerTimer: 2.5, besiegt: false, besiegtZeit: 0, drehung: 0 };
            bossKraftTimer = 3;
            wackeln(6, 0.5);
        }

        function aktualisiereBoss() {
            if (!boss) return;
            const b = boss;
            if (b.trefferBlink > 0) b.trefferBlink -= dt;
            if (b.feuerAnim > 0) b.feuerAnim -= dt;

            if (b.besiegt) {
                b.besiegtZeit += dt;
                b.x += 180 * dt;
                b.y -= 140 * dt;
                b.drehung += 4 * dt;
                if (Math.random() < 0.5) {
                    partikelExplosion(b.x + BOSS_B / 2, b.y + BOSS_H / 2, 3,
                        ['#ffd34d', '#ff8ac4', '#7dffe0', '#b48cff', '#ffffff'], 'stern', 260);
                }
                if (b.besiegtZeit > 2.3 && zustand === 'spiel') beendeSpiel('sieg');
            } else {
                // hereinfliegen, dann auf und ab schweben
                const zielX = 585;
                b.x += (zielX - b.x) * Math.min(1, dt * 1.5);
                const wut = 3 - b.leben;
                b.phase += dt * (1.1 + wut * 0.45);
                b.y = 135 + Math.sin(b.phase) * 105;

                // Feuerbälle auf Glacier
                b.feuerTimer -= dt;
                if (b.feuerTimer <= 0 && b.x < W - 120) {
                    const fx = b.maul ? b.maul.x : b.x + 8, fy = b.maul ? b.maul.y : b.y + 50;
                    b.feuerAnim = 0.5;
                    const vx = -(270 + wut * 45);
                    const flugzeit = (fx - (einhorn.x + 35)) / -vx;
                    let vy = ((einhorn.y + 25) - fy) / Math.max(0.3, flugzeit);
                    vy = Math.max(-220, Math.min(220, vy));
                    feuerbaelle.push({ x: fx, y: fy, vx: vx, vy: vy, r: 13 });
                    if (wut >= 2) feuerbaelle.push({ x: fx, y: fy, vx: vx, vy: vy + 110, r: 11 });
                    Klang.spiele('feuer');
                    b.feuerTimer = 2.3 - wut * 0.5;
                    b.feuerTimer = Math.max(b.feuerTimer, 1.0);
                }

                // Regenbogen-Stern garantiert regelmäßig nachliefern
                bossKraftTimer -= dt;
                if (bossKraftTimer <= 0) {
                    if (unverwundbarTimer <= 0 && !sterne.some(st => st.typ === 'kraft')) erstelleStern('kraft');
                    bossKraftTimer = 6;
                }

                // Berührung mit Glacier
                const trifft =
                    einhorn.x + 10 < b.x + BOSS_B * 0.9 &&
                    einhorn.x + einhorn.width - 8 > b.x + BOSS_B * 0.12 &&
                    einhorn.y + 6 < b.y + BOSS_H * 0.9 &&
                    einhorn.y + einhorn.height - 4 > b.y + BOSS_H * 0.15;
                if (trifft && b.trefferBlink <= 0) {
                    if (unverwundbarTimer > 0) {
                        b.leben--;
                        b.trefferBlink = 1.3;
                        unverwundbarTimer = 0;     // Kraft ist verbraucht
                        b.x += 110;                // zurückgestoßen
                        wackeln(10, 0.45);
                        partikelExplosion(b.x + 40, b.y + BOSS_H / 2, 26, ['#ffd34d', '#ffffff', '#ff8ac4', '#7dffe0'], 'stern', 320);
                        if (b.leben <= 0) {
                            b.besiegt = true;
                            feuerbaelle = [];
                            Klang.spiele('bossBesiegt');
                            schwebeText(W / 2, 170, 'Der Drachenkönig flieht!', '#ffe14d', 30);
                        } else {
                            Klang.spiele('bossTreffer');
                            schwebeText(b.x + 40, b.y, 'Treffer! Noch ' + b.leben, '#ffe14d', 24);
                        }
                    } else if (schutzTimer <= 0) {
                        treffer('boss');
                    }
                }
            }

            // Feuerbälle bewegen und prüfen
            for (let i = feuerbaelle.length - 1; i >= 0; i--) {
                const f = feuerbaelle[i];
                f.x += f.vx * dt;
                f.y += f.vy * dt;
                if (Math.random() < 0.6) {
                    neuesPartikel({ x: f.x + 6, y: f.y + (Math.random() - 0.5) * 8, vx: 60, vy: -20,
                        leben: 0.35, max: 0.35, farbe: Math.random() < 0.5 ? '#ffb347' : '#ff6a3d', r: 3, form: 'kreis', schwere: -40 });
                }
                const nah = f.x > einhorn.x + 4 && f.x < einhorn.x + einhorn.width + f.r &&
                            f.y > einhorn.y - f.r * 0.5 && f.y < einhorn.y + einhorn.height + f.r * 0.5;
                if (nah) {
                    feuerbaelle.splice(i, 1);
                    if (unverwundbarTimer > 0) {
                        partikelExplosion(f.x, f.y, 8, ['#ffffff', '#7dffe0'], 'stern');
                    } else if (schutzTimer <= 0) {
                        treffer('feuer');
                    }
                    continue;
                }
                if (f.x < -40 || f.y < -40 || f.y > H + 40) feuerbaelle.splice(i, 1);
            }
        }

        function bossPose(b) {
            if (b.besiegt || b.trefferBlink > 0) return 'getroffen';
            if (b.feuerAnim > 0) return 'feuer';
            if (b.feuerTimer < 0.7) return 'angriff';
            return FLUG_ZYKLUS[Math.floor(spielRahmen / 9) % 4];
        }
        const BOSS_MASSSTAB = 235 / 211;

        function zeichneKrone(x, y, groesse) {
            ctx.save();
            ctx.translate(x, y);
            const s = groesse / 24;
            ctx.scale(s, s);
            const g = ctx.createLinearGradient(0, -12, 0, 8);
            g.addColorStop(0, '#fff2b0');
            g.addColorStop(0.5, '#f2c23c');
            g.addColorStop(1, '#a8720e');
            ctx.fillStyle = g;
            ctx.strokeStyle = '#6e4a08';
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(-12, 8); ctx.lineTo(-13, -6); ctx.lineTo(-6, 0); ctx.lineTo(0, -11);
            ctx.lineTo(6, 0); ctx.lineTo(13, -6); ctx.lineTo(12, 8);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#e8304f';
            ctx.beginPath(); ctx.arc(0, 3, 2.2, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#3fb8ff';
            ctx.beginPath(); ctx.arc(-7, 4, 1.5, 0, Math.PI * 2); ctx.arc(7, 4, 1.5, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        function zeichneFeuerball(f) {
            if (drachenAtlas.bereit) {
                const bild = drachenAtlas.v.rot[Math.floor(spielRahmen / 4) % 2 ? 'f3' : 'f2'];
                const b = 64, h = b * bild.height / bild.width;
                ctx.save();
                ctx.translate(f.x, f.y);
                ctx.rotate(Math.atan2(f.vy, f.vx));
                ctx.drawImage(bild, -b * 0.82, -h / 2, b, h);
                ctx.restore();
                return;
            }
            const g = ctx.createRadialGradient(f.x - 3, f.y - 3, 1, f.x, f.y, f.r * 1.4);
            g.addColorStop(0, '#fff6b0');
            g.addColorStop(0.45, '#ffb347');
            g.addColorStop(1, 'rgba(255, 70, 40, 0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(f.x, f.y, f.r * 1.4, 0, Math.PI * 2);
            ctx.fill();
        }

        function zeichneBoss() {
            if (!boss) return;
            const b = boss;
            if (drachenAtlas.bereit) {
                ctx.save();
                if (b.trefferBlink > 0 && Math.floor(spielRahmen / 4) % 2 === 0) ctx.globalAlpha = 0.45;
                const kopf = zeichneDrachenPose('lila', bossPose(b), b.x + BOSS_B / 2, b.y + BOSS_H / 2, BOSS_MASSSTAB, b.drehung);
                if (!b.besiegt) zeichneKrone(kopf.x + 4, kopf.y - kopf.h * 0.12, 30);
                ctx.restore();
                b.maul = { x: kopf.x - 14, y: kopf.y + 6 };
                for (const f of feuerbaelle) zeichneFeuerball(f);
                return;
            }
            ctx.save();
            if (b.trefferBlink > 0 && Math.floor(spielRahmen / 4) % 2 === 0) ctx.globalAlpha = 0.4;
            ctx.translate(b.x + BOSS_B / 2, b.y + BOSS_H / 2);
            ctx.rotate(b.drehung);
            ctx.translate(-BOSS_B / 2, -BOSS_H / 2);
            ctx.scale(2, 2);
            zeichneDrache({ x: 0, y: 0, phase: b.phase, verscheucht: b.besiegt, drehung: 0, verfolgt: false, boss: true });
            // Krone
            ctx.fillStyle = '#ffd34d';
            ctx.strokeStyle = '#b8860b';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(11, 9);
            ctx.lineTo(10, -1); ctx.lineTo(14, 4);
            ctx.lineTo(17, -4); ctx.lineTo(20, 4);
            ctx.lineTo(24, -1); ctx.lineTo(24, 9);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#ff4d7a';
            ctx.beginPath(); ctx.arc(17, 5, 1.6, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#4dd2ff';
            ctx.beginPath(); ctx.arc(12.5, 6, 1.1, 0, Math.PI * 2); ctx.arc(21.5, 6, 1.1, 0, Math.PI * 2); ctx.fill();
            glanzlicht(14, 1, 1.2, 0.6, -0.5, 0.9);
            ctx.restore();

            for (const f of feuerbaelle) zeichneFeuerball(f);
        }

        function zeichneBossLeiste() {
            if (!boss || boss.besiegt) return;
            ctx.fillStyle = 'rgba(14, 12, 34, 0.65)';
            ctx.beginPath();
            ctx.roundRect(W / 2 - 130, 10, 260, 40, 12);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = '16px Spielschrift, Arial';
            ctx.textAlign = 'left';
            ctx.fillText('Drachenkönig', W / 2 - 115, 36);
            for (let i = 0; i < 3; i++) {
                ctx.fillStyle = i < boss.leben ? '#ffd34d' : 'rgba(255, 255, 255, 0.25)';
                zeichneFunkeln(W / 2 + 40 + i * 30, 30, 5);
            }
        }

        function resetSpiel() {
            score = 0;
            level = 1;
            sterne = [];
            hindernisse = [];
            drachen = [];
            drachenTimer = 0;
            levelHinweis = { text: '', unter: '', zeit: 0 };
            absturzGrund = 'wolke';
            einhorn.y = 150;
            einhorn.velocity = 0;
            spielRahmen = 0;
            unverwundbarTimer = 0;
            schutzTimer = 0;
            herzen = MAX_HERZEN;
            spielZeit = 0;
            neuerRekord = false;
            weltAnzeige = 0;
            sternErzeugungsTimer = 0;
            hindernisErzeugungsTimer = 0;
            partikel = [];
            schwebeTexte = [];
            komboZaehler = 0;
            komboTimer = 0;
            wackelZeit = 0;
            blitzZeit = 0;
            magnetTimer = 0;
            schildAktiv = false;
            schildTimer = 0;
            levelUpAusstehend = null;
            levelUpInfo = null;
            bossPhase = false;
            boss = null;
            feuerbaelle = [];
        }

        function beendeSpiel(neuerZustand) {
            zustand = neuerZustand;
            eingabeGesperrtBis = performance.now() + SPERRZEIT_MS;
            Klang.musikStopp();
            inBestenlisteEintragen(neuerZustand === 'sieg');

            if (neuerZustand === 'sieg') Klang.spiele('sieg');
            else if (neuerRekord) Klang.spiele('rekord');
            else Klang.spiele('gameover');
        }

        function einsammeln(st) {
            const x = st.x, y = st.y;
            if (st.typ === 'herz') {
                herzen = Math.min(MAX_HERZEN, herzen + 1);
                Klang.spiele('herz');
                partikelExplosion(x, y, 6, ['#ff4d7a', '#ff8ab0'], 'herz', 160);
                schwebeText(x, y - 10, '+1 Herz', '#ff8ab0', 18);
                return;
            }
            if (st.typ === 'magnet') {
                magnetTimer = MAGNET_DAUER;
                Klang.spiele('magnet');
                partikelExplosion(x, y, 14, ['#ff4d5e', '#ffffff', '#e8eef5'], 'stern');
                schwebeText(x, y - 10, 'Sternen-Magnet!', '#ff8a98', 20);
                return;
            }
            if (st.typ === 'schild') {
                schildAktiv = true;
                schildTimer = SCHILD_DAUER;
                Klang.spiele('schild');
                partikelExplosion(x, y, 14, ['#9fd6ff', '#ffffff'], 'kreis');
                schwebeText(x, y - 10, 'Schutzschild!', '#bfe6ff', 20);
                return;
            }

            // Sterne zählen für die Kombo
            komboZaehler++;
            komboTimer = 1.8;
            if (st.typ === 'kraft') {
                unverwundbarTimer = 420;
                score += 2;
                Klang.spiele('kraft');
                partikelExplosion(x, y, 24, ['#ff6ad5', '#ffd34d', '#7dffe0', '#8f7dff', '#ffffff'], 'stern', 300);
                schwebeText(x, y - 10, bossPhase ? 'Regenbogen-Kraft! Greif an!' : '+2 Regenbogen!', '#7dffe0', 20);
            } else {
                score += 1;
                Klang.spiele('stern', 1 + Math.min(komboZaehler, 12) * 0.04);
                partikelExplosion(x, y, 10, ['#ffe14d', '#fff6b0', '#ffffff'], 'stern', 200);
                schwebeText(x, y - 10, '+1', '#ffe14d', 20);
            }
            if (komboZaehler % 5 === 0) {
                score += 1;
                Klang.spiele('kombo');
                schwebeText(einhorn.x + 50, einhorn.y - 15, 'Kombo x' + komboZaehler + '!  +1', '#ffd34d', 24);
            }

            // Level & Finale
            if (!bossPhase && score >= 100) {
                if (!levelUpAusstehend) levelUpAusstehend = FINALE_INFO;
                return;
            }
            if (!bossPhase) {
                const neuesLevel = Math.min(10, Math.floor(score / 10) + 1);
                if (neuesLevel > level) {
                    const alteWelt = weltFuerLevel(level);
                    level = neuesLevel;
                    const neueWelt = weltFuerLevel(level);
                    levelUpAusstehend = levelInfo(level, neueWelt !== alteWelt ? neueWelt : null);
                    Klang.spiele('level');
                }
            }
        }

        function treffer(grund) {
            if (schildAktiv) {
                // Schutzschild fängt den Treffer ab
                schildAktiv = false;
                schildTimer = 0;
                schutzTimer = 1.2;
                Klang.spiele('schildWeg');
                wackeln(4, 0.2);
                partikelExplosion(einhorn.x + 35, einhorn.y + 22, 18, ['#bfe6ff', '#ffffff', '#7cc4ff'], 'kreis', 260);
                schwebeText(einhorn.x + 40, einhorn.y - 5, 'Schild hat dich gerettet!', '#bfe6ff', 18);
                return;
            }
            herzen--;
            komboZaehler = 0;
            Klang.spiele('treffer');
            wackeln(9, 0.35);
            blitzZeit = 0.3;
            if (herzen <= 0) {
                absturzGrund = grund;
                beendeSpiel('gameover');
            } else {
                schutzTimer = 2;
                levelHinweis = {
                    text: 'Autsch!',
                    unter: herzen === 1 ? 'Nur noch 1 Herz – pass auf!' : 'Noch ' + herzen + ' Herzen',
                    zeit: 1.6
                };
            }
        }

        function formatZeit(sek) {
            const m = Math.floor(sek / 60);
            const s = Math.floor(sek % 60);
            return m + ':' + String(s).padStart(2, '0');
        }

        function zeichneErgebnisZeile(y) {
            ctx.save();
            ctx.textAlign = 'center';
            ctx.font = '19px Spielschrift, Arial';
            if (neuerRekord) {
                ctx.fillStyle = Math.floor(spielRahmen / 15) % 2 === 0 ? '#ffe14d' : '#ffffff';
                ctx.fillText('★ Neuer Rekord! ★', W / 2, y);
            } else if (letzterPlatz > 0) {
                ctx.fillStyle = '#ffe9a8';
                ctx.fillText('Platz ' + letzterPlatz + ' in der Bestenliste!', W / 2, y);
            } else if (bestenliste.length > 0) {
                ctx.fillStyle = '#ffe9a8';
                ctx.fillText('Rekord: ' + bestenliste[0].sterne + ' Sterne', W / 2, y);
            }
            ctx.restore();
        }

        function zeichneGrossesEinhorn(cx, cy, groesse) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(groesse, groesse);
            zeichnePixelEinhorn(-35, -25);
            ctx.restore();
        }

        // ===== BILDSCHIRME =====
        function zeichneHauptmenue() {
            ctx.fillStyle = 'rgba(14, 12, 34, 0.22)';
            ctx.fillRect(0, 0, W, H);

            konturText('Die Abenteuer von', W / 2, 46, '24px Spielschrift, Arial');
            konturText('Johanni und Glacier', W / 2, 94, '46px Spielschrift, Arial', '#ffe08a', '#1e1638', 8);

            // Glacier mit Johanni links, schwebt sanft
            const schwebeY = 228 + Math.sin(spielRahmen * 0.05) * 10;
            ctx.save();
            ctx.translate(215, 0);
            ctx.scale(2.2, 1);
            zeichneBodenschatten(0, schwebeY + 60);
            ctx.restore();
            zeichneGrossesEinhorn(215, schwebeY, 2.3);

            const kx = 465, kb = 280;
            zeichneKnopf('Spiel beginnen', kx, 130, kb, '#ffdf00', spielStarten);
            zeichneKnopf('Bestenliste', kx, 198, kb, '#8ee8f2', () => { zustand = 'bestenliste'; });
            zeichneKnopf('Beenden', kx, 266, kb, '#ffb8dc', appBeenden);

            if (bestenliste.length > 0) {
                konturText('Rekord: ' + bestenliste[0].sterne + ' Sterne', kx + kb / 2, 350,
                    '18px Spielschrift, Arial', '#ffe14d', '#1e1638', 5);
            }
            ctx.save();
            ctx.font = '12px Arial';
            ctx.textAlign = 'right';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fillText('Version ' + SPIEL_VERSION, W - 10, 18);
            ctx.restore();
            konturText('Tippen = fliegen  ·  100 Sterne sammeln  ·  dann wartet der Drachenkönig!',
                W / 2, 388, '14px Spielschrift, Arial', '#ffffff', '#1e1638', 4);
        }

        function zeichneBestenliste() {
            ctx.fillStyle = 'rgba(14, 12, 34, 0.6)';
            ctx.fillRect(0, 0, W, H);
            konturText('★ Bestenliste ★', W / 2, 52, '34px Spielschrift, Arial', '#ffe14d');

            ctx.fillStyle = 'rgba(255, 255, 255, 0.14)';
            ctx.beginPath();
            ctx.roundRect(110, 70, 580, 230, 16);
            ctx.fill();

            const spalten = [150, 255, 365, 490, 625];
            ctx.font = '16px Spielschrift, Arial';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#ffd6ef';
            ['Platz', 'Sterne', 'Level', 'Ergebnis', 'Datum'].forEach((t, i) => ctx.fillText(t, spalten[i], 100));

            if (bestenliste.length === 0) {
                ctx.fillStyle = '#ffffff';
                ctx.font = '19px Arial';
                ctx.fillText('Noch keine Einträge – flieg los und sammle Sterne!', W / 2, 190);
            }

            const medaillen = ['#ffd700', '#e3e3e3', '#e8a165'];
            bestenliste.forEach((e, i) => {
                const y = 138 + i * 33;
                ctx.font = '19px Spielschrift, Arial';
                ctx.fillStyle = medaillen[i] || '#ffffff';
                ctx.fillText((i < 3 ? '★ ' : '') + (i + 1) + '.', spalten[0], y);
                ctx.fillStyle = '#ffffff';
                ctx.fillText(String(e.sterne), spalten[1], y);
                ctx.font = '18px Arial';
                ctx.fillText(String(e.level), spalten[2], y);
                ctx.fillText(e.sieg ? 'Sieg in ' + formatZeit(e.zeit) : '–', spalten[3], y);
                let datum = '–';
                if (e.datum) {
                    const d = new Date(e.datum);
                    datum = String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear();
                }
                ctx.fillText(datum, spalten[4], y);
            });

            zeichneKnopf('Zurück', W / 2 - 120, 320, 240, '#ffdf00', () => { zustand = 'menue'; });
        }

        function zeichnePause() {
            if (standbild) {
                ctx.save();
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.drawImage(standbild, 0, 0, canvas.width, canvas.height);
                ctx.restore();
            }
            ctx.fillStyle = 'rgba(14, 12, 34, 0.55)';
            ctx.fillRect(0, 0, W, H);
            konturText('Pause', W / 2, 115, '46px Spielschrift, Arial');
            zeichneKnopf('Weiter fliegen', W / 2 - 140, 160, 280, '#ffdf00', weiterSpielen);
            zeichneKnopf('Hauptmenü', W / 2 - 140, 228, 280, '#ffb8dc', zumHauptmenue);
            ctx.fillStyle = '#ffffff';
            ctx.font = '15px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Im Hauptmenü kommen deine Sterne trotzdem in die Bestenliste.', W / 2, 330);
        }

        function zeichneGameOver() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.72)';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.font = '34px Spielschrift, Arial';
            const grundTexte = { drache: 'Oje, ein Drache hat euch erwischt!', wolke: 'Oje, in eine Wolke geflogen!',
                                 feuer: 'Autsch, ein Feuerball!', boss: 'Der Drachenkönig war zu stark!' };
            ctx.fillText(grundTexte[absturzGrund] || grundTexte.wolke, W / 2, 110);
            ctx.font = '20px Arial';
            ctx.fillText('Glacier und Johanni müssen sich kurz ausruhen.', W / 2, 155);
            ctx.fillText('Ihr hattet ' + score + ' Sterne und habt Level ' + level + ' erreicht!', W / 2, 185);
            zeichneErgebnisZeile(225);

            if (performance.now() >= eingabeGesperrtBis) {
                zeichneKnopf('Nochmal fliegen!', W / 2 - 290, 262, 270, '#ffdf00', spielStarten);
                zeichneKnopf('Hauptmenü', W / 2 + 20, 262, 270, '#ffb8dc', () => { zustand = 'menue'; });
            }
        }

        function zeichneSieg() {
            ctx.fillStyle = 'rgba(30, 22, 60, 0.85)';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.font = '36px Spielschrift, Arial';
            ctx.fillText('Du hast es geschafft, Johanni!', W / 2, 100);
            ctx.font = '19px Arial';
            ctx.fillText('Du hast den Drachenkönig besiegt und den Himmel gerettet. Du bist eine Heldin!', W / 2, 145);
            ctx.fillText('Deine Zeit: ' + formatZeit(spielZeit), W / 2, 178);
            zeichneErgebnisZeile(220);

            if (performance.now() >= eingabeGesperrtBis) {
                zeichneKnopf('Nochmal spielen', W / 2 - 290, 262, 270, '#00ffcc', spielStarten);
                zeichneKnopf('Hauptmenü', W / 2 + 20, 262, 270, '#ffdf00', () => { zustand = 'menue'; });
            }
        }

        function zeichneTschuess() {
            ctx.fillStyle = 'rgba(14, 12, 34, 0.45)';
            ctx.fillRect(0, 0, W, H);
            konturText('Bis bald, Johanni!', W / 2, 90, '40px Spielschrift, Arial');
            zeichneGrossesEinhorn(W / 2, 185, 2);
            konturText('Du kannst die App jetzt schließen.', W / 2, 282, '18px Spielschrift, Arial', '#ffffff', '#1e1638', 5);
            zeichneKnopf('Zurück zum Menü', W / 2 - 130, 310, 260, '#ffdf00', () => { zustand = 'menue'; });
        }

        function update(zeitstempel) {
            // echte vergangene Zeit seit dem letzten Bild (max. 50 ms)
            if (letzteZeit === null) letzteZeit = zeitstempel;
            dt = Math.min((zeitstempel - letzteZeit) / 1000, 0.05);
            letzteZeit = zeitstempel;
            spielRahmen += dt * 60;
            knoepfe = [];

            // Pause-Knopf nur während des Spiels zeigen
            const pauseSichtbar = zustand === 'spiel' ? 'flex' : 'none';
            if (pauseKnopf.style.display !== pauseSichtbar) pauseKnopf.style.display = pauseSichtbar;

            if (zustand === 'pause' || zustand === 'levelup') {
                if (zustand === 'pause') zeichnePause(); else zeichneLevelUp();
                requestAnimationFrame(update);
                return;
            }

            // Hintergrund scrollt im Spiel normal, in den Menüs gemächlich
            // Welttempo: im Spiel so schnell wie Wolken & Sterne (Vordergrund klebt am Boden),
            // in den Menüs gemütlicher Schritt, sonst Stillstand
            if (zustand === 'spiel') weltTempo = (140 + level * 25) * (bossPhase ? 0.7 : 1);
            else if (zustand === 'menue' || zustand === 'bestenliste' || zustand === 'tschuess') weltTempo = 45;
            else weltTempo = 0;
            weltPosition += weltTempo * dt;

            // Welt läuft weich zur Tageszeit des aktuellen Levels
            const imSpiel = zustand === 'spiel' || zustand === 'gameover' || zustand === 'sieg' || zustand === 'levelup';
            const zielWelt = imSpiel ? weltFuerLevel(level) : 0;
            if (weltAnzeige < zielWelt) weltAnzeige = Math.min(zielWelt, weltAnzeige + dt * 0.5);
            if (weltAnzeige > zielWelt) weltAnzeige = Math.max(zielWelt, weltAnzeige - dt * 2);

            if (zustand === 'spiel') {
                if (unverwundbarTimer > 0) unverwundbarTimer -= dt * 60;
                if (schutzTimer > 0) schutzTimer -= dt;
                if (magnetTimer > 0) magnetTimer -= dt;
                if (schildAktiv) {
                    schildTimer -= dt;
                    if (schildTimer <= 0) schildAktiv = false;
                }
            }

            // Bildschirm-Wackeln bei Treffern
            ctx.save();
            if (wackelZeit > 0 && zustand === 'spiel') {
                const st = wackelStaerke * Math.min(1, wackelZeit / 0.3);
                ctx.translate((Math.random() - 0.5) * 2 * st, (Math.random() - 0.5) * 2 * st);
            }

            zeichneHintergrund();

            if (zustand === 'spiel') {
                spielZeit += dt;
                einhorn.velocity += einhorn.gravity * dt;
                einhorn.y += einhorn.velocity * dt;
                if (einhorn.y + einhorn.height > BODEN_Y) { einhorn.y = BODEN_Y - einhorn.height; einhorn.velocity = 0; }
                if (einhorn.y < 0) { einhorn.y = 0; einhorn.velocity = 0; }

                sternErzeugungsTimer += dt;
                if (sternErzeugungsTimer >= (bossPhase ? 2.2 : 1.7)) {
                    erstelleStern();
                    sternErzeugungsTimer = 0;
                }

                if (!bossPhase) {
                    hindernisErzeugungsTimer += dt;
                    const takt = Math.max(1.1, 2.8 - (level * 0.2));
                    if (hindernisErzeugungsTimer >= takt) {
                        erstelleHindernis();
                        hindernisErzeugungsTimer = 0;
                    }
                }

                zeichneBodenschatten(einhorn.x + 35, einhorn.y + einhorn.height);

                for (let i = hindernisse.length - 1; i >= 0; i--) {
                    const w = hindernisse[i];
                    w.x -= (w.baseSpeed + level * 25) * dt;
                    zeichneFiligraneWolke(w.x, w.y, w.width, w.height);
                    if (einhorn.x < w.x + w.width * 0.85 &&
                        einhorn.x + einhorn.width > w.x + w.width * 0.15 &&
                        einhorn.y < w.y + w.height * 0.85 &&
                        einhorn.y + einhorn.height > w.y + w.height * 0.15
                    ) {
                        if (unverwundbarTimer <= 0 && schutzTimer <= 0 && zustand === 'spiel') {
                            treffer('wolke');
                        }
                    }
                    if (w.x < -w.width) hindernisse.splice(i, 1);
                }

                aktualisiereDrachen();
                aktualisiereBoss();
                zeichneBoss();

                // Sammelobjekte
                const gx = einhorn.x + 35, gy = einhorn.y + 25;
                for (let i = sterne.length - 1; i >= 0; i--) {
                    const st = sterne[i];
                    if (magnetTimer > 0 && st.typ !== 'magnet') {
                        const dx = gx - st.x, dy = gy - st.y;
                        const d = Math.hypot(dx, dy);
                        if (d < 280 && d > 1) {
                            st.x += dx / d * 520 * dt;
                            st.y += dy / d * 520 * dt;
                        }
                    }
                    st.x -= (st.baseSpeed + level * 25) * dt;
                    zeichneSammelobjekt(st);

                    const getroffen =
                        st.x + st.radius > einhorn.x && st.x - st.radius < einhorn.x + einhorn.width &&
                        st.y + st.radius > einhorn.y && st.y - st.radius < einhorn.y + einhorn.height;
                    if (getroffen && zustand === 'spiel') {
                        sterne.splice(i, 1);
                        einsammeln(st);
                        continue;
                    }
                    if (st.x < -30) sterne.splice(i, 1);
                }

                zeichnePixelEinhorn(einhorn.x, einhorn.y);
                zeichnePowerUpEffekte();
                aktualisiereEffekte();
                zeichnePartikel();

                // Hinweistext (z. B. nach Treffern)
                if (levelHinweis.zeit > 0) {
                    levelHinweis.zeit -= dt;
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, Math.min(1, levelHinweis.zeit));
                    konturText(levelHinweis.text, W / 2, 150, '26px Spielschrift, Arial');
                    if (levelHinweis.unter) konturText(levelHinweis.unter, W / 2, 180, '18px Spielschrift, Arial', '#ffffff', '#1e1638', 5);
                    ctx.restore();
                }
            }
            ctx.restore();

            if (zustand === 'spiel' || zustand === 'gameover' || zustand === 'sieg') {
                if (blitzZeit > 0) {
                    ctx.fillStyle = `rgba(255, 60, 90, ${0.35 * blitzZeit / 0.3})`;
                    ctx.fillRect(0, 0, W, H);
                }
            }

            if (zustand === 'spiel') {
                // Anzeige rechts oben
                ctx.fillStyle = 'rgba(14, 12, 34, 0.35)';
                ctx.beginPath();
                ctx.roundRect(W - 200, 8, 192, 60, 12);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'left';
                ctx.font = '18px Spielschrift, Arial';
                ctx.fillText('★ Sterne: ' + score + (bossPhase ? '' : ' / 100'), W - 188, 32);
                ctx.fillText(bossPhase ? 'Finale' : 'Level: ' + level, W - 188, 56);
                for (let h = 0; h < MAX_HERZEN; h++) {
                    zeichneHerz(W - 78 + h * 24, 50, 18, h < herzen);
                }
                zeichneBossLeiste();
                zeichnePowerUpLeiste();

                // Level-Aufstieg erst am Ende des Bildes zeigen, damit das Standbild vollständig ist
                if (levelUpAusstehend) {
                    const info = levelUpAusstehend;
                    levelUpAusstehend = null;
                    zeigeLevelUp(info);
                }
            }

            if (zustand === 'menue') zeichneHauptmenue();
            else if (zustand === 'bestenliste') zeichneBestenliste();
            else if (zustand === 'gameover') zeichneGameOver();
            else if (zustand === 'sieg') zeichneSieg();
            else if (zustand === 'tschuess') zeichneTschuess();

            requestAnimationFrame(update);
        }
    </script>
    <script>
        // Offline-Funktion aktivieren (nur wenn die Seite über das Internet geladen wurde)
        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
