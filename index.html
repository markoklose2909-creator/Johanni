        // zeichnet ein Icon zentriert; groesse = Höhe des Bildausschnitts inkl. Leuchten
        function zeichneIcon(name, cx, cy, groesse, drehung, alpha) {
            const [x, y, b, h] = ICON_TEILE[name];
            const hh = groesse, bb = b * hh / h;
            ctx.save();
            if (alpha != null) ctx.globalAlpha *= alpha;
            ctx.translate(cx, cy);
            if (drehung) ctx.rotate(drehung);
            ctx.drawImage(iconBild, x, y, b, h, -bb / 2, -hh / 2, bb, hh);
            ctx.restore();
        }

        function zeichneSammelobjekt(st) {
            const wippen = Math.sin(spielRahmen / 10 + st.x / 60) * 3;
            if (iconsBereit) {
                const puls = 1 + Math.sin(spielRahmen / 12 + st.x / 40) * 0.05;
                const name = { stern: 'stern', kraft: 'regenbogen', herz: 'herz', magnet: 'magnet', schild: 'schild' }[st.typ] || 'stern';
                const groesse = (st.typ === 'stern' ? 54 : 62) * puls;
                zeichneIcon(name, st.x, st.y + wippen, groesse, st.typ === 'stern' ? Math.sin(spielRahmen / 30 + st.x) * 0.15 : 0);
                return;
            }
            if (st.typ === 'herz') zeichneHerz(st.x, st.y + wippen, 26, true);
            else if (st.typ === 'magnet') zeichneMagnetSymbol(st.x, st.y + wippen, 30);
            else if (st.typ === 'schild') zeichneSchildSymbol(st.x, st.y + wippen, 34);
            else zeichneEchtenStern(st.x, st.y, 5, st.radius, st.radius / 2, st.typ === 'kraft');
        }

        // Prüft, ob ein Bereich am rechten Rand mit einer Wolke kollidiert (mit Sicherheitsabstand)
        function wolkeImWeg(x, y, radius) {
            const rand = 28;
            return hindernisse.some(w =>
                x + radius + rand > w.x && x - radius - rand < w.x + w.width &&
                y + radius + rand > w.y && y - radius - rand < w.y + w.height);
        }

        function erstelleStern(typ) {
            // freie Höhe suchen, damit kein Stern oder Bonus in einer Wolke steckt
            let yPosition = 0, frei = false;
            for (let versuch = 0; versuch < 15 && !frei; versuch++) {
                yPosition = Math.random() * (BODEN_Y - 100) + 40;
                frei = !wolkeImWeg(W + 20, yPosition, 20);
            }
            if (!frei) return;   // kein Platz – beim nächsten Mal wieder versuchen
            if (!typ) {
                const r = Math.random();
                typ = 'stern';
                if (bossPhase) {
                    if (herzen < MAX_HERZEN && r < 0.12) typ = 'herz';
                } else if (r < 0.13) typ = 'kraft';
                else if (level >= 2 && r < 0.19 && magnetTimer <= 0) typ = 'magnet';
                else if (level >= 4 && r < 0.25 && !schildAktiv) typ = 'schild';
                else if (herzen < MAX_HERZEN && r < 0.31) typ = 'herz';
            }
            sterne.push({
                x: W + 20,
                y: yPosition,
                radius: typ === 'stern' ? 15 : 18,
                baseSpeed: 140,
                typ: typ
            });
        }

        function erstelleHindernis() {
            const breite = 85;
            const hoehe = 60 + Math.random() * 40;
            // Wolke nicht über einen gerade erschienenen Stern oder Bonus legen
            let yPosition = 0;
            for (let versuch = 0; versuch < 15; versuch++) {
                yPosition = Math.random() * (H - hoehe);
                const blockiert = sterne.some(st =>
                    st.x > W - 140 &&
                    st.y + st.radius + 28 > yPosition && st.y - st.radius - 28 < yPosition + hoehe);
                if (!blockiert) break;
            }
            hindernisse.push({ 
                x: W, 
                y: yPosition, 
                width: breite, 
                height: hoehe, 
                baseSpeed: 140 
            });
        }


        // ===== DRACHEN =====
        // Ab Level 3 fliegen Drachen auf Glacier zu. Mit jedem Level kommen
        // sie öfter, schneller und mit größeren Wellenbewegungen.
        // Ab Level 7 versuchen manche, Glacier zu verfolgen.
        const DRACHE_B = 80;
        const DRACHE_H = 50;

        function drachenEinstellung(lvl) {
            if (lvl < 3) return null;
            const stufe = lvl - 3;
            return {
                takt: Math.max(2.0, 5.5 - stufe * 0.5),   // Sekunden zwischen Drachen
                tempo: 230 + stufe * 25,                  // Pixel pro Sekunde
                amplitude: 15 + stufe * 7,                // Höhe der Wellenbewegung
                wellenTempo: 2 + stufe * 0.25,
                verfolgerChance: lvl >= 7 ? 0.25 + (lvl - 7) * 0.1 : 0
            };
        }

        function erstelleDrache(e) {
            // Startposition so wählen, dass keine undurchdringliche Wand
            // mit einer gerade erschienenen Wolke entsteht
            let y = 0;
            for (let versuch = 0; versuch < 12; versuch++) {
                y = 30 + Math.random() * (H - DRACHE_H - 60);
                const blockiert = hindernisse.some(w =>
                    w.x > W - 260 &&
                    y + DRACHE_H + 50 > w.y && y - 50 < w.y + w.height);
                if (!blockiert) break;
            }
            Klang.spiele('warnung');
            drachen.push({
                x: W + 10,
                basisY: y,
                y: y,
                phase: Math.random() * Math.PI * 2,
                tempo: e.tempo,
                amplitude: e.amplitude,
                wellenTempo: e.wellenTempo,
                verfolgt: Math.random() < e.verfolgerChance,
                warnung: 0.9,          // Sekunden Vorwarnung am rechten Rand
                verscheucht: false,
                drehung: 0
            });
        }

        function zeichneWarnung(y, verfolgt) {
            if (Math.floor(spielRahmen / 6) % 2 === 0) return;
            const cx = W - 26, cy = y + DRACHE_H / 2;
            ctx.save();
            ctx.fillStyle = verfolgt ? '#ff5a5a' : '#ff9a3c';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(cx, cy, 16, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#ffffff';
            ctx.font = '22px Spielschrift, Arial';
            ctx.textAlign = 'center';
            ctx.fillText('!', cx, cy + 8);
            ctx.restore();
        }

        // ===== DRACHEN ALS BILDER =====
        // Alle Posen liegen in einer Bilddatei (drachen.png). Daraus entstehen beim Laden
        // drei Farbvarianten: türkis (normale Drachen), rot (Verfolger), lila (Drachenkönig).
        const DRACHEN_TEILE = {"oben": [0, 0, 211, 150], "unten": [215, 0, 232, 145], "idle": [451, 0, 224, 151], "angriff": [679, 0, 225, 165], "feuer": [0, 169, 312, 163], "getroffen": [316, 169, 198, 171], "f1": [518, 169, 112, 44], "f2": [634, 169, 114, 54], "f3": [752, 169, 154, 64]};
        // Schnauzenspitze je Pose (Anteil von Breite/Höhe im Originalbild, Blick nach rechts),
        // aus den Bildern ausgemessen – dient als fester Ankerpunkt gegen Zittern
        const DRACHEN_KOPF = { oben: [0.995, 0.48], unten: [0.996, 0.421], idle: [0.991, 0.411], angriff: [0.996, 0.567], feuer: [0.696, 0.454], getroffen: [0.995, 0.567] };
        const DRACHE_MASSSTAB = 100 / 211;
        const drachenAtlas = { bild: new Image(), bereit: false, v: {} };
        drachenAtlas.bild.onload = () => {
            const farben = { rot: null, tuerkis: '#1fb3a6', lila: '#8a4be0' };
            for (const [variante, farbe] of Object.entries(farben)) {
                drachenAtlas.v[variante] = {};
                for (const [name, [x, y, b, h]] of Object.entries(DRACHEN_TEILE)) {
                    if (name[0] === 'f' && name.length === 2 && variante !== 'rot') continue;   // Feuer nur einmal
                    const c = document.createElement('canvas');
                    c.width = b; c.height = h;
                    const g = c.getContext('2d');
                    g.drawImage(drachenAtlas.bild, x, y, b, h, 0, 0, b, h);
                    if (farbe) {
                        g.globalCompositeOperation = 'hue';
                        g.fillStyle = farbe;
                        g.fillRect(0, 0, b, h);
                        if (variante === 'lila') {
                            g.globalCompositeOperation = 'multiply';
                            g.fillStyle = '#c9b8e8';
                            g.fillRect(0, 0, b, h);
                        }
                        g.globalCompositeOperation = 'destination-in';
                        g.drawImage(drachenAtlas.bild, x, y, b, h, 0, 0, b, h);
                        if (name === 'feuer') {
                            // Feueratem rechts vom Maul in Originalfarbe zurückholen
                            const ab = Math.round(b * 0.7);
                            g.globalCompositeOperation = 'source-over';
                            g.clearRect(ab, 0, b - ab, h);
                            g.drawImage(drachenAtlas.bild, x + ab, y, b - ab, h, ab, 0, b - ab, h);
                        }
                    }
                    drachenAtlas.v[variante][name] = c;
                }
            }
            drachenAtlas.bereit = true;
        };
        if (location.protocol.startsWith('http')) drachenAtlas.bild.src = 'drachen.png';

        const FLUG_ZYKLUS = ['oben', 'idle', 'unten', 'idle'];
        function flugPose(phase) {
            return FLUG_ZYKLUS[Math.floor(Math.abs(spielRahmen / 8 + phase * 3)) % 4];
        }

        // Zeichnet eine Drachen-Pose gespiegelt (Blick nach links), zentriert auf (cx, cy)
        // Die Posen sind unterschiedlich groß zugeschnitten. Damit der Drache beim
        // Flügelschlag nicht zittert, wird jede Pose so verschoben, dass der Kopf
        // immer an derselben Stelle bleibt (Bezug: Pose „oben“).
        function zeichneDrachenPose(variante, pose, cx, cy, massstab, drehung) {
            const bild = drachenAtlas.v[variante][pose];
            const b = bild.width * massstab, h = bild.height * massstab;
            const ref = DRACHEN_TEILE.oben, kRef = DRACHEN_KOPF.oben;
            const refB = ref[2] * massstab, refH = ref[3] * massstab;
            // Kopf der Referenzpose relativ zur Mitte (vor dem Spiegeln)
            const kopfX = (kRef[0] - 0.5) * refB, kopfY = -refH * 0.55 + kRef[1] * refH;
            const k = DRACHEN_KOPF[pose] || kRef;
            const links = kopfX - k[0] * b, oben = kopfY - k[1] * h;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(drehung || 0);
            ctx.scale(-1, 1);
            ctx.drawImage(bild, links, oben, b, h);
            ctx.restore();
            // Kopfposition (gespiegelt) zurückgeben, z. B. für Krone oder Feuer
            return { x: cx - kopfX, y: cy + kopfY, b: b, h: h };
        }

        function zeichneDrache(d) {
            if (drachenAtlas.bereit && !d.boss) {
                const pose = d.verscheucht ? 'getroffen' : flugPose(d.phase);
                zeichneDrachenPose(d.verfolgt ? 'rot' : 'tuerkis', pose,
                    d.x + DRACHE_B / 2, d.y + DRACHE_H / 2, DRACHE_MASSSTAB, d.drehung);
                return;
            }
            const t = spielRahmen / 60;
            const umriss = d.boss ? '#4b2a7a' : (d.verfolgt ? '#7a2b2b' : '#2f7a50');
            const koerper = d.boss ? '#a77be6' : (d.verfolgt ? '#ff7d6b' : '#5cc98a');
            ctx.save();
            ctx.translate(d.x + DRACHE_B / 2, d.y + DRACHE_H / 2);
            ctx.rotate(d.drehung);
            ctx.translate(-DRACHE_B / 2, -DRACHE_H / 2);
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.lineWidth = 2;

            // Schwanz mit Spitze (nach rechts, Drache schaut nach links)
            ctx.strokeStyle = umriss;
            ctx.lineWidth = 9;
            ctx.beginPath();
            const wedeln = Math.sin(t * 6 + d.phase) * 5;
            ctx.moveTo(52, 30);
            ctx.quadraticCurveTo(68, 34 + wedeln, 76, 24 - wedeln);
            ctx.stroke();
            ctx.strokeStyle = koerper;
            ctx.lineWidth = 6;
            ctx.stroke();
            ctx.fillStyle = '#ffd34d';
            ctx.strokeStyle = umriss;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(74, 26 - wedeln);
            ctx.lineTo(84, 18 - wedeln);
            ctx.lineTo(79, 30 - wedeln);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // hinterer Flügel
            const schlag = Math.sin(t * 9 + d.phase);
            const zeichneFluegel = (dx, farbe) => {
                // Fledermaus-Flügel, der von der Schulter aus auf- und zuklappt
                ctx.save();
                ctx.translate(40 + dx, 22);
                ctx.scale(1, 0.45 + 0.55 * (schlag * 0.5 + 0.5));
                ctx.fillStyle = farbe;
                ctx.strokeStyle = '#6a46b8';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(-4, 0);
                ctx.lineTo(2, -24);                       // Flügelspitze
                ctx.quadraticCurveTo(6, -14, 9, -14);
                ctx.lineTo(14, -20);                      // zweite Spitze
                ctx.quadraticCurveTo(15, -8, 20, -6);
                ctx.lineTo(22, -10);
                ctx.quadraticCurveTo(20, -2, 14, 0);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                // Flügelknochen
                ctx.beginPath();
                ctx.moveTo(-2, -1); ctx.lineTo(9, -14);
                ctx.moveTo(-1, -1); ctx.lineTo(18, -7);
                ctx.stroke();
                ctx.restore();
            };
            zeichneFluegel(6, '#9a76e8');

            // Körper + Bauch
            ctx.fillStyle = koerper;
            ctx.strokeStyle = umriss;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(40, 30, 18, 12, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#ffe9a8';
            ctx.beginPath();
            ctx.ellipse(38, 35, 12, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            // Beinchen
            ctx.strokeStyle = umriss;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(32, 40); ctx.lineTo(30, 46);
            ctx.moveTo(46, 40); ctx.lineTo(45, 46);
            ctx.stroke();

            // Kopf
            ctx.fillStyle = koerper;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(18, 20, 13, 11, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(8, 25, 9, 7, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            // Hals-Naht überdecken
            ctx.beginPath();
            ctx.ellipse(27, 26, 7, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            // Hörner
            ctx.fillStyle = '#fff3c4';
            ctx.strokeStyle = umriss;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(20, 10); ctx.lineTo(26, 0); ctx.lineTo(25, 11);
            ctx.moveTo(14, 10); ctx.lineTo(16, 1); ctx.lineTo(19, 10);
            ctx.fill();
            ctx.stroke();

            // Nasenloch, Auge, Augenbraue
            ctx.fillStyle = umriss;
            ctx.beginPath();
            ctx.arc(3, 23, 1.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(16, 18, 4.5, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#2b2440';
            ctx.beginPath();
            ctx.arc(14.8, 18.5, 2.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(14, 17.5, 0.9, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = umriss;
            ctx.lineWidth = 2;
            ctx.beginPath();
            if (d.verscheucht) {
                ctx.moveTo(11, 11); ctx.lineTo(20, 13);   // erschrocken
            } else {
                ctx.moveTo(11, 13); ctx.lineTo(20, 10);   // frech
            }
            ctx.stroke();

            // kleine Rauchwölkchen aus der Nase
            if (!d.verscheucht) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                const r = (t * 2 + d.phase) % 1;
                ctx.beginPath();
                ctx.arc(-3 - r * 10, 22 - r * 6, 2 + r * 3, 0, Math.PI * 2);
                ctx.fill();
            }

            // vorderer Flügel
            zeichneFluegel(-4, '#b48cff');

            ctx.restore();
        }

        function aktualisiereDrachen() {
            const e = drachenEinstellung(level);
            if (e && !bossPhase && !trollKoenig) {
                drachenTimer += dt;
                if (drachenTimer >= e.takt) {
                    erstelleDrache(e);
                    drachenTimer = 0;
                }
            }

            for (let i = drachen.length - 1; i >= 0; i--) {
                const d = drachen[i];

                if (d.warnung > 0) {
                    d.warnung -= dt;
                    zeichneWarnung(d.basisY, d.verfolgt);
                    continue;
                }

                if (d.verscheucht) {
                    // Mit Regenbogen-Kraft berührt: Drache flieht nach oben rechts
                    d.x += 320 * dt;
                    d.y -= 260 * dt;
                    d.drehung += 6 * dt;
                } else {
                    d.x -= d.tempo * dt;
                    d.phase += d.wellenTempo * dt;
                    if (d.verfolgt && d.x > einhorn.x + 60) {
                        const ziel = einhorn.y - 5;
                        d.basisY += Math.sign(ziel - d.basisY) * Math.min(Math.abs(ziel - d.basisY), 70 * dt);
                    }
                    d.y = d.basisY + Math.sin(d.phase) * d.amplitude;
                    d.y = Math.max(0, Math.min(H - DRACHE_H, d.y));
                }

                zeichneDrache(d);

                if (!d.verscheucht &&
                    einhorn.x + 8 < d.x + DRACHE_B * 0.85 &&
                    einhorn.x + einhorn.width - 6 > d.x + DRACHE_B * 0.1 &&
                    einhorn.y + 5 < d.y + DRACHE_H * 0.9 &&
                    einhorn.y + einhorn.height - 4 > d.y + DRACHE_H * 0.1
                ) {
                    if (unverwundbarTimer > 0) {
                        d.verscheucht = true;
                        Klang.spiele('verscheucht');
                        partikelExplosion(d.x + DRACHE_B / 2, d.y + DRACHE_H / 2, 14, ['#b48cff', '#5cc98a', '#ffffff'], 'stern');
                    } else if (schutzTimer <= 0 && zustand === 'spiel') {
                        d.verscheucht = true;   // fliegt nach dem Treffer davon
                        treffer('drache');
                    }
                }

                if (d.x < -DRACHE_B - 20 || d.y < -DRACHE_H - 20 || d.x > W + 120) {
                    drachen.splice(i, 1);
                }
            }
        }

        // ===== EINHORNZAUBER =====
        // Johanni zaubert vom Rücken aus nach vorn. Zauber-Knopf gedrückt halten = Dauerfeuer.
        let zauberGeschosse = [];
        let zauberAbklingzeit = 0;
        let zauberGedrueckt = false;
        const ZAUBER_TAKT = 0.32, SUPER_TAKT = 0.2;

        function zaubern() {
            if (zustand !== 'spiel' || zauberAbklingzeit > 0) return;
            const superzauber = unverwundbarTimer > 0;
            zauberAbklingzeit = superzauber ? SUPER_TAKT : ZAUBER_TAKT;
            const sx = einhorn.x + 82, sy = einhorn.y + 6;
            const winkel = superzauber ? [-0.2, 0, 0.2] : [0];
            for (const w of winkel) {
                zauberGeschosse.push({
                    x: sx, y: sy, vx: Math.cos(w) * 680, vy: Math.sin(w) * 680,
                    farbe: superzauber ? `hsl(${(spielRahmen * 8 + w * 300) % 360}, 100%, 70%)` : '#9fe8ff',
                    leben: 1.4, staerke: superzauber ? 2 : 1
                });
            }
            Klang.spiele(superzauber ? 'superzauber' : 'zauber');
            partikelExplosion(sx, sy, 5, ['#ffffff', '#bff4ff'], 'stern', 120);
        }

        // Trefferprüfung Kreis gegen Rechteck
        function geschossTrifft(g, x, y, b, h) {
            return g.x + 8 > x && g.x - 8 < x + b && g.y + 8 > y && g.y - 8 < y + h;
        }

        function aktualisiereZauber() {
            if (zauberAbklingzeit > 0) zauberAbklingzeit -= dt;
            if (zauberGedrueckt) zaubern();

            for (let i = zauberGeschosse.length - 1; i >= 0; i--) {
                const g = zauberGeschosse[i];
                g.x += g.vx * dt;
                g.y += g.vy * dt;
                g.leben -= dt;
                if (Math.random() < 0.7) {
                    neuesPartikel({ x: g.x - 6, y: g.y + (Math.random() - 0.5) * 6, vx: -80, vy: (Math.random() - 0.5) * 30,
                        leben: 0.3, max: 0.3, farbe: g.farbe, r: 2, form: 'stern', schwere: 0 });
                }
                let getroffen = false;

                // Drachen
                for (const d of drachen) {
                    if (d.verscheucht || d.warnung > 0) continue;
                    if (geschossTrifft(g, d.x + 6, d.y + 4, DRACHE_B - 6, DRACHE_H - 4)) {
                        d.lp = (d.lp == null ? (d.verfolgt ? 2 : 1) : d.lp) - g.staerke;
                        d.blink = 0.25;
                        getroffen = true;
                        if (d.lp <= 0) {
                            d.verscheucht = true;
                            gegnerBesiegt(d.x + DRACHE_B / 2, d.y + DRACHE_H / 2, d.verfolgt ? 2 : 1, ['#7dffe0', '#ffffff', '#b48cff']);
                        } else {
                            Klang.spiele('zauberTreffer');
                        }
                        break;
                    }
                }
                // Trolle
                if (!getroffen) for (const t of trolle) {
                    if (t.besiegt) continue;
                    if (geschossTrifft(g, t.x, t.y, TROLL_B, TROLL_H)) {
                        t.lp -= g.staerke;
                        t.blink = 0.25;
                        getroffen = true;
                        if (t.lp <= 0) {
                            t.besiegt = true;
                            gegnerBesiegt(t.x + TROLL_B / 2, t.y + TROLL_H / 2, 1, ['#c9b48a', '#ffffff', '#8fbf6a']);
                        } else Klang.spiele('zauberTreffer');
                        break;
                    }
                }
                // Felsbrocken
                if (!getroffen) for (let j = felsen.length - 1; j >= 0; j--) {
                    const f = felsen[j];
                    if (Math.hypot(g.x - f.x, g.y - f.y) < f.r + 8) {
                        felsen.splice(j, 1);
                        partikelExplosion(f.x, f.y, 10, ['#9a8f84', '#c9bfb2', '#6e655c'], 'kreis', 200);
                        Klang.spiele('zauberTreffer');
                        getroffen = true;
                        break;
                    }
                }
                // Trollkönig
                if (!getroffen && trollKoenig && !trollKoenig.besiegt && geschossTrifft(g, trollKoenig.x + 20, trollKoenig.y + 10, TK_B - 30, TK_H - 10)) {
                    getroffen = true;
                    trollKoenigTreffer(g.staerke);
                }
                // Drachenkönig
                if (!getroffen && boss && !boss.besiegt && boss.x < W - 60 && geschossTrifft(g, boss.x + 10, boss.y + 10, BOSS_B - 10, BOSS_H - 15)) {
                    getroffen = true;
                    drachenKoenigTreffer(g.staerke);
                }

                if (getroffen) {
                    partikelExplosion(g.x, g.y, 6, [g.farbe, '#ffffff'], 'stern', 160);
                    zauberGeschosse.splice(i, 1);
                } else if (g.leben <= 0 || g.x > W + 20) {
                    zauberGeschosse.splice(i, 1);
                }
            }
        }

        function gegnerBesiegt(x, y, punkte, farben) {
            score += punkte;
            Klang.spiele('trollWeg');
            partikelExplosion(x, y, 18, farben, 'stern', 260);
            schwebeText(x, y - 20, '+' + punkte, '#ffe14d', 22);
            pruefeFortschritt();
        }

        function zeichneZauber() {
            if (iconsBereit) {
                for (const g of zauberGeschosse) {
                    const r = g.staerke > 1 ? 30 : 24;
                    if (g.staerke > 1) {
                        const glut = ctx.createRadialGradient(g.x, g.y, 1, g.x, g.y, r * 0.8);
                        glut.addColorStop(0, g.farbe);
                        glut.addColorStop(1, 'rgba(255, 255, 255, 0)');
                        ctx.fillStyle = glut;
                        ctx.beginPath();
                        ctx.arc(g.x, g.y, r * 0.8, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    zeichneIcon('kugel', g.x, g.y, r, spielRahmen / 6);
                }
                return;
            }
            for (const g of zauberGeschosse) {
                ctx.save();
                const r = g.staerke > 1 ? 9 : 7;
                const glut = ctx.createRadialGradient(g.x, g.y, 1, g.x, g.y, r * 2.4);
                glut.addColorStop(0, '#ffffff');
                glut.addColorStop(0.35, g.farbe);
                glut.addColorStop(1, 'rgba(120, 160, 255, 0)');
                ctx.fillStyle = glut;
                ctx.beginPath();
                ctx.arc(g.x, g.y, r * 2.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                zeichneFunkeln(g.x, g.y, r * 0.55);
                ctx.restore();
            }
        }

        // ===== TROLLE =====
        // Laufen am Boden auf Glacier zu, ab Level 2 werfen sie Felsbrocken im Bogen.
        const TROLL_B = 58, TROLL_H = 74;
        const FELS_SCHWERE = 520;
        let trolle = [];
        let felsen = [];
        let trollTimer = 0;
        let stosswellen = [];

        function trollTakt(lvl) {
            if (lvl >= 7) return 3.0;                    // im Gewitter übernehmen die Drachen
            return Math.max(1.9, 3.6 - (lvl - 1) * 0.35);
        }

        function erstelleTroll() {
            trolle.push({
                x: W + 20, y: BODEN_Y - TROLL_H, lp: level >= 6 ? 3 : 2, blink: 0,
                wurfTimer: 1.0 + Math.random() * 1.2, ausholen: 0, besiegt: false, besiegtZeit: 0,
                schritt: Math.random() * 10, eigenTempo: 30 + Math.random() * 30
            });
        }

        function wirfFelsen(vonX, vonY, zielX, zielY, flugzeit, r) {
            const vx = (zielX - vonX) / flugzeit;
            const vy = (zielY - vonY - 0.5 * FELS_SCHWERE * flugzeit * flugzeit) / flugzeit;
            felsen.push({ x: vonX, y: vonY, vx: vx, vy: vy, r: r || 13, drehung: 0, dreh: (Math.random() - 0.5) * 8 });
            Klang.spiele('wurf');
        }

        function aktualisiereTrolle() {
            if (!bossPhase && !trollKoenig) {
                trollTimer += dt;
                if (trollTimer >= trollTakt(level)) { erstelleTroll(); trollTimer = 0; }
            }
            for (let i = trolle.length - 1; i >= 0; i--) {
                const t = trolle[i];
                if (t.blink > 0) t.blink -= dt;
                if (t.besiegt) {
                    t.besiegtZeit += dt;
                    t.x -= weltTempo * dt;
                    if (t.besiegtZeit > 0.6) trolle.splice(i, 1);
                    continue;
                }
                t.x -= (weltTempo + t.eigenTempo) * dt;
                t.schritt += dt * 8;
                // werfen (ab Level 2), mit sichtbarem Ausholen
                if (level >= 2 && t.x > einhorn.x + 180 && t.x < W - 40) {
                    t.wurfTimer -= dt;
                    if (t.wurfTimer <= 0.55 && t.ausholen <= 0) t.ausholen = 0.55;
                    if (t.wurfTimer <= 0) {
                        wirfFelsen(t.x + 14, t.y - 4, einhorn.x + 40, einhorn.y + 25, 0.9 + Math.random() * 0.3);
                        t.wurfTimer = 2.6 + Math.random() * 1.4 - Math.min(level, 6) * 0.15;
                        t.ausholen = 0;
                    }
                }
                if (t.ausholen > 0) t.ausholen -= dt;
                // Berührung
                if (geschossTrifft({ x: t.x + TROLL_B / 2, y: t.y + TROLL_H / 2 }, einhorn.x - TROLL_B / 2 + 14, einhorn.y - TROLL_H / 2 + 10, einhorn.width + TROLL_B - 28, einhorn.height + TROLL_H - 18)) {
                    if (unverwundbarTimer > 0) {
                        t.besiegt = true;
                        gegnerBesiegt(t.x + TROLL_B / 2, t.y + TROLL_H / 2, 1, ['#c9b48a', '#ffffff']);
                    } else if (schutzTimer <= 0 && zustand === 'spiel') {
                        treffer('troll');
                    }
                }
                if (t.x < -TROLL_B - 20) trolle.splice(i, 1);
            }
            // Felsbrocken
            for (let i = felsen.length - 1; i >= 0; i--) {
                const f = felsen[i];
                f.vy += FELS_SCHWERE * dt;
                f.x += f.vx * dt;
                f.y += f.vy * dt;
                f.drehung += f.dreh * dt;
                const nah = f.x + f.r > einhorn.x + 8 && f.x - f.r < einhorn.x + einhorn.width - 6 &&
                            f.y + f.r > einhorn.y + 4 && f.y - f.r < einhorn.y + einhorn.height - 4;
                if (nah) {
                    felsen.splice(i, 1);
                    partikelExplosion(f.x, f.y, 10, ['#9a8f84', '#c9bfb2'], 'kreis', 200);
                    if (unverwundbarTimer <= 0 && schutzTimer <= 0 && zustand === 'spiel') treffer('fels');
                    continue;
                }
                if (f.y > BODEN_Y + 10) {
                    partikelExplosion(f.x, BODEN_Y, 8, ['#9a8f84', '#d8cdb8'], 'kreis', 140);
                    felsen.splice(i, 1);
                } else if (f.x < -40 || f.x > W + 60) felsen.splice(i, 1);
            }
        }

        function zeichneFels(f) {
            if (trollAtlas.bereit && f.r > 0) {
                const [x, y, b, h] = TROLL_TEILE[f.r >= 16 ? 'fels_mittel' : 'fels_klein'];
                const bb = f.r * 2.5 * b / (b - 2 * TROLL_RAND), hh = bb * h / b;
                ctx.save();
                ctx.translate(f.x, f.y);
                ctx.rotate(f.drehung);
                ctx.drawImage(trollAtlas.bild, x, y, b, h, -bb / 2, -hh / 2, bb, hh);
                ctx.restore();
                return;
            }
            ctx.save();
            ctx.translate(f.x, f.y);
            ctx.rotate(f.drehung);
            const r = f.r;
            ctx.fillStyle = kugelVerlauf(0, 0, r * 1.2, '#cfc6ba', '#8f857a', '#4f4840');
            ctx.beginPath();
            ctx.moveTo(-r, -r * 0.2);
            ctx.lineTo(-r * 0.5, -r);
            ctx.lineTo(r * 0.5, -r * 0.9);
            ctx.lineTo(r, -r * 0.1);
            ctx.lineTo(r * 0.7, r * 0.8);
            ctx.lineTo(-r * 0.3, r);
            ctx.lineTo(-r * 0.9, r * 0.6);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'rgba(40, 34, 28, 0.6)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-r * 0.2, -r * 0.6); ctx.lineTo(0, 0); ctx.lineTo(r * 0.4, r * 0.3);
            ctx.stroke();
            ctx.restore();
        }

        // Troll (Code-Zeichnung; wird später durch Bilder ersetzt, wenn trolle.png vorhanden ist)
        function zeichneTrollFigur(x, y, b, h, schritt, ausholen, blink, koenig) {
            ctx.save();
            if (blink > 0 && Math.floor(spielRahmen / 3) % 2 === 0) ctx.globalAlpha = 0.5;
            ctx.translate(x, y);
            ctx.scale(b / 58, h / 74);
            const haut = kugelVerlauf(28, 30, 34, koenig ? '#a7b98a' : '#9fbf7e', koenig ? '#6f8a55' : '#6c9152', koenig ? '#3e5130' : '#3c5a2e');
            const bein = Math.sin(schritt) * 4;
            // Beine
            ctx.fillStyle = '#4f3a28';
            ctx.beginPath(); ctx.ellipse(20 + bein, 68, 7, 6, 0, 0, Math.PI * 2); ctx.ellipse(37 - bein, 68, 7, 6, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = haut;
            ctx.fillRect(16 + bein, 52, 9, 14);
            ctx.fillRect(33 - bein, 52, 9, 14);
            // Körper mit Lendenschurz
            ctx.beginPath(); ctx.ellipse(29, 40, 21, 19, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#7a5a3a';
            ctx.beginPath(); ctx.moveTo(10, 46); ctx.lineTo(48, 46); ctx.lineTo(44, 58); ctx.lineTo(14, 58); ctx.closePath(); ctx.fill();
            // Arm (beim Ausholen über dem Kopf mit Felsbrocken)
            ctx.strokeStyle = haut; ctx.lineWidth = 8; ctx.lineCap = 'round';
            ctx.beginPath();
            if (ausholen > 0) { ctx.moveTo(14, 34); ctx.lineTo(10, 6); }
            else { ctx.moveTo(12, 34); ctx.lineTo(4, 50 + bein * 0.5); }
            ctx.stroke();
            if (ausholen > 0) zeichneFels({ x: 10, y: -2, r: 9, drehung: 0 });
            // Kopf
            ctx.fillStyle = haut;
            ctx.beginPath(); ctx.ellipse(22, 16, 15, 13, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = koenig ? '#58733f' : '#5a7d43';
            ctx.beginPath(); ctx.ellipse(10, 20, 7, 6, 0, 0, Math.PI * 2); ctx.fill();   // große Nase
            ctx.fillStyle = '#f2ecd0';
            ctx.beginPath(); ctx.moveTo(12, 25); ctx.lineTo(15, 31); ctx.lineTo(17, 25); ctx.fill();  // Hauer
            ctx.fillStyle = '#1e1a10';
            ctx.beginPath(); ctx.arc(17, 12, 2.2, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#2a2414'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(13, 7); ctx.lineTo(21, 9); ctx.stroke();
            ctx.fillStyle = '#4a6237';
            ctx.beginPath(); ctx.ellipse(33, 9, 4, 7, 0.6, 0, Math.PI * 2); ctx.fill();    // Ohr
            if (koenig) {
                // Keule und Krone
                ctx.strokeStyle = '#5b4026'; ctx.lineWidth = 7;
                ctx.beginPath(); ctx.moveTo(46, 40); ctx.lineTo(56, 8); ctx.stroke();
                ctx.fillStyle = '#6b4c2f'; ctx.beginPath(); ctx.ellipse(57, 4, 8, 10, 0.3, 0, Math.PI * 2); ctx.fill();
                zeichneKrone(22, 0, 18);
            }
            ctx.restore();
        }

        // ----- Trolle als Bilder (trolle.png), sonst Code-Zeichnung -----
        const TROLL_TEILE = {"gehenA": [0, 0, 153, 160], "gehenB": [155, 0, 159, 163], "werfen": [316, 0, 182, 203], "getroffen": [500, 0, 181, 179], "k_stehen": [683, 0, 228, 212], "k_werfen": [0, 214, 195, 261], "k_stampfen": [197, 214, 286, 184], "k_getroffen": [485, 214, 233, 179], "fels_gross": [720, 214, 95, 63], "fels_mittel": [817, 214, 75, 47], "fels_klein": [894, 214, 52, 33]};
        const TROLL_RAND = 6;   // Rand um jede Pose (für die dunkle Kontur)
        const trollAtlas = { bild: new Image(), bereit: false };
        trollAtlas.bild.onload = () => { trollAtlas.bereit = true; };
        if (location.protocol.startsWith('http')) trollAtlas.bild.src = 'trolle.png';

        // Pose zeichnen: Füße unten mittig auf (fussX, fussY)
        function zeichneTrollPose(pose, fussX, fussY, massstab, alpha) {
            const [x, y, b, h] = TROLL_TEILE[pose];
            const bb = b * massstab, hh = h * massstab;
            ctx.save();
            ctx.globalAlpha *= alpha == null ? 1 : alpha;
            // Schatten am Boden, damit sich die Figur von der Wiese abhebt
            const sb = (b - 2 * TROLL_RAND) * massstab * 0.42;
            const schatten = ctx.createRadialGradient(fussX, fussY, 1, fussX, fussY, sb);
            schatten.addColorStop(0, 'rgba(20, 15, 8, 0.55)');
            schatten.addColorStop(1, 'rgba(20, 15, 8, 0)');
            ctx.fillStyle = schatten;
            ctx.beginPath();
            ctx.ellipse(fussX, fussY, sb, sb * 0.22, 0, 0, Math.PI * 2);
            ctx.fill();
            const rand = TROLL_RAND * massstab;
            ctx.drawImage(trollAtlas.bild, x, y, b, h, fussX - bb / 2, fussY - hh + rand, bb, hh);
            ctx.restore();
        }

        function zeichneTrolle() {
            if (trollAtlas.bereit) {
                const m = (TROLL_H * 1.18) / 148;
                for (const t of trolle) {
                    let pose = Math.floor(t.schritt / Math.PI) % 2 ? 'gehenA' : 'gehenB';
                    if (t.ausholen > 0) pose = 'werfen';
                    if (t.besiegt) pose = 'getroffen';
                    let alpha = t.besiegt ? Math.max(0, 1 - t.besiegtZeit / 0.6) : 1;
                    if (t.blink > 0 && Math.floor(spielRahmen / 3) % 2 === 0) alpha *= 0.5;
                    zeichneTrollPose(pose, t.x + TROLL_B / 2, t.y + TROLL_H + 3, m, alpha);
                }
                for (const f of felsen) zeichneFels(f);
                zeichneStosswellen();
                return;
            }
            for (const t of trolle) {
                ctx.save();
                if (t.besiegt) {
                    ctx.globalAlpha = Math.max(0, 1 - t.besiegtZeit / 0.6);
                    ctx.translate(t.x + TROLL_B / 2, t.y + TROLL_H);
                    ctx.rotate(-t.besiegtZeit * 1.5);
                    ctx.translate(-(t.x + TROLL_B / 2), -(t.y + TROLL_H));
                }
                zeichneTrollFigur(t.x, t.y, TROLL_B, TROLL_H, t.schritt, t.ausholen, t.blink, false);
                ctx.restore();
            }
            for (const f of felsen) zeichneFels(f);
            zeichneStosswellen();
        }

        function zeichneStosswellen() {
            for (const w of stosswellen) {
                ctx.save();
                const g = ctx.createLinearGradient(0, BODEN_Y - w.h, 0, BODEN_Y);
                g.addColorStop(0, 'rgba(220, 200, 160, 0)');
                g.addColorStop(1, 'rgba(200, 175, 130, 0.85)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.moveTo(w.x - 30, BODEN_Y);
                ctx.quadraticCurveTo(w.x, BODEN_Y - w.h * 2, w.x + 30, BODEN_Y);
                ctx.fill();
                ctx.restore();
            }
        }

        // ===== ZWISCHENBOSS: TROLLKÖNIG (bei 50 Sternen) =====
        // Die Welt steht still, Glacier kann nur hoch und runter ausweichen.
        const TK_B = 130, TK_H = 160, TK_LEBEN = 14;
        let trollKoenig = null;
        let trollKoenigBesiegt = false;

        function starteTrollKoenig() {
            drachen.forEach(d => { d.verscheucht = true; d.warnung = 0; });
            trolle.forEach(t => { t.besiegt = true; });
            trollKoenig = { x: W + 30, y: BODEN_Y - TK_H, leben: TK_LEBEN, blink: 0, wurfTimer: 2.2, stampfTimer: 5, ausholen: 0,
                            schritt: 0, besiegt: false, besiegtZeit: 0, kraftTimer: 4 };
            wackeln(6, 0.5);
        }

        function trollKoenigTreffer(staerke) {
            const k = trollKoenig;
            k.leben -= staerke;
            k.blink = 0.3;
            Klang.spiele('zauberTreffer');
            if (k.leben <= 0) {
                k.besiegt = true;
                felsen = [];
                stosswellen = [];
                Klang.spiele('bossBesiegt');
                wackeln(10, 0.6);
                score += 5;
                schwebeText(W / 2, 170, 'Der Trollkönig ist besiegt!  +5', '#ffe14d', 30);
            }
        }

        function aktualisiereTrollKoenig() {
            const k = trollKoenig;
            if (!k) return;
            if (k.blink > 0) k.blink -= dt;
            if (k.besiegt) {
                k.besiegtZeit += dt;
                if (Math.random() < 0.5) partikelExplosion(k.x + TK_B / 2, k.y + TK_H / 2, 3, ['#ffd34d', '#c9b48a', '#ffffff'], 'stern', 240);
                if (k.besiegtZeit > 2.2) {
                    trollKoenig = null;
                    trollKoenigBesiegt = true;
                    const alteWelt = weltFuerLevel(level);
                    level = 6;
                    levelUpAusstehend = levelInfo(6, weltFuerLevel(6) !== alteWelt ? weltFuerLevel(6) : null);
                }
                return;
            }
            const wut = 1 - k.leben / TK_LEBEN;
            k.x += (W - TK_B - 120 - k.x) * Math.min(1, dt * 1.2);   // Platz lassen für den Zauber-Knopf
            k.schritt += dt * 3;
            // Felsbrocken werfen (mit Ausholen), später drei auf einmal
            k.wurfTimer -= dt;
            if (k.wurfTimer <= 0.6 && k.ausholen <= 0) k.ausholen = 0.6;
            if (k.wurfTimer <= 0) {
                const vx = k.x + 45, vy = k.y - 5;
                wirfFelsen(vx, vy, einhorn.x + 40, einhorn.y + 25, 1.1, 17);
                if (wut > 0.45) {
                    wirfFelsen(vx, vy, einhorn.x + 40, Math.max(30, einhorn.y - 70), 1.15, 14);
                    wirfFelsen(vx, vy, einhorn.x + 40, Math.min(BODEN_Y - 20, einhorn.y + 110), 1.05, 14);
                }
                k.wurfTimer = 2.4 - wut * 0.9;
                k.ausholen = 0;
            }
            if (k.ausholen > 0) k.ausholen -= dt;
            if (k.stampfAnim > 0) k.stampfAnim -= dt;
            // Stampfen: Bodenwelle rollt nach links – Glacier muss hochfliegen
            k.stampfTimer -= dt;
            if (k.stampfTimer <= 0) {
                stosswellen.push({ x: k.x, h: 26 });
                k.stampfAnim = 0.5;
                Klang.spiele('stampf');
                wackeln(7, 0.35);
                k.stampfTimer = 5.5 - wut * 2;
            }
            // Regenbogen-Stern für den Superzauber regelmäßig nachliefern
            k.kraftTimer -= dt;
            if (k.kraftTimer <= 0) {
                if (unverwundbarTimer <= 0 && !sterne.some(st => st.typ === 'kraft')) erstelleStern('kraft');
                if (herzen < MAX_HERZEN && Math.random() < 0.35) erstelleStern('herz');
                k.kraftTimer = 8;
            }
        }

        function aktualisiereStosswellen() {
            for (let i = stosswellen.length - 1; i >= 0; i--) {
                const w = stosswellen[i];
                w.x -= 300 * dt;
                const trifft = w.x + 25 > einhorn.x + 10 && w.x - 25 < einhorn.x + einhorn.width - 10 &&
                               einhorn.y + einhorn.height > BODEN_Y - w.h - 4;
                if (trifft && !w.getroffen) {
                    w.getroffen = true;
                    if (unverwundbarTimer <= 0 && schutzTimer <= 0 && zustand === 'spiel') treffer('stampf');
                }
                if (w.x < -40) stosswellen.splice(i, 1);
            }
        }

        function zeichneTrollKoenig() {
            const k = trollKoenig;
            if (!k) return;
            if (trollAtlas.bereit) {
                let pose = 'k_stehen';
                if (k.ausholen > 0) pose = 'k_werfen';
                if (k.stampfAnim > 0) pose = 'k_stampfen';
                if (k.besiegt) pose = 'k_getroffen';
                let alpha = k.besiegt ? Math.max(0, 1 - Math.max(0, k.besiegtZeit - 1.2)) : 1;
                if (k.blink > 0 && Math.floor(spielRahmen / 3) % 2 === 0) alpha *= 0.55;
                zeichneTrollPose(pose, k.x + TK_B / 2, k.y + TK_H + 4, (TK_H * 1.12) / 200, alpha);
                return;
            }
            ctx.save();
            if (k.besiegt) {
                ctx.globalAlpha = Math.max(0, 1 - k.besiegtZeit / 2.2);
                ctx.translate(k.x + TK_B / 2, k.y + TK_H);
                ctx.rotate(-Math.min(1.4, k.besiegtZeit));
                ctx.translate(-(k.x + TK_B / 2), -(k.y + TK_H));
            }
            zeichneTrollFigur(k.x, k.y, TK_B, TK_H, k.schritt, k.ausholen, k.blink, true);
            ctx.restore();
        }

        function zeichneTrollKoenigLeiste() {
            const k = trollKoenig;
            if (!k || k.besiegt) return;
            ctx.fillStyle = 'rgba(14, 12, 34, 0.65)';
            ctx.beginPath();
            ctx.roundRect(W / 2 - 150, 10, 300, 40, 12);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = '16px Spielschrift, Arial';
            ctx.textAlign = 'left';
            ctx.fillText('Trollkönig', W / 2 - 138, 36);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.fillRect(W / 2 - 40, 24, 175, 10);
            ctx.fillStyle = '#8fd46a';
            ctx.fillRect(W / 2 - 40, 24, 175 * Math.max(0, k.leben / TK_LEBEN), 10);
        }

        const TROLL_INFO = {
            titel: 'Zwischenboss: Der Trollkönig!',
            unter: 'Halbzeit – 50 Sterne geschafft!',
            zeilen: ['Er wirft Felsbrocken – weiche aus oder zerzaubere sie.',
                     'Wenn er stampft, rollt eine Bodenwelle: flieg hoch!',
                     'Halte den Zauber-Knopf gedrückt und triff ihn!'],
            boss: true, troll: true
        };

        // ===== EFFEKTE =====
        let partikel = [];
        let schwebeTexte = [];
        let spurTimer = 0;
        let wackelZeit = 0, wackelStaerke = 0;
        let blitzZeit = 0;
        let komboZaehler = 0, komboTimer = 0;
        const MAX_PARTIKEL = 220;

        function neuesPartikel(p) {
            if (partikel.length >= MAX_PARTIKEL) partikel.shift();
            partikel.push(p);
        }

        function partikelExplosion(x, y, anzahl, farben, form, tempo) {
            tempo = tempo || 220;
            for (let i = 0; i < anzahl; i++) {
                const w = Math.random() * Math.PI * 2;
                const v = tempo * (0.4 + Math.random() * 0.8);
                const leben = 0.5 + Math.random() * 0.5;
                neuesPartikel({
                    x: x, y: y,
                    vx: Math.cos(w) * v, vy: Math.sin(w) * v - 40,
                    leben: leben, max: leben,
                    farbe: farben[i % farben.length],
                    r: 2.5 + Math.random() * 3,
                    form: form || 'kreis',
                    schwere: 260
                });
            }
        }

        function schwebeText(x, y, text, farbe, groesse) {
            schwebeTexte.push({ x: x, y: y, text: text, farbe: farbe || '#ffffff', groesse: groesse || 20, leben: 1.1, max: 1.1 });
        }

        function wackeln(staerke, zeit) {
            wackelStaerke = Math.max(wackelStaerke, staerke);
            wackelZeit = Math.max(wackelZeit, zeit);
        }

        function zeichneFunkeln(x, y, r) {
            ctx.beginPath();
            ctx.moveTo(x, y - r * 2); ctx.lineTo(x + r * 0.45, y - r * 0.45);
            ctx.lineTo(x + r * 2, y); ctx.lineTo(x + r * 0.45, y + r * 0.45);
            ctx.lineTo(x, y + r * 2); ctx.lineTo(x - r * 0.45, y + r * 0.45);
            ctx.lineTo(x - r * 2, y); ctx.lineTo(x - r * 0.45, y - r * 0.45);
            ctx.closePath();
            ctx.fill();
        }

        function aktualisiereEffekte() {
            // Glitzerspur hinter Glacier
            spurTimer += dt;
            if (glacierAmBoden() && unverwundbarTimer <= 0) spurTimer = 0;
            while (spurTimer > 0.028) {
                spurTimer -= 0.028;
                const kraft = unverwundbarTimer > 0;
                const farbe = kraft
                    ? `hsl(${(spielRahmen * 6 + Math.random() * 60) % 360}, 100%, 72%)`
                    : ['#ffffff', '#ffd6ef', '#d8c8ff', '#c8f0ff'][Math.floor(Math.random() * 4)];
                neuesPartikel({
                    x: einhorn.x + 4 + Math.random() * 6,
                    y: einhorn.y + 24 + Math.random() * 12,
                    vx: -150 - Math.random() * 60, vy: (Math.random() - 0.5) * 30,
                    leben: kraft ? 0.7 : 0.45, max: kraft ? 0.7 : 0.45,
                    farbe: farbe, r: kraft ? 2.6 : 1.8, form: 'stern', schwere: 0
                });
            }

            for (let i = partikel.length - 1; i >= 0; i--) {
                const p = partikel[i];
                p.leben -= dt;
                if (p.leben <= 0) { partikel.splice(i, 1); continue; }
                p.vy += p.schwere * dt;
                p.x += p.vx * dt;
                p.y += p.vy * dt;
            }
            for (let i = schwebeTexte.length - 1; i >= 0; i--) {
                const t = schwebeTexte[i];
                t.leben -= dt;
                t.y -= 45 * dt;
                if (t.leben <= 0) schwebeTexte.splice(i, 1);
            }
            if (komboTimer > 0) {
                komboTimer -= dt;
                if (komboTimer <= 0) komboZaehler = 0;
            }
            if (wackelZeit > 0) wackelZeit -= dt;
            if (blitzZeit > 0) blitzZeit -= dt;
        }

        function zeichnePartikel() {
            ctx.save();
            for (const p of partikel) {
                ctx.globalAlpha = Math.max(0, p.leben / p.max);
                ctx.fillStyle = p.farbe;
                if (p.form === 'stern') {
                    zeichneFunkeln(p.x, p.y, p.r);
                } else if (p.form === 'herz') {
                    ctx.restore(); ctx.save();
                    ctx.globalAlpha = Math.max(0, p.leben / p.max);
                    zeichneHerz(p.x, p.y, p.r * 4, true);
                } else {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.restore();
            for (const t of schwebeTexte) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, Math.min(1, t.leben / t.max * 1.6));
                konturText(t.text, t.x, t.y, t.groesse + 'px Spielschrift, Arial', t.farbe, '#1e1638', 5);
                ctx.restore();
            }
        }

        // ===== POWER-UPS =====
        const MAGNET_DAUER = 8;
        const SCHILD_DAUER = 15;
        let magnetTimer = 0;
        let schildAktiv = false;
        let schildTimer = 0;

        function zeichnePowerUpEffekte() {
            const cx = einhorn.x + 35, cy = einhorn.y + 22;
            if (magnetTimer > 0) {
                const puls = (spielRahmen / 40) % 1;
                ctx.save();
                ctx.strokeStyle = `rgba(255, 90, 110, ${0.5 * (1 - puls)})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(cx, cy, 30 + puls * 70, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
            if (schildAktiv) {
                const endetBald = schildTimer < 3 && Math.floor(spielRahmen / 6) % 2 === 0;
                ctx.save();
                ctx.globalAlpha = endetBald ? 0.35 : 0.9;
                const g = ctx.createRadialGradient(cx - 12, cy - 14, 8, cx, cy, 50);
                g.addColorStop(0, 'rgba(255, 255, 255, 0.05)');
                g.addColorStop(0.75, 'rgba(140, 210, 255, 0.18)');
                g.addColorStop(1, 'rgba(90, 170, 255, 0.55)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(cx, cy, 48, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(200, 235, 255, 0.9)';
                ctx.lineWidth = 2;
                ctx.stroke();
                glanzlicht(cx - 20, cy - 26, 10, 4, -0.6, 0.7);
                ctx.restore();
            }
        }

        function zeichnePowerUpLeiste() {
            // kleine Anzeige oben in der Mitte für aktive Power-ups
            const eintraege = [];
            if (unverwundbarTimer > 0) eintraege.push({ text: 'Regenbogen ' + Math.ceil(unverwundbarTimer / 60) + 's', farbe: '#7dffe0', anteil: unverwundbarTimer / 420 });
            if (magnetTimer > 0) eintraege.push({ text: 'Magnet ' + Math.ceil(magnetTimer) + 's', farbe: '#ff8a98', anteil: magnetTimer / MAGNET_DAUER });
            if (schildAktiv) eintraege.push({ text: 'Schild ' + Math.ceil(schildTimer) + 's', farbe: '#9fd6ff', anteil: schildTimer / SCHILD_DAUER });
            if (komboZaehler >= 3) eintraege.push({ text: 'Kombo x' + komboZaehler, farbe: '#ffe14d', anteil: komboTimer / 1.8 });
            // links neben den runden Knöpfen, damit nichts die Punkteanzeige verdeckt
            const y0 = (bossPhase || trollKoenig) ? 58 : 14;
            const b = 112, abstand = 6;
            let x = (bossPhase || trollKoenig) ? W / 2 - (eintraege.length * b + (eintraege.length - 1) * abstand) / 2 : 110;
            for (const e of eintraege) {
                ctx.fillStyle = 'rgba(14, 12, 34, 0.45)';
                ctx.beginPath();
                ctx.roundRect(x, y0, b, 30, 10);
                ctx.fill();
                ctx.fillStyle = e.farbe;
                ctx.font = '14px Spielschrift, Arial';
                ctx.textAlign = 'center';
                ctx.fillText(e.text, x + b / 2, y0 + 18);
                ctx.fillRect(x + 10, y0 + 23, (b - 20) * Math.max(0, Math.min(1, e.anteil)), 3);
                x += b + abstand;
            }
        }

        // ===== LEVEL-BILDSCHIRM =====
        let levelUpAusstehend = null;
        let levelUpInfo = null;

        function levelInfo(lvl, neueWelt) {
            const texte = {
                2: ['Neu: Sternen-Magnet! Er zieht Sterne zu dir.', 'Achtung: Die Trolle werfen jetzt Felsbrocken – zerzaubere sie!'],
                3: ['Achtung, Drachen! Sie fliegen in Wellen auf dich zu.', 'Ein „!“ am rechten Rand warnt dich vorher.'],
                4: ['Neu: Schutzschild! Er fängt einen Treffer ab.', 'Die Drachen werden schneller.'],
                5: ['Die Drachen kommen jetzt öfter.', 'Bei 50 Sternen wartet der Trollkönig …'],
                6: ['Weiter geht die Reise! Die Trolle sind jetzt zäher.', 'Die Drachen werden noch schneller.'],
                7: ['Ein Gewitter zieht auf – und rote Drachen verfolgen dich!', 'Weiche ihnen geschickt aus.'],
                8: ['Noch mehr rote Drachen!', 'Kombos geben Extra-Sterne.'],
                9: ['Fast geschafft!', 'Glühwürmchen leuchten dir den Weg.'],
                10: ['Letztes Level!', 'Noch ein paar Sterne bis zum Drachenkönig …']
            };
            return {
                titel: 'Level ' + lvl + ' erreicht!',
                unter: lvl === 7 ? 'Es wird stürmisch …' : (neueWelt !== null ? 'Es wird ' + WELTEN[neueWelt].name : ''),
                zeilen: texte[lvl] || [],
                boss: false
            };
        }

        const FINALE_INFO = {
            titel: 'Finale: Der Drachenkönig!',
            unter: 'Du hast 100 Sterne – jetzt wird es ernst!',
            zeilen: ['Er spuckt Feuerbälle – weiche ihnen aus.',
                     'Zaubere, was das Zeug hält! Mit Regenbogen-Kraft wird dein Zauber dreifach,',
                     'und wer dann in ihn hineinfliegt, trifft ihn besonders hart.'],
            boss: true
        };

        function standbildMachen() {
            standbild = document.createElement('canvas');
            standbild.width = canvas.width;
            standbild.height = canvas.height;
            standbild.getContext('2d').drawImage(canvas, 0, 0);
        }

        function zeigeLevelUp(info) {
            levelUpInfo = info;
            standbildMachen();
            zustand = 'levelup';
            eingabeGesperrtBis = performance.now() + 700;
            Klang.musikStopp();
        }

        function weiterNachLevelUp() {
            if (performance.now() < eingabeGesperrtBis) return;
            Klang.spiele('weiter');
            zustand = 'spiel';
            schutzTimer = Math.max(schutzTimer, 1.2);
            if (levelUpInfo && levelUpInfo.troll) starteTrollKoenig();
            else if (levelUpInfo && levelUpInfo.boss) starteBoss();
            Klang.musikStart();
        }

        function zeichneLevelUp() {
            if (standbild) {
                ctx.save();
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.drawImage(standbild, 0, 0, canvas.width, canvas.height);
                ctx.restore();
            }
            const info = levelUpInfo;
            ctx.fillStyle = info.boss ? 'rgba(30, 5, 40, 0.65)' : 'rgba(14, 12, 34, 0.5)';
            ctx.fillRect(0, 0, W, H);

            // Karte mit leichtem Hereinzoomen
            ctx.save();
            ctx.fillStyle = info.boss ? 'rgba(60, 16, 40, 0.93)' : 'rgba(22, 18, 50, 0.92)';
            ctx.beginPath();
            ctx.roundRect(150, 40, 500, 310, 22);
            ctx.fill();
            ctx.strokeStyle = info.boss ? '#ff8a5c' : '#c9a24e';
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.restore();

            // Sterne-Kranz
            for (let i = 0; i < 5; i++) {
                ctx.fillStyle = i <= Math.floor(spielRahmen / 12) % 6 ? '#ffd34d' : 'rgba(200, 180, 120, 0.4)';
                zeichneFunkeln(W / 2 - 80 + i * 40, 70, 5);
            }

            konturText(info.titel, W / 2, 118, '34px Spielschrift, Arial', '#ffe08a', '#1e1638', 7);
            if (info.unter) konturText(info.unter, W / 2, 150, '18px Spielschrift, Arial', '#ffffff', '#1e1638', 5);

            ctx.fillStyle = '#f0e6cf';
            ctx.font = '17px Arial';
            ctx.textAlign = 'center';
            info.zeilen.forEach((z, i) => ctx.fillText(z, W / 2, 190 + i * 27));

            ctx.font = '16px Spielschrift, Arial';
            ctx.fillStyle = '#c9a24e';
            ctx.fillText('★ ' + score + ' Sterne   ·   ' + '♥'.repeat(herzen) + '   ·   ' + formatZeit(spielZeit), W / 2, 275);

            if (performance.now() >= eingabeGesperrtBis) {
                zeichneKnopf(info.boss ? 'Auf in den Kampf!' : 'Weiter!', W / 2 - 130, 290, 260, '#ffdf00', weiterNachLevelUp, 48);
            }
        }

        // ===== ENDBOSS: DRACHENKÖNIG =====
        const BOSS_B = DRACHE_B * 2, BOSS_H = DRACHE_H * 2;
        const BOSS_LEBEN = 22;
        let bossPhase = false;
        let boss = null;
        let feuerbaelle = [];
        let bossKraftTimer = 0;

        function starteBoss() {
            bossPhase = true;
            hindernisse = [];
            drachen.forEach(d => { d.verscheucht = true; d.warnung = 0; });
            boss = { x: W + 40, y: 140, phase: 0, leben: BOSS_LEBEN, trefferBlink: 0, feuerTimer: 2.5, besiegt: false, besiegtZeit: 0, drehung: 0 };
            bossKraftTimer = 3;
            wackeln(6, 0.5);
        }

        function aktualisiereBoss() {
            if (!boss) return;
            const b = boss;
            if (b.trefferBlink > 0) b.trefferBlink -= dt;
            if (b.feuerAnim > 0) b.feuerAnim -= dt;

            if (b.besiegt) {
                b.besiegtZeit += dt;
                b.x += 180 * dt;
                b.y -= 140 * dt;
                b.drehung += 4 * dt;
                if (Math.random() < 0.5) {
                    partikelExplosion(b.x + BOSS_B / 2, b.y + BOSS_H / 2, 3,
                        ['#ffd34d', '#ff8ac4', '#7dffe0', '#b48cff', '#ffffff'], 'stern', 260);
                }
                if (b.besiegtZeit > 2.3 && zustand === 'spiel') beendeSpiel('sieg');
            } else {
                // hereinfliegen, dann auf und ab schweben
                const zielX = 585;
                b.x += (zielX - b.x) * Math.min(1, dt * 1.5);
                const wut = 3 - b.leben;
                b.phase += dt * (1.1 + wut * 0.45);
                b.y = 135 + Math.sin(b.phase) * 105;

                // Feuerbälle auf Glacier
                b.feuerTimer -= dt;
                if (b.feuerTimer <= 0 && b.x < W - 120) {
                    const fx = b.maul ? b.maul.x : b.x + 8, fy = b.maul ? b.maul.y : b.y + 50;
                    b.feuerAnim = 0.5;
                    const vx = -(270 + wut * 45);
                    const flugzeit = (fx - (einhorn.x + 35)) / -vx;
                    let vy = ((einhorn.y + 25) - fy) / Math.max(0.3, flugzeit);
                    vy = Math.max(-220, Math.min(220, vy));
                    feuerbaelle.push({ x: fx, y: fy, vx: vx, vy: vy, r: 13 });
                    if (wut >= 2) feuerbaelle.push({ x: fx, y: fy, vx: vx, vy: vy + 110, r: 11 });
                    Klang.spiele('feuer');
                    b.feuerTimer = 2.3 - wut * 0.5;
                    b.feuerTimer = Math.max(b.feuerTimer, 1.0);
                }

                // Regenbogen-Stern garantiert regelmäßig nachliefern
                bossKraftTimer -= dt;
                if (bossKraftTimer <= 0) {
                    if (unverwundbarTimer <= 0 && !sterne.some(st => st.typ === 'kraft')) erstelleStern('kraft');
                    bossKraftTimer = 6;
                }

                // Berührung mit Glacier
                const trifft =
                    einhorn.x + 10 < b.x + BOSS_B * 0.9 &&
                    einhorn.x + einhorn.width - 8 > b.x + BOSS_B * 0.12 &&
                    einhorn.y + 6 < b.y + BOSS_H * 0.9 &&
                    einhorn.y + einhorn.height - 4 > b.y + BOSS_H * 0.15;
                if (trifft && b.trefferBlink <= 0) {
                    if (unverwundbarTimer > 0) {
                        // Mit Regenbogen-Kraft hineinfliegen: großer Treffer, Kraft verbraucht
                        unverwundbarTimer = 0;
                        b.x += 110;
                        drachenKoenigTreffer(4, true);
                    } else if (schutzTimer <= 0) {
                        treffer('boss');
                    }
                }
            }

            // Feuerbälle bewegen und prüfen
            for (let i = feuerbaelle.length - 1; i >= 0; i--) {
                const f = feuerbaelle[i];
                f.x += f.vx * dt;
                f.y += f.vy * dt;
                if (Math.random() < 0.6) {
                    neuesPartikel({ x: f.x + 6, y: f.y + (Math.random() - 0.5) * 8, vx: 60, vy: -20,
                        leben: 0.35, max: 0.35, farbe: Math.random() < 0.5 ? '#ffb347' : '#ff6a3d', r: 3, form: 'kreis', schwere: -40 });
                }
                const nah = f.x > einhorn.x + 4 && f.x < einhorn.x + einhorn.width + f.r &&
                            f.y > einhorn.y - f.r * 0.5 && f.y < einhorn.y + einhorn.height + f.r * 0.5;
                if (nah) {
                    feuerbaelle.splice(i, 1);
                    if (unverwundbarTimer > 0) {
                        partikelExplosion(f.x, f.y, 8, ['#ffffff', '#7dffe0'], 'stern');
                    } else if (schutzTimer <= 0) {
                        treffer('feuer');
                    }
                    continue;
                }
                if (f.x < -40 || f.y < -40 || f.y > H + 40) feuerbaelle.splice(i, 1);
            }
        }

        function bossPose(b) {
            if (b.besiegt || b.trefferBlink > 0) return 'getroffen';
            if (b.feuerAnim > 0) return 'feuer';
            if (b.feuerTimer < 0.7) return 'angriff';
            return FLUG_ZYKLUS[Math.floor(spielRahmen / 9) % 4];
        }
        const BOSS_MASSSTAB = 235 / 211;

        function zeichneKrone(x, y, groesse) {
            ctx.save();
            ctx.translate(x, y);
            const s = groesse / 24;
            ctx.scale(s, s);
            const g = ctx.createLinearGradient(0, -12, 0, 8);
            g.addColorStop(0, '#fff2b0');
            g.addColorStop(0.5, '#f2c23c');
            g.addColorStop(1, '#a8720e');
            ctx.fillStyle = g;
            ctx.strokeStyle = '#6e4a08';
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(-12, 8); ctx.lineTo(-13, -6); ctx.lineTo(-6, 0); ctx.lineTo(0, -11);
            ctx.lineTo(6, 0); ctx.lineTo(13, -6); ctx.lineTo(12, 8);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#e8304f';
            ctx.beginPath(); ctx.arc(0, 3, 2.2, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#3fb8ff';
            ctx.beginPath(); ctx.arc(-7, 4, 1.5, 0, Math.PI * 2); ctx.arc(7, 4, 1.5, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        function zeichneFeuerball(f) {
            if (drachenAtlas.bereit) {
                const bild = drachenAtlas.v.rot[Math.floor(spielRahmen / 4) % 2 ? 'f3' : 'f2'];
                const b = 64, h = b * bild.height / bild.width;
                ctx.save();
                ctx.translate(f.x, f.y);
                ctx.rotate(Math.atan2(f.vy, f.vx));
                ctx.drawImage(bild, -b * 0.82, -h / 2, b, h);
                ctx.restore();
                return;
            }
            const g = ctx.createRadialGradient(f.x - 3, f.y - 3, 1, f.x, f.y, f.r * 1.4);
            g.addColorStop(0, '#fff6b0');
            g.addColorStop(0.45, '#ffb347');
            g.addColorStop(1, 'rgba(255, 70, 40, 0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(f.x, f.y, f.r * 1.4, 0, Math.PI * 2);
            ctx.fill();
        }

        function zeichneBoss() {
            if (!boss) return;
            const b = boss;
            if (drachenAtlas.bereit) {
                ctx.save();
                if (b.trefferBlink > 0 && Math.floor(spielRahmen / 4) % 2 === 0) ctx.globalAlpha = 0.45;
                const kopf = zeichneDrachenPose('lila', bossPose(b), b.x + BOSS_B / 2, b.y + BOSS_H / 2, BOSS_MASSSTAB, b.drehung);
                if (!b.besiegt) zeichneKrone(kopf.x + kopf.b * 0.1, kopf.y - kopf.h * 0.2, 30);
                ctx.restore();
                b.maul = { x: kopf.x + 4, y: kopf.y + 4 };
                for (const f of feuerbaelle) zeichneFeuerball(f);
                return;
            }
            ctx.save();
            if (b.trefferBlink > 0 && Math.floor(spielRahmen / 4) % 2 === 0) ctx.globalAlpha = 0.4;
            ctx.translate(b.x + BOSS_B / 2, b.y + BOSS_H / 2);
            ctx.rotate(b.drehung);
            ctx.translate(-BOSS_B / 2, -BOSS_H / 2);
            ctx.scale(2, 2);
            zeichneDrache({ x: 0, y: 0, phase: b.phase, verscheucht: b.besiegt, drehung: 0, verfolgt: false, boss: true });
            // Krone
            ctx.fillStyle = '#ffd34d';
            ctx.strokeStyle = '#b8860b';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(11, 9);
            ctx.lineTo(10, -1); ctx.lineTo(14, 4);
            ctx.lineTo(17, -4); ctx.lineTo(20, 4);
            ctx.lineTo(24, -1); ctx.lineTo(24, 9);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#ff4d7a';
            ctx.beginPath(); ctx.arc(17, 5, 1.6, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#4dd2ff';
            ctx.beginPath(); ctx.arc(12.5, 6, 1.1, 0, Math.PI * 2); ctx.arc(21.5, 6, 1.1, 0, Math.PI * 2); ctx.fill();
            glanzlicht(14, 1, 1.2, 0.6, -0.5, 0.9);
            ctx.restore();

            for (const f of feuerbaelle) zeichneFeuerball(f);
        }

        function drachenKoenigTreffer(staerke, gross) {
            const b = boss;
            b.leben -= staerke;
            b.trefferBlink = gross ? 1.1 : 0.15;
            if (gross) {
                wackeln(10, 0.45);
                partikelExplosion(b.x + 40, b.y + BOSS_H / 2, 26, ['#ffd34d', '#ffffff', '#ff8ac4', '#7dffe0'], 'stern', 320);
            }
            if (b.leben <= 0) {
                b.besiegt = true;
                feuerbaelle = [];
                Klang.spiele('bossBesiegt');
                schwebeText(W / 2, 170, 'Der Drachenkönig flieht!', '#ffe14d', 30);
            } else {
                Klang.spiele(gross ? 'bossTreffer' : 'zauberTreffer');
            }
        }

        function zeichneBossLeiste() {
            if (!boss || boss.besiegt) return;
            ctx.fillStyle = 'rgba(14, 12, 34, 0.65)';
            ctx.beginPath();
            ctx.roundRect(W / 2 - 130, 10, 260, 40, 12);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = '16px Spielschrift, Arial';
            ctx.textAlign = 'left';
            ctx.fillText('Drachenkönig', W / 2 - 115, 36);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.fillRect(W / 2 + 10, 24, 105, 10);
            ctx.fillStyle = '#ff9a4d';
            ctx.fillRect(W / 2 + 10, 24, 105 * Math.max(0, boss.leben / BOSS_LEBEN), 10);
        }

        function resetSpiel() {
            score = 0;
            level = 1;
            sterne = [];
            hindernisse = [];
            drachen = [];
            drachenTimer = 0;
            levelHinweis = { text: '', unter: '', zeit: 0 };
            absturzGrund = 'wolke';
            einhorn.y = 150;
            einhorn.velocity = 0;
            spielRahmen = 0;
            unverwundbarTimer = 0;
            schutzTimer = 0;
            herzen = MAX_HERZEN;
            spielZeit = 0;
            neuerRekord = false;
            weltAnzeige = 0;
            sternErzeugungsTimer = 0;
            hindernisErzeugungsTimer = 0;
            partikel = [];
            schwebeTexte = [];
            komboZaehler = 0;
            komboTimer = 0;
            wackelZeit = 0;
            blitzZeit = 0;
            magnetTimer = 0;
            schildAktiv = false;
            schildTimer = 0;
            levelUpAusstehend = null;
            levelUpInfo = null;
            bossPhase = false;
            boss = null;
            feuerbaelle = [];
            zauberGeschosse = [];
            zauberAbklingzeit = 0;
            zauberGedrueckt = false;
            trolle = [];
            felsen = [];
            stosswellen = [];
            trollTimer = 0;
            trollKoenig = null;
            trollKoenigBesiegt = false;
        }

        function beendeSpiel(neuerZustand) {
            zustand = neuerZustand;
            eingabeGesperrtBis = performance.now() + SPERRZEIT_MS;
            Klang.musikStopp();
            inBestenlisteEintragen(neuerZustand === 'sieg');

            if (neuerZustand === 'sieg') Klang.spiele('sieg');
            else if (neuerRekord) Klang.spiele('rekord');
            else Klang.spiele('gameover');
        }

        function einsammeln(st) {
            const x = st.x, y = st.y;
            if (st.typ === 'herz') {
                herzen = Math.min(MAX_HERZEN, herzen + 1);
                Klang.spiele('herz');
                partikelExplosion(x, y, 6, ['#ff4d7a', '#ff8ab0'], 'herz', 160);
                schwebeText(x, y - 10, '+1 Herz', '#ff8ab0', 18);
                return;
            }
            if (st.typ === 'magnet') {
                magnetTimer = MAGNET_DAUER;
                Klang.spiele('magnet');
                partikelExplosion(x, y, 14, ['#ff4d5e', '#ffffff', '#e8eef5'], 'stern');
                schwebeText(x, y - 10, 'Sternen-Magnet!', '#ff8a98', 20);
                return;
            }
            if (st.typ === 'schild') {
                schildAktiv = true;
                schildTimer = SCHILD_DAUER;
                Klang.spiele('schild');
                partikelExplosion(x, y, 14, ['#9fd6ff', '#ffffff'], 'kreis');
                schwebeText(x, y - 10, 'Schutzschild!', '#bfe6ff', 20);
                return;
            }

            // Sterne zählen für die Kombo
            komboZaehler++;
            komboTimer = 1.8;
            if (st.typ === 'kraft') {
                unverwundbarTimer = 420;
                score += 2;
                Klang.spiele('kraft');
                partikelExplosion(x, y, 24, ['#ff6ad5', '#ffd34d', '#7dffe0', '#8f7dff', '#ffffff'], 'stern', 300);
                schwebeText(x, y - 10, bossPhase ? 'Regenbogen-Kraft! Greif an!' : '+2 Regenbogen!', '#7dffe0', 20);
            } else {
                score += 1;
                Klang.spiele('stern', 1 + Math.min(komboZaehler, 12) * 0.04);
                partikelExplosion(x, y, 10, ['#ffe14d', '#fff6b0', '#ffffff'], 'stern', 200);
                schwebeText(x, y - 10, '+1', '#ffe14d', 20);
            }
            if (komboZaehler % 5 === 0) {
                score += 1;
                Klang.spiele('kombo');
                schwebeText(einhorn.x + 50, einhorn.y - 15, 'Kombo x' + komboZaehler + '!  +1', '#ffd34d', 24);
            }

            pruefeFortschritt();
        }

        // Level-Aufstiege, Zwischenboss und Finale
        function pruefeFortschritt() {
            if (bossPhase || trollKoenig || levelUpAusstehend) return;
            if (score >= 100) {
                levelUpAusstehend = FINALE_INFO;
                return;
            }
            if (score >= 50 && !trollKoenigBesiegt) {
                levelUpAusstehend = TROLL_INFO;
                return;
            }
            const neuesLevel = Math.min(10, Math.floor(score / 10) + 1);
            if (neuesLevel > level) {
                const alteWelt = weltFuerLevel(level);
                level = neuesLevel;
                const neueWelt = weltFuerLevel(level);
                levelUpAusstehend = levelInfo(level, neueWelt !== alteWelt ? neueWelt : null);
                Klang.spiele('level');
            }
        }

        function treffer(grund) {
            if (schildAktiv) {
                // Schutzschild fängt den Treffer ab
                schildAktiv = false;
                schildTimer = 0;
                schutzTimer = 1.2;
                Klang.spiele('schildWeg');
                wackeln(4, 0.2);
                partikelExplosion(einhorn.x + 35, einhorn.y + 22, 18, ['#bfe6ff', '#ffffff', '#7cc4ff'], 'kreis', 260);
                schwebeText(einhorn.x + 40, einhorn.y - 5, 'Schild hat dich gerettet!', '#bfe6ff', 18);
                return;
            }
            herzen--;
            komboZaehler = 0;
            Klang.spiele('treffer');
            wackeln(9, 0.35);
            blitzZeit = 0.3;
            if (herzen <= 0) {
                absturzGrund = grund;
                beendeSpiel('gameover');
            } else {
                schutzTimer = 2;
                levelHinweis = {
                    text: 'Autsch!',
                    unter: herzen === 1 ? 'Nur noch 1 Herz – pass auf!' : 'Noch ' + herzen + ' Herzen',
                    zeit: 1.6
                };
            }
        }

        function formatZeit(sek) {
            const m = Math.floor(sek / 60);
            const s = Math.floor(sek % 60);
            return m + ':' + String(s).padStart(2, '0');
        }

        function zeichneErgebnisZeile(y) {
            ctx.save();
            ctx.textAlign = 'center';
            ctx.font = '19px Spielschrift, Arial';
            if (neuerRekord) {
                ctx.fillStyle = Math.floor(spielRahmen / 15) % 2 === 0 ? '#ffe14d' : '#ffffff';
                ctx.fillText('★ Neuer Rekord! ★', W / 2, y);
            } else if (letzterPlatz > 0) {
                ctx.fillStyle = '#ffe9a8';
                ctx.fillText('Platz ' + letzterPlatz + ' in der Bestenliste!', W / 2, y);
            } else if (bestenliste.length > 0) {
                ctx.fillStyle = '#ffe9a8';
                ctx.fillText('Rekord: ' + bestenliste[0].sterne + ' Sterne', W / 2, y);
            }
            ctx.restore();
        }

        function zeichneGrossesEinhorn(cx, cy, groesse) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(groesse, groesse);
            zeichnePixelEinhorn(-35, -25);

        }

        // ===== BILDSCHIRME =====
        function zeichneHauptmenue() {

        function zeichneBestenliste() {
            ctx.fillStyle = 'rgba(14, 12, 34, 0.6)';
            ctx.fillRect(0, 0, W, H);

                }
                ctx.fillText(datum, spalten[4], y);
            });

            zeichneKnopf('Zurück', W / 2 - 120, 320, 240, '#ffdf00', () => { zustand = 'menue'; });
