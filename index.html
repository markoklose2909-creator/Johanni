<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Die Abenteuer von Johanni und Glacier</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#ff69b4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Glacier">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            overscroll-behavior: none; 
        }

        #gameContainer {
            position: relative;
            width: 800px;
            height: 400px;
            cursor: pointer;
        }

        #gameCanvas {
            border: 4px solid #ff69b4;
            /* BUG FIX 2: Hintergrund wird jetzt per Canvas-Code gezeichnet,
               daher kein CSS-Hintergrund mehr nötig */
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            width: 100%;
            height: 100%;
            display: block;
            box-sizing: border-box;
        }

        .rundKnopf {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            background: rgba(106, 44, 138, 0.55);
            color: #ffffff;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .rundKnopf svg { width: 60%; height: 60%; }
        #pauseKnopf { left: 58px; display: none; }

        /* BUG FIX 1: Nur auf echten Mobilgeräten (max-width: 768px) im
           Hochformat ausblenden. Vorher wurde das Spiel auch in einem
           schmalen Chrome-Desktop-Fenster versteckt! */
        @media (orientation: portrait) and (max-width: 1100px) {
            #gameContainer {
                display: none;
            }
            body::after {
                content: "Bitte drehe dein Handy ins Querformat, um mit Glacier zu fliegen!";
                position: absolute;
                font-size: 20px;
                font-weight: bold;
                color: #ff69b4;
                text-align: center;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <button id="tonKnopf" class="rundKnopf" aria-label="Ton umschalten"></button>
        <button id="pauseKnopf" class="rundKnopf" aria-label="Pause" title="Pause">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        </button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Bei jeder Änderung hochzählen – steht klein unten rechts im Hauptmenü
        const SPIEL_VERSION = '1.7 (Vollbild)';

        // Ältere Browser (z. B. Firefox auf Fire-Tablets) kennen roundRect noch nicht.
        // Ohne diese Ergänzung bricht das Zeichnen der Knöpfe ab.
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, b, h, r) {
                r = Array.isArray(r) ? r[0] : (r || 0);
                r = Math.min(r, b / 2, h / 2);
                this.moveTo(x + r, y);
                this.arcTo(x + b, y, x + b, y + h, r);
                this.arcTo(x + b, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + b, y, r);
                this.closePath();
                return this;
            };
        }

        // Logische Spielfeldgröße. Das Canvas wird intern mit der Pixeldichte
        // des Geräts gerendert, damit auf Handys/Tablets alles scharf ist.
        const W = 800;
        const H = 400;
        // ===== AUTOMATISCHE BILDSCHIRMGRÖSSE =====
        // Das Spielfeld wird so groß wie möglich angezeigt (Seitenverhältnis 2:1)
        // und intern in passender Auflösung gezeichnet, damit es scharf bleibt.
        // Die Auflösung ist gedeckelt, damit schwache Tablets nicht ruckeln.
        const spielRahmenElement = document.getElementById('gameContainer');
        let aufloesung = 1;
        let anzeigeMassstab = 1;
        function groesseAnpassen() {
            const vw = window.innerWidth, vh = window.innerHeight;
            const abstand = (vw < 900 || vh < 500) ? 4 : 24;
            anzeigeMassstab = Math.max(0.3, Math.min((vw - abstand) / W, (vh - abstand) / H));
            spielRahmenElement.style.width = Math.floor(W * anzeigeMassstab) + 'px';
            spielRahmenElement.style.height = Math.floor(H * anzeigeMassstab) + 'px';
            document.body.style.height = vh + 'px';

            const dpr = window.devicePixelRatio || 1;
            aufloesung = Math.max(1, Math.min(anzeigeMassstab * dpr, 2));
            canvas.width = Math.round(W * aufloesung);
            canvas.height = Math.round(H * aufloesung);
            ctx.setTransform(aufloesung, 0, 0, aufloesung, 0, 0);

            // runde Knöpfe mitwachsen lassen
            const k = Math.round(Math.max(30, Math.min(72, 40 * anzeigeMassstab)));
            document.querySelectorAll('.rundKnopf').forEach((el, i) => {
                el.style.width = k + 'px';
                el.style.height = k + 'px';
                el.style.top = Math.round(10 * anzeigeMassstab) + 'px';
                el.style.left = Math.round((10 + i * 48) * anzeigeMassstab) + 'px';
            });
        }
        window.addEventListener('resize', groesseAnpassen);
        window.addEventListener('orientationchange', () => setTimeout(groesseAnpassen, 250));
        groesseAnpassen();

        // Zeit für die Hintergrund-Animation (Parallax)
        let hintergrundZeit = 0;

        const einhorn = {
            x: 70,
            y: 150,
            width: 70,
            height: 50,
            gravity: 1200,  
            velocity: 0,
            jump: -380      
        };

        let score = 0;
        let level = 1;
        let sterne = [];
        let hindernisse = [];
        let drachen = [];
        let drachenTimer = 0;
        let levelHinweis = { text: '', zeit: 0 };
        let absturzGrund = 'wolke';
        let spielRahmen = 0;
        
        let zustand = 'menue';   // menue, bestenliste, spiel, pause, gameover, sieg, tschuess
        let unverwundbarTimer = 0;
        
        // FIX 1: dt wird jetzt jeden Frame aus der echten Zeit berechnet,
        // damit das Spiel auf 60-, 90- und 120-Hz-Displays gleich schnell läuft.
        let dt = 1 / 60;
        let letzteZeit = null;

        // FIX 3: Nach Game Over / Sieg werden Klicks kurz ignoriert,
        // damit der Ergebnis-Bildschirm nicht sofort weggetippt wird.
        const SPERRZEIT_MS = 1000;
        let eingabeGesperrtBis = 0;

        let sternErzeugungsTimer = 0;
        let hindernisErzeugungsTimer = 0;

        // ===== TON & MUSIK =====
        // Alle Töne werden direkt im Browser erzeugt (Web Audio), ohne Sounddateien.
        // Ton-Knopf schaltet um: alles an -> nur Effekte -> stumm.
        const Klang = (() => {
            let ac = null, sfx = null, musik = null;
            let modus = 0;
            try { modus = parseInt(localStorage.getItem('jg-ton') || '0', 10) || 0; } catch (e) {}

            const midi = m => 440 * Math.pow(2, (m - 69) / 12);

            function start() {
                if (ac) {
                    if (ac.state === 'suspended') ac.resume();
                    return;
                }
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return;
                ac = new AC();
                const master = ac.createGain();
                master.gain.value = 0.6;
                master.connect(ac.destination);
                sfx = ac.createGain();
                sfx.connect(master);
                musik = ac.createGain();
                musik.connect(master);
                lautstaerkeSetzen();
            }

            function lautstaerkeSetzen() {
                if (!ac) return;
                sfx.gain.value = modus < 2 ? 1 : 0;
                musik.gain.value = modus === 0 ? 0.32 : 0;
            }

            function ton(freq, zeit, dauer, typ, laut, zielFreq, ausgang) {
                const o = ac.createOscillator();
                const g = ac.createGain();
                o.type = typ || 'sine';
                o.frequency.setValueAtTime(freq, zeit);
                if (zielFreq) o.frequency.exponentialRampToValueAtTime(zielFreq, zeit + dauer);
                g.gain.setValueAtTime(0.0001, zeit);
                g.gain.exponentialRampToValueAtTime(laut || 0.2, zeit + 0.012);
                g.gain.exponentialRampToValueAtTime(0.0001, zeit + dauer);
                o.connect(g);
                g.connect(ausgang || sfx);
                o.start(zeit);
                o.stop(zeit + dauer + 0.05);
            }

            const effekte = {
                flug:     n => ton(300, n, 0.12, 'sine', 0.07, 520),
                klick:    n => ton(660, n, 0.06, 'triangle', 0.12),
                stern:    (n, h) => { h = h || 1; ton(988 * h, n, 0.1, 'triangle', 0.2); ton(1319 * h, n + 0.07, 0.2, 'triangle', 0.2); },
                kombo:    n => [784, 988, 1175, 1568].forEach((f, i) => ton(f, n + i * 0.05, 0.16, 'triangle', 0.16)),
                magnet:   n => { ton(220, n, 0.35, 'sawtooth', 0.06, 880); ton(440, n + 0.1, 0.3, 'sine', 0.12, 1320); },
                schild:   n => [392, 523, 659, 784].forEach((f, i) => ton(f, n + i * 0.04, 0.35, 'sine', 0.14)),
                schildWeg: n => { ton(1200, n, 0.25, 'triangle', 0.15, 300); ton(800, n + 0.05, 0.2, 'square', 0.04, 200); },
                feuer:    n => ton(180, n, 0.35, 'sawtooth', 0.09, 70),
                bossTreffer: n => { ton(150, n, 0.5, 'square', 0.12, 50); [880, 1175].forEach((f, i) => ton(f, n + 0.1 + i * 0.08, 0.2, 'triangle', 0.15)); },
                bossBesiegt: n => [392, 494, 587, 784, 988, 1175, 1568].forEach((f, i) => ton(f, n + i * 0.09, 0.3, 'square', 0.07)),
                weiter:   n => { ton(659, n, 0.1, 'triangle', 0.15); ton(988, n + 0.08, 0.18, 'triangle', 0.15); },
                kraft:    n => [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => ton(f, n + i * 0.06, 0.2, 'square', 0.06)),
                herz:     n => { ton(659, n, 0.15, 'triangle', 0.22); ton(880, n + 0.12, 0.3, 'triangle', 0.22); },
                treffer:  n => ton(320, n, 0.4, 'sawtooth', 0.12, 80),
                verscheucht: n => ton(500, n, 0.35, 'triangle', 0.15, 1500),
                warnung:  n => { ton(880, n, 0.07, 'square', 0.035); ton(880, n + 0.13, 0.07, 'square', 0.035); },
                level:    n => { [523, 659, 784].forEach((f, i) => ton(f, n + i * 0.09, 0.14, 'square', 0.07)); ton(1047, n + 0.27, 0.4, 'square', 0.07); },
                gameover: n => [392, 330, 262, 196].forEach((f, i) => ton(f, n + i * 0.22, 0.32, 'triangle', 0.22)),
                rekord:   n => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => ton(f, n + i * 0.11, 0.2, 'square', 0.08)),
                sieg:     n => [523, 523, 523, 659, 784, 659, 784, 1047].forEach((f, i) =>
                              ton(f, n + [0, 0.12, 0.24, 0.36, 0.6, 0.84, 0.96, 1.2][i], i === 7 ? 0.8 : 0.2, 'square', 0.08))
            };

            function spiele(name, wert) {
                if (!ac || modus === 2) return;
                effekte[name](ac.currentTime + 0.01, wert);
            }

            // Fröhliche Musikschleife: 32 Achtelnoten Melodie + Bass
            const MELODIE = [72, 76, 79, 76, 74, 77, 81, 77, 76, 79, 84, 79, 77, 76, 74, null,
                             72, 74, 76, 79, 81, 79, 76, 74, 72, 76, 74, 71, 72, null, 67, null];
            const BASS = [48, 53, 55, 48];
            let musikLaeuft = false, naechsteNote = 0, schritt = 0, taktgeber = null;

            function planeMusik() {
                if (!musikLaeuft) return;
                const tempo = 118 + (level - 1) * 4 + (bossPhase ? 26 : 0);
                const achtel = 60 / tempo / 2;
                while (naechsteNote < ac.currentTime + 0.25) {
                    const m = MELODIE[schritt];
                    if (m) ton(midi(m), naechsteNote, achtel * 1.6, 'triangle', 0.18, null, musik);
                    if (schritt % 2 === 0) {
                        const grund = BASS[Math.floor(schritt / 8)];
                        const b = (schritt % 4 === 0) ? grund : grund + 7;
                        ton(midi(b), naechsteNote, achtel * 1.8, 'sine', 0.28, null, musik);
                    }
                    naechsteNote += achtel;
                    schritt = (schritt + 1) % MELODIE.length;
                }
            }

            function musikStart() {
                if (!ac || musikLaeuft) return;
                musikLaeuft = true;
                naechsteNote = ac.currentTime + 0.1;
                schritt = 0;
                taktgeber = setInterval(planeMusik, 50);
            }
            function musikStopp() {
                musikLaeuft = false;
                clearInterval(taktgeber);
            }

            function umschalten() {
                modus = (modus + 1) % 3;
                try { localStorage.setItem('jg-ton', String(modus)); } catch (e) {}
                lautstaerkeSetzen();
                return modus;
            }

            return { start, spiele, musikStart, musikStopp, umschalten, modus: () => modus };
        })();

        const TON_SYMBOLE = [
            // Lautsprecher mit Wellen + Note (alles an)
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6a8 8 0 0 1 0 12"/></svg>',
            // nur Effekte: Lautsprecher mit einer Welle und durchgestrichener Note
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M16 9a4 4 0 0 1 0 6"/><text x="17" y="22" font-size="8" fill="currentColor" stroke="none">FX</text></svg>',
            // stumm
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>'
        ];
        const tonKnopf = document.getElementById('tonKnopf');
        function tonKnopfZeichnen() {
            tonKnopf.innerHTML = TON_SYMBOLE[Klang.modus()];
            tonKnopf.title = ['Musik + Töne', 'Nur Töne', 'Stumm'][Klang.modus()];
        }
        function tonKnopfGedrueckt(e) {
            e.stopPropagation();
            if (e.cancelable) e.preventDefault();
            Klang.start();
            Klang.umschalten();
            tonKnopfZeichnen();
        }
        tonKnopf.addEventListener('touchstart', tonKnopfGedrueckt, { passive: false });
        tonKnopf.addEventListener('mousedown', tonKnopfGedrueckt);
        tonKnopfZeichnen();

        // ===== BESTENLISTE =====
        // Die 5 besten Läufe werden auf dem Gerät gespeichert.
        const BESTENLISTE_GROESSE = 5;
        let bestenliste = [];
        try { bestenliste = JSON.parse(localStorage.getItem('jg-bestenliste') || '[]'); } catch (e) {}
        if (!Array.isArray(bestenliste)) bestenliste = [];
        // alten Einzel-Rekord aus der Vorversion übernehmen
        if (bestenliste.length === 0) {
            try {
                const alt = JSON.parse(localStorage.getItem('jg-rekord') || 'null');
                if (alt && alt.sterne > 0) {
                    bestenliste.push({
                        sterne: alt.sterne,
                        level: Math.min(10, Math.floor(alt.sterne / 10) + 1),
                        sieg: alt.bestzeit != null,
                        zeit: alt.bestzeit != null ? alt.bestzeit : null,
                        datum: null
                    });
                }
            } catch (e) {}
        }
        let neuerRekord = false;
        let letzterPlatz = 0;

        function sortiereBestenliste() {
            bestenliste.sort((a, b) => {
                if (b.sterne !== a.sterne) return b.sterne - a.sterne;
                if (a.sieg && b.sieg) return a.zeit - b.zeit;   // schnellerer Sieg zuerst
                return (b.datum || '').localeCompare(a.datum || '');
            });
        }

        function inBestenlisteEintragen(sieg) {
            neuerRekord = false;
            letzterPlatz = 0;
            if (score <= 0) return;
            const bisherBester = bestenliste[0];
            const eintrag = { sterne: score, level: level, sieg: sieg, zeit: spielZeit, datum: new Date().toISOString() };
            bestenliste.push(eintrag);
            sortiereBestenliste();
            bestenliste = bestenliste.slice(0, BESTENLISTE_GROESSE);
            letzterPlatz = bestenliste.indexOf(eintrag) + 1;
            neuerRekord = letzterPlatz === 1 && (!bisherBester ||
                eintrag.sterne > bisherBester.sterne ||
                (sieg && (!bisherBester.sieg || eintrag.zeit < bisherBester.zeit)));
            try { localStorage.setItem('jg-bestenliste', JSON.stringify(bestenliste)); } catch (e) {}
        }

        // ===== HERZEN =====
        const MAX_HERZEN = 3;
        let herzen = MAX_HERZEN;
        let schutzTimer = 0;   // Sekunden Schutz nach einem Treffer
        let spielZeit = 0;

        function zeichneHerz(x, y, groesse, voll) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(groesse / 20, groesse / 20);
            ctx.beginPath();
            ctx.moveTo(0, 6);
            ctx.bezierCurveTo(0, 0, -10, -2, -10, -7);
            ctx.bezierCurveTo(-10, -12, -3, -13, 0, -8);
            ctx.bezierCurveTo(3, -13, 10, -12, 10, -7);
            ctx.bezierCurveTo(10, -2, 0, 0, 0, 6);
            ctx.closePath();
            ctx.fillStyle = voll ? '#ff4d7a' : 'rgba(255, 255, 255, 0.25)';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
        }

        // ===== HINTERGRUND =====
        // Mehrere Ebenen, die unterschiedlich schnell vorbeiziehen (Parallax):
        // Himmel, Sonne, ferne Wolken, Berge, Hügel mit Burgruine, Wiese.

        const ferneWolken = [
            { x: 60,  y: 55,  s: 1.0 },
            { x: 290, y: 95,  s: 0.7 },
            { x: 520, y: 45,  s: 0.85 },
            { x: 760, y: 110, s: 0.6 },
            { x: 960, y: 70,  s: 0.9 }
        ];

        function schleife(wert, laenge) {
            return ((wert % laenge) + laenge) % laenge;
        }

        function huegelHoehe(x, basis, amp, welle) {
            return basis
                + Math.sin(x / welle) * amp
                + Math.sin(x / (welle * 0.43) + 1.7) * amp * 0.45;
        }

        function zeichneHuegel(versatz, basis, amp, welle, farbe) {
            ctx.fillStyle = farbe;
            ctx.beginPath();
            ctx.moveTo(0, H);
            for (let x = 0; x <= W + 10; x += 10) {
                ctx.lineTo(x, huegelHoehe(x + versatz, basis, amp, welle));
            }
            ctx.lineTo(W, H);
            ctx.closePath();
            ctx.fill();
        }

        function zeichneWeicheWolke(x, y, s, alpha, farbe) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = farbe || '#ffffff';
            ctx.beginPath();
            ctx.ellipse(x, y, 46 * s, 16 * s, 0, 0, Math.PI * 2);
            ctx.ellipse(x - 20 * s, y - 8 * s, 22 * s, 16 * s, 0, 0, Math.PI * 2);
            ctx.ellipse(x + 10 * s, y - 16 * s, 26 * s, 20 * s, 0, 0, Math.PI * 2);
            ctx.ellipse(x + 32 * s, y - 4 * s, 18 * s, 13 * s, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function zeichneBurgruine(x, boden, farbe, fensterFarbe) {
            ctx.fillStyle = farbe;
            ctx.beginPath();
            // linker Turm mit Zinnen
            ctx.moveTo(x, boden);
            ctx.lineTo(x, boden - 62);
            ctx.lineTo(x + 6, boden - 62); ctx.lineTo(x + 6, boden - 56);
            ctx.lineTo(x + 11, boden - 56); ctx.lineTo(x + 11, boden - 62);
            ctx.lineTo(x + 17, boden - 62); ctx.lineTo(x + 17, boden - 56);
            ctx.lineTo(x + 22, boden - 56); ctx.lineTo(x + 22, boden - 62);
            ctx.lineTo(x + 28, boden - 62);
            // eingestürzte Mauer
            ctx.lineTo(x + 28, boden - 34);
            ctx.lineTo(x + 36, boden - 40);
            ctx.lineTo(x + 44, boden - 30);
            ctx.lineTo(x + 52, boden - 38);
            ctx.lineTo(x + 60, boden - 28);
            // kaputter rechter Turm
            ctx.lineTo(x + 60, boden - 46);
            ctx.lineTo(x + 66, boden - 52);
            ctx.lineTo(x + 72, boden - 44);
            ctx.lineTo(x + 76, boden - 50);
            ctx.lineTo(x + 76, boden);
            ctx.closePath();
            ctx.fill();
            // Fenster
            ctx.fillStyle = fensterFarbe;
            ctx.beginPath();
            ctx.ellipse(x + 14, boden - 42, 3, 6, 0, 0, Math.PI * 2);
            ctx.ellipse(x + 68, boden - 34, 2.5, 5, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        function zeichneBlume(x, y, farbe) {
            ctx.fillStyle = farbe;
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                const w = i / 5 * Math.PI * 2;
                ctx.moveTo(x + Math.cos(w) * 3.5 + 2.5, y + Math.sin(w) * 3.5);
                ctx.arc(x + Math.cos(w) * 3.5, y + Math.sin(w) * 3.5, 2.5, 0, Math.PI * 2);
            }
            ctx.fill();
            ctx.fillStyle = '#ffe14d';
            ctx.beginPath();
            ctx.arc(x, y, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        // ===== WELTEN =====
        // Alle 2 Level wechselt die Tageszeit, mit weichem Übergang.
        const WELTEN = [
            { name: 'Morgen',          himmel: ['#7fb4e6', '#ffd3b5', '#ffb3c7'], sonne: '#ffcf70', sx: 150, sy: 215, berge: '#c4b5e0', huegel: '#a8d98e', vorne: '#78c463', ruine: '#8c90b8', wolke: '#fff0f5', wolkenAlpha: 0.85 },
            { name: 'Mittag',          himmel: ['#5fb8f5', '#a9dcff', '#ffe0ef'], sonne: '#ffe36e', sx: 470, sy: 75,  berge: '#b9c4ea', huegel: '#9fd88a', vorne: '#6cc35a', ruine: '#7d8fb3', wolke: '#ffffff', wolkenAlpha: 0.85 },
            { name: 'Nachmittag',      himmel: ['#4aa3e8', '#9fd0f5', '#fff1c9'], sonne: '#ffd84a', sx: 620, sy: 125, berge: '#b0b8e0', huegel: '#a3d47a', vorne: '#6fbd4f', ruine: '#7a88ad', wolke: '#fffbea', wolkenAlpha: 0.85 },
            { name: 'Sonnenuntergang', himmel: ['#3d4a9c', '#e07aa0', '#ffb36b'], sonne: '#ff8a3d', sx: 640, sy: 235, berge: '#8a6fae', huegel: '#6f9e63', vorne: '#4f8a45', ruine: '#5e5a86', wolke: '#ffc9c0', wolkenAlpha: 0.8 },
            { name: 'Nacht',           himmel: ['#0e1a40', '#253a78', '#4a4f9a'], sonne: '#f4f1d0', sx: 440, sy: 85,  berge: '#3c4680', huegel: '#2f5e4a', vorne: '#244d3a', ruine: '#2c3460', wolke: '#9aa6d6', wolkenAlpha: 0.35 }
        ];
        let weltAnzeige = 0;   // läuft weich zur Zielwelt (z. B. 1.4 = mitten im Übergang)

        function weltFuerLevel(lvl) {
            return Math.min(WELTEN.length - 1, Math.floor((lvl - 1) / 2));
        }

        function hexZuRgb(hex) {
            const n = parseInt(hex.slice(1), 16);
            return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
        }
        function mischeFarbe(a, b, t) {
            const x = hexZuRgb(a), y = hexZuRgb(b);
            const m = x.map((v, i) => Math.round(v + (y[i] - v) * t));
            return `rgb(${m[0]}, ${m[1]}, ${m[2]})`;
        }
        function abdunkeln(farbeRgb, faktor) {
            const m = farbeRgb.match(/\d+/g).map(Number);
            return `rgb(${m.map(v => Math.round(v * faktor)).join(', ')})`;
        }

        function aktuellePalette() {
            const i = Math.floor(weltAnzeige);
            const j = Math.min(WELTEN.length - 1, i + 1);
            const t = weltAnzeige - i;
            const a = WELTEN[i], b = WELTEN[j];
            return {
                himmel: a.himmel.map((f, k) => mischeFarbe(f, b.himmel[k], t)),
                sonne: mischeFarbe(a.sonne, b.sonne, t),
                sx: a.sx + (b.sx - a.sx) * t,
                sy: a.sy + (b.sy - a.sy) * t,
                berge: mischeFarbe(a.berge, b.berge, t),
                huegel: mischeFarbe(a.huegel, b.huegel, t),
                vorne: mischeFarbe(a.vorne, b.vorne, t),
                ruine: mischeFarbe(a.ruine, b.ruine, t),
                wolke: mischeFarbe(a.wolke, b.wolke, t),
                wolkenAlpha: a.wolkenAlpha + (b.wolkenAlpha - a.wolkenAlpha) * t,
                nacht: Math.max(0, Math.min(1, weltAnzeige - (WELTEN.length - 2)))
            };
        }

        // feste Positionen für den Sternenhimmel bei Nacht
        const himmelsSterne = Array.from({ length: 45 }, (_, i) => ({
            x: (i * 173.3) % W,
            y: (i * 61.7) % 230,
            r: 0.8 + (i % 3) * 0.5,
            phase: i * 1.3
        }));

        function zeichneHintergrund() {
            const t = hintergrundZeit;
            const p = aktuellePalette();

            // Himmel
            const himmel = ctx.createLinearGradient(0, 0, 0, H);
            himmel.addColorStop(0, p.himmel[0]);
            himmel.addColorStop(0.55, p.himmel[1]);
            himmel.addColorStop(1, p.himmel[2]);
            ctx.fillStyle = himmel;
            ctx.fillRect(0, 0, W, H);

            // Sternenhimmel (nur nachts)
            if (p.nacht > 0) {
                ctx.fillStyle = '#ffffff';
                for (const st of himmelsSterne) {
                    ctx.globalAlpha = p.nacht * (0.5 + 0.5 * Math.sin(spielRahmen / 30 + st.phase));
                    ctx.beginPath();
                    ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }

            // Sonne bzw. Mond mit Schein
            const sx = p.sx, sy = p.sy;
            const glanz = p.sonne.replace('rgb', 'rgba').replace(')', ', ');
            const schein = ctx.createRadialGradient(sx, sy, 20, sx, sy, 110);
            schein.addColorStop(0, glanz + (0.75 - p.nacht * 0.45) + ')');
            schein.addColorStop(1, glanz + '0)');
            ctx.fillStyle = schein;
            ctx.fillRect(sx - 110, sy - 110, 220, 220);
            ctx.fillStyle = p.sonne;
            ctx.beginPath();
            ctx.arc(sx, sy, 32 - p.nacht * 6, 0, Math.PI * 2);
            ctx.fill();
            if (p.nacht > 0) {
                // Mondkrater
                ctx.globalAlpha = p.nacht * 0.25;
                ctx.fillStyle = '#b9b48f';
                ctx.beginPath();
                ctx.arc(sx - 8, sy - 6, 5, 0, Math.PI * 2);
                ctx.arc(sx + 7, sy + 8, 4, 0, Math.PI * 2);
                ctx.arc(sx + 9, sy - 9, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }

            // Ferne Wolken (sehr langsam)
            for (const w of ferneWolken) {
                const x = schleife(w.x - t * 12, W + 240) - 120;
                zeichneWeicheWolke(x, w.y, w.s, p.wolkenAlpha, p.wolke);
            }

            // Berge in der Ferne
            zeichneHuegel(t * 15, 255, 30, 90, p.berge);

            // Hügel mit Burgruine
            const mitteVersatz = t * 30;
            const ruinenAbstand = 1400;
            const ruinenX = schleife(500 - mitteVersatz, ruinenAbstand) - 150;
            zeichneBurgruine(ruinenX, huegelHoehe(ruinenX + 38 + mitteVersatz, 300, 22, 110) + 6,
                p.ruine, abdunkeln(p.ruine, 0.75));
            zeichneHuegel(mitteVersatz, 300, 22, 110, p.huegel);

            // Vordere Wiese
            const vorneVersatz = t * 70;
            zeichneHuegel(vorneVersatz, 355, 10, 70, p.vorne);
            const blumenFarben = ['#ff7eb6', '#ffffff', '#c38bff', '#ff9f6b'];
            ctx.globalAlpha = 1 - p.nacht * 0.45;
            for (let i = 0; i < 14; i++) {
                const bx = schleife(i * 67 - vorneVersatz, W + 60) - 30;
                const by = huegelHoehe(bx + vorneVersatz, 355, 10, 70) + 14 + (i % 3) * 9;
                zeichneBlume(bx, by, blumenFarben[i % blumenFarben.length]);
            }
            ctx.globalAlpha = 1;

            // Glühwürmchen in der Nacht
            if (p.nacht > 0) {
                ctx.fillStyle = '#fff59a';
                for (let i = 0; i < 10; i++) {
                    const gx = schleife(i * 97 - t * 25 + Math.sin(spielRahmen / 40 + i) * 15, W);
                    const gy = 300 + Math.sin(spielRahmen / 25 + i * 2) * 25 + (i % 4) * 18;
                    ctx.globalAlpha = p.nacht * (0.4 + 0.6 * Math.abs(Math.sin(spielRahmen / 20 + i)));
                    ctx.beginPath();
                    ctx.arc(gx, gy, 2.2, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }
        }

        // ===== KNÖPFE & STEUERUNG =====
        // Knöpfe auf dem Spielfeld werden jedes Bild neu gezeichnet und
        // hier gesammelt, damit ein Tippen dem richtigen Knopf zugeordnet wird.
        let knoepfe = [];
        let standbild = null;   // eingefrorenes Bild für den Pause-Bildschirm
        const pauseKnopf = document.getElementById('pauseKnopf');

        function zeichneKnopf(text, x, y, b, farbe, aktion, h) {
            h = h || 52;
            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
            ctx.beginPath();
            ctx.roundRect(x, y + 4, b, h, 16);
            ctx.fill();
            ctx.fillStyle = farbe;
            ctx.beginPath();
            ctx.roundRect(x, y, b, h, 16);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.fillStyle = '#3a2350';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, x + b / 2, y + h / 2 + 1);
            ctx.restore();
            knoepfe.push({ x: x, y: y, b: b, h: h, aktion: aktion });
        }

        function konturText(text, x, y, schrift, fuellung, kontur, breite) {
            ctx.save();
            ctx.font = schrift;
            ctx.textAlign = 'center';
            ctx.lineJoin = 'round';
            ctx.lineWidth = breite || 6;
            ctx.strokeStyle = kontur || '#6a2c8a';
            ctx.strokeText(text, x, y);
            ctx.fillStyle = fuellung || '#ffffff';
            ctx.fillText(text, x, y);
            ctx.restore();
        }

        function punktAusEreignis(e) {
            let cx, cy;
            if (e && e.touches && e.touches.length) {
                cx = e.touches[0].clientX;
                cy = e.touches[0].clientY;
            } else if (e && e.clientX !== undefined) {
                cx = e.clientX;
                cy = e.clientY;
            } else {
                return null;
            }
            const r = canvas.getBoundingClientRect();
            const rand = 4;   // Rahmen des Spielfelds
            return {
                x: (cx - r.left - rand) / (r.width - 2 * rand) * W,
                y: (cy - r.top - rand) / (r.height - 2 * rand) * H
            };
        }

        function spielStarten() {
            resetSpiel();
            zustand = 'spiel';
            Klang.musikStart();
        }

        function pausieren() {
            if (zustand !== 'spiel') return;
            standbild = document.createElement('canvas');
            standbild.width = canvas.width;
            standbild.height = canvas.height;
            standbild.getContext('2d').drawImage(canvas, 0, 0);
            zustand = 'pause';
            Klang.musikStopp();
        }

        function weiterSpielen() {
            zustand = 'spiel';
            Klang.musikStart();
        }

        function zumHauptmenue() {
            // abgebrochenes Spiel zählt trotzdem für die Bestenliste
            if (zustand === 'pause') inBestenlisteEintragen(false);
            Klang.musikStopp();
            zustand = 'menue';
        }

        function appBeenden() {
            Klang.musikStopp();
            zustand = 'tschuess';
            // Browser erlauben das Schließen nur manchmal; sonst bleibt der Abschiedsbildschirm
            try { window.close(); } catch (e) {}
        }

        function steuerungAusloesen(e) {
            if (e && e.cancelable) e.preventDefault();
            Klang.start();

            if (zustand === 'spiel') {
                einhorn.velocity = einhorn.jump;
                Klang.spiele('flug');
                return;
            }

            const p = punktAusEreignis(e);
            if (!p) return;
            for (const k of knoepfe) {
                if (p.x >= k.x && p.x <= k.x + k.b && p.y >= k.y && p.y <= k.y + k.h) {
                    Klang.spiele('klick');
                    k.aktion();
                    return;
                }
            }
        }

        function pauseGedrueckt(e) {
            e.stopPropagation();
            if (e.cancelable) e.preventDefault();
            Klang.start();
            Klang.spiele('klick');
            pausieren();
        }
        pauseKnopf.addEventListener('touchstart', pauseGedrueckt, { passive: false });
        pauseKnopf.addEventListener('mousedown', pauseGedrueckt);

        // Wenn die App in den Hintergrund geht, automatisch pausieren
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) pausieren();
        });

        window.onload = function() {
            window.addEventListener('mousedown', steuerungAusloesen, { passive: false });
            window.addEventListener('touchstart', steuerungAusloesen, { passive: false });
            window.addEventListener('keydown', function(e) {
                const gesperrt = performance.now() < eingabeGesperrtBis;
                if (e.code === 'Space') {
                    e.preventDefault();
                    Klang.start();
                    if (zustand === 'spiel') steuerungAusloesen(null);
                    else if (zustand === 'menue') spielStarten();
                    else if (zustand === 'pause') weiterSpielen();
                    else if (zustand === 'levelup') weiterNachLevelUp();
                    else if ((zustand === 'gameover' || zustand === 'sieg') && !gesperrt) spielStarten();
                } else if (e.code === 'Escape' || e.code === 'KeyP') {
                    if (zustand === 'spiel') pausieren();
                    else if (zustand === 'pause') weiterSpielen();
                }
            });
            requestAnimationFrame(update);
        };


        // ===== LICHT-HILFEN (plastischer Look) =====
        // Licht kommt von oben links. Runde Flächen bekommen einen Verlauf
        // von hell (Lichtseite) nach dunkel (Schattenseite).
        function kugelVerlauf(x, y, r, hell, mitte, dunkel) {
            const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.45, r * 0.05, x, y, r * 1.15);
            g.addColorStop(0, hell);
            g.addColorStop(0.55, mitte);
            g.addColorStop(1, dunkel);
            return g;
        }
        function glanzlicht(x, y, rx, ry, drehung, alpha) {
            ctx.save();
            ctx.globalAlpha *= alpha;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(x, y, rx, ry, drehung || 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // ===== JOHANNI =====
        // Reitet auf Glacier: dunkelblonde, mittellange Haare,
        // türkiser Heldinnen-Umhang. Koordinaten relativ zu Glacier.
        function zeichneJohanni(t) {
            const wehen = Math.sin(t * 10) * 2;
            ctx.save();
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            // Umhang mit Faltenschatten
            const umhang = ctx.createLinearGradient(36, 3, 16, 18);
            umhang.addColorStop(0, '#2fd0e0');
            umhang.addColorStop(0.6, '#17a9ba');
            umhang.addColorStop(1, '#0c7f8d');
            ctx.fillStyle = umhang;
            ctx.strokeStyle = '#0a5f6a';
            ctx.lineWidth = 1.1;
            ctx.beginPath();
            ctx.moveTo(36, 3);
            ctx.quadraticCurveTo(26, 4 + wehen, 17, 9 + wehen);
            ctx.quadraticCurveTo(20, 14 + wehen, 15, 19 + wehen * 1.5);
            ctx.quadraticCurveTo(27, 18, 35, 15);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // Falte
            ctx.strokeStyle = 'rgba(8, 80, 90, 0.45)';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(32, 6);
            ctx.quadraticCurveTo(25, 10 + wehen, 21, 15 + wehen);
            ctx.stroke();

            // Bein mit Stiefel
            const bein = ctx.createLinearGradient(36, 15, 42, 15);
            bein.addColorStop(0, '#2aa3c4');
            bein.addColorStop(1, '#156e86');
            ctx.strokeStyle = bein;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(37, 15);
            ctx.lineTo(41, 23);
            ctx.stroke();
            ctx.fillStyle = kugelVerlauf(42, 24.5, 3.2, '#a8784e', '#7a5434', '#4e3420');
            ctx.beginPath();
            ctx.ellipse(42, 24.5, 3, 2, 0.3, 0, Math.PI * 2);
            ctx.fill();
            glanzlicht(41.2, 23.6, 1.1, 0.5, 0.3, 0.6);

            // Oberkörper
            ctx.fillStyle = kugelVerlauf(37.5, 9, 7, '#8ff0f8', '#3fd3e3', '#1b98a8');
            ctx.strokeStyle = '#0a5f6a';
            ctx.lineWidth = 1.1;
            ctx.beginPath();
            ctx.ellipse(37.5, 9, 4.5, 6.5, 0.15, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#ffe14d';
            ctx.beginPath();
            ctx.arc(38.5, 8.5, 1.4, 0, Math.PI * 2);
            ctx.fill();
            glanzlicht(38.1, 8.1, 0.5, 0.5, 0, 0.9);

            // Arm
            ctx.strokeStyle = '#f5c6a8';
            ctx.lineWidth = 2.6;
            ctx.beginPath();
            ctx.moveTo(39, 6);
            ctx.lineTo(45, 10);
            ctx.stroke();

            // Haare hinten
            const haarVerlauf = kugelVerlauf(36.5, 0, 8, '#d9b77e', '#b08d57', '#7d6036');
            ctx.fillStyle = haarVerlauf;
            ctx.beginPath();
            ctx.ellipse(36.5, 0, 5.8, 6.8, 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(33, -2);
            ctx.quadraticCurveTo(29, 4 + wehen * 0.5, 31, 7 + wehen * 0.6);
            ctx.lineTo(36, 5);
            ctx.closePath();
            ctx.fill();

            // Gesicht (Wange zur Lichtseite heller)
            ctx.fillStyle = kugelVerlauf(39.5, -1, 5.5, '#fff0e4', '#ffd9c0', '#e8b494');
            ctx.beginPath();
            ctx.arc(39.5, -1, 4.6, 0, Math.PI * 2);
            ctx.fill();

            // Pony mit Haarglanz
            ctx.fillStyle = haarVerlauf;
            ctx.beginPath();
            ctx.ellipse(38.6, -4.6, 5.2, 2.8, 0.15, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 240, 200, 0.75)';
            ctx.lineWidth = 0.9;
            ctx.beginPath();
            ctx.arc(37.8, -3.2, 4, Math.PI * 1.15, Math.PI * 1.55);
            ctx.stroke();

            // Auge, Bäckchen, Lächeln
            ctx.fillStyle = '#2b2440';
            ctx.beginPath();
            ctx.arc(41.6, -1.2, 0.9, 0, Math.PI * 2);
            ctx.fill();
            glanzlicht(41.35, -1.5, 0.3, 0.3, 0, 1);
            ctx.fillStyle = 'rgba(255, 120, 150, 0.5)';
            ctx.beginPath();
            ctx.arc(41, 1.2, 1.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#a0524a';
            ctx.lineWidth = 0.9;
            ctx.beginPath();
            ctx.arc(42.3, 0.8, 1.4, 0.2, Math.PI * 0.8);
            ctx.stroke();

            ctx.restore();
        }

        // ===== GLACIER ALS BILD =====
        // Zwei gezeichnete Posen: „Springen“ beim Hochfliegen, „Galopp“ beim Fallen.

        const glacierBilder = { spring: new Image(), galopp: new Image(), bereit: 0 };
        glacierBilder.spring.onload = () => glacierBilder.bereit++;
        glacierBilder.galopp.onload = () => glacierBilder.bereit++;
        glacierBilder.spring.src = GLACIER_BILDDATEN.spring;
        glacierBilder.galopp.src = GLACIER_BILDDATEN.galopp;
        const GLACIER_BILD_BREITE = 108;

        function zeichneGlacierBild(x, y) {
            const t = spielRahmen / 60;
            const kraft = unverwundbarTimer > 0;
            ctx.save();
            if (schutzTimer > 0 && Math.floor(spielRahmen / 5) % 2 === 0) ctx.globalAlpha = 0.35;
            ctx.translate(x + 35, y + 25);
            const neigung = zustand === 'spiel'
                ? Math.max(-0.3, Math.min(0.3, einhorn.velocity / 1300))
                : Math.sin(t * 2) * 0.04;
            ctx.rotate(neigung);

            if (kraft) {
                const farbton = (t * 360) % 360;
                const schein = ctx.createRadialGradient(0, -6, 12, 0, -6, 70);
                schein.addColorStop(0, `hsla(${farbton}, 100%, 75%, 0.65)`);
                schein.addColorStop(1, `hsla(${(farbton + 60) % 360}, 100%, 70%, 0)`);
                ctx.fillStyle = schein;
                ctx.beginPath();
                ctx.ellipse(0, -6, 72, 58, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            const steigt = zustand === 'spiel' ? einhorn.velocity < 60 : Math.sin(t * 3) > 0;
            const bild = steigt ? glacierBilder.spring : glacierBilder.galopp;
            const b = GLACIER_BILD_BREITE;
            const h = b * bild.height / bild.width;
            const wippen = Math.sin(t * 9) * 1.5;
            ctx.drawImage(bild, -b * 0.5, -h * 0.6 + wippen, b, h);

            // Funkeln am Horn
            const funkeln = 0.5 + 0.5 * Math.sin(t * 4);
            ctx.globalAlpha *= funkeln;
            ctx.fillStyle = '#ffffff';
            zeichneFunkeln(b * 0.41, -h * 0.6 + h * 0.08 + wippen, 2.2);
            ctx.restore();
        }

        // ===== GLACIER (Code-Zeichnung, Ersatz) =====
        function zeichnePixelEinhorn(x, y) {
            if (glacierBilder.bereit >= 2) {
                zeichneGlacierBild(x, y);
                return;
            }
            const t = spielRahmen / 60;
            const kraft = unverwundbarTimer > 0;
            const umriss = '#8aa3c8';

            ctx.save();
            if (schutzTimer > 0 && Math.floor(spielRahmen / 5) % 2 === 0) {
                ctx.globalAlpha = 0.35;
            }
            ctx.translate(x + 35, y + 25);
            const neigung = zustand === 'spiel'
                ? Math.max(-0.35, Math.min(0.35, einhorn.velocity / 1100))
                : 0;
            ctx.rotate(neigung);
            ctx.translate(-35, -25);
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            if (kraft) {
                const farbton = (t * 360) % 360;
                const schein = ctx.createRadialGradient(36, 22, 10, 36, 22, 50);
                schein.addColorStop(0, `hsla(${farbton}, 100%, 75%, 0.6)`);
                schein.addColorStop(1, `hsla(${(farbton + 60) % 360}, 100%, 70%, 0)`);
                ctx.fillStyle = schein;
                ctx.beginPath();
                ctx.ellipse(36, 22, 50, 40, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            const maehne = kraft
                ? [0, 1, 2].map(i => `hsl(${(t * 360 + i * 60) % 360}, 95%, 65%)`)
                : ['#ff8ac4', '#b98cff', '#6fd6ff'];
            const maehneHell = kraft
                ? [0, 1, 2].map(i => `hsl(${(t * 360 + i * 60) % 360}, 100%, 85%)`)
                : ['#ffc4e1', '#dcc6ff', '#bdeeff'];

            // Schweif mit Glanzlinie
            const wehen = Math.sin(t * 8) * 3;
            maehne.forEach((farbe, i) => {
                ctx.beginPath();
                ctx.moveTo(16, 22 + i * 2);
                ctx.quadraticCurveTo(4, 18 + i * 5 + wehen, -2, 30 + i * 4 - wehen);
                ctx.strokeStyle = farbe;
                ctx.lineWidth = 5;
                ctx.stroke();
                ctx.strokeStyle = maehneHell[i];
                ctx.lineWidth = 1.6;
                ctx.stroke();
            });

            // Beine: hintere (ferne) Beine dunkler -> Tiefe
            const lauf = Math.sin(t * 10) * 3;
            const beine = [[27, -lauf, true], [49, lauf, true], [20, lauf, false], [42, -lauf, false]];
            for (const [bx, schwung, fern] of beine) {
                ctx.strokeStyle = umriss;
                ctx.lineWidth = 7.5;
                ctx.beginPath();
                ctx.moveTo(bx, 32);
                ctx.lineTo(bx + schwung, 45);
                ctx.stroke();
                const beinFarbe = ctx.createLinearGradient(bx - 3, 0, bx + 3, 0);
                beinFarbe.addColorStop(0, fern ? '#e9eef7' : '#ffffff');
                beinFarbe.addColorStop(1, fern ? '#b9c7de' : '#d6e0ef');
                ctx.strokeStyle = beinFarbe;
                ctx.lineWidth = 5;
                ctx.stroke();
                ctx.fillStyle = kugelVerlauf(bx + schwung, 46, 3.5, '#ffd1e6', '#ff9cc9', '#d8679c');
                ctx.beginPath();
                ctx.arc(bx + schwung, 46, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            // Körper + Hals mit Rundung
            const fell = kugelVerlauf(34, 26, 24, '#ffffff', '#eaf0f8', '#a9bad6');
            ctx.fillStyle = fell;
            ctx.strokeStyle = umriss;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.ellipse(34, 28, 20, 11, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = kugelVerlauf(50, 16, 16, '#ffffff', '#eef3fa', '#c3d0e4');
            ctx.beginPath();
            ctx.moveTo(43, 24);
            ctx.quadraticCurveTo(46, 12, 52, 6);
            ctx.lineTo(60, 12);
            ctx.quadraticCurveTo(54, 22, 52, 32);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = fell;
            ctx.beginPath();
            ctx.ellipse(45, 26, 7, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            // Bauchschatten
            ctx.fillStyle = 'rgba(120, 140, 185, 0.22)';
            ctx.beginPath();
            ctx.ellipse(34, 35, 15, 3.5, 0, 0, Math.PI * 2);
            ctx.fill();
            glanzlicht(28, 21, 9, 2.6, -0.1, 0.85);

            // Kopf
            ctx.fillStyle = kugelVerlauf(58, 10, 11, '#ffffff', '#f1f5fb', '#c3d0e4');
            ctx.strokeStyle = umriss;
            ctx.beginPath();
            ctx.ellipse(58, 10, 9, 7, 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = kugelVerlauf(64, 14, 6, '#fff6fa', '#ffe6f1', '#f2bcd3');
            ctx.beginPath();
            ctx.ellipse(64, 14, 5.5, 4.5, 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#d98aa8';
            ctx.beginPath();
            ctx.arc(66, 13.5, 0.9, 0, Math.PI * 2);
            ctx.fill();
            glanzlicht(55, 5.5, 3.5, 1.4, 0.2, 0.9);

            // Ohr
            ctx.fillStyle = '#f4f7fc';
            ctx.beginPath();
            ctx.moveTo(52, 5);
            ctx.lineTo(53, -3);
            ctx.lineTo(57, 3);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#ffc9df';
            ctx.beginPath();
            ctx.moveTo(53.3, 3.6);
            ctx.lineTo(53.6, -0.5);
            ctx.lineTo(55.6, 2.8);
            ctx.closePath();
            ctx.fill();

            // Horn mit Metallglanz
            const horn = ctx.createLinearGradient(57, 0, 63, -2);
            horn.addColorStop(0, '#fff6c2');
            horn.addColorStop(0.45, '#ffd34d');
            horn.addColorStop(1, '#c98f0f');
            ctx.fillStyle = horn;
            ctx.strokeStyle = '#b8860b';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(57, 3);
            ctx.lineTo(64, -12);
            ctx.lineTo(61, 5);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(58.5, 0); ctx.lineTo(61.5, 0.5);
            ctx.moveTo(60, -4); ctx.lineTo(62.3, -3.6);
            ctx.moveTo(61.4, -7.6); ctx.lineTo(63, -7.3);
            ctx.stroke();
            // Funkeln an der Hornspitze
            const funkeln = 0.5 + 0.5 * Math.sin(t * 4);
            ctx.save();
            ctx.globalAlpha *= funkeln;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(64, -15.5); ctx.lineTo(64, -9.5);
            ctx.moveTo(61, -12.5); ctx.lineTo(67, -12.5);
            ctx.stroke();
            ctx.restore();

            // Mähne: jede Locke als kleine Kugel
            maehne.forEach((farbe, i) => {
                const locken = [[51 - i * 2.5, 4 + i * 6, 5, 4.5], [47 - i * 2.5, 9 + i * 6, 4.5, 4]];
                for (const [lx, ly, rx, ry] of locken) {
                    ctx.fillStyle = kugelVerlauf(lx, ly, rx * 1.2, maehneHell[i], farbe, farbe);
                    ctx.beginPath();
                    ctx.ellipse(lx, ly, rx, ry, -0.6, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Auge mit zwei Glanzpunkten, Wimpern, Bäckchen
            ctx.fillStyle = kugelVerlauf(59.5, 9, 3, '#5a4a80', '#2b2440', '#15101f');
            ctx.beginPath();
            ctx.ellipse(59.5, 9, 2.2, 2.8, 0, 0, Math.PI * 2);
            ctx.fill();
            glanzlicht(60.3, 8, 0.9, 0.9, 0, 1);
            glanzlicht(58.9, 10.4, 0.45, 0.45, 0, 0.8);
            ctx.strokeStyle = '#2b2440';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(61, 6.4); ctx.lineTo(63, 5);
            ctx.moveTo(60, 6.1); ctx.lineTo(61, 4.3);
            ctx.stroke();
            ctx.fillStyle = 'rgba(255, 120, 170, 0.45)';
            ctx.beginPath();
            ctx.arc(58, 14, 2.5, 0, Math.PI * 2);
            ctx.fill();

            zeichneJohanni(t);

            // Flügel mit Federverlauf
            const schlag = Math.sin(t * 12) * 0.55;
            ctx.save();
            ctx.translate(30, 23);
            ctx.rotate(-0.5 + schlag);
            ctx.strokeStyle = '#8fbbe6';
            ctx.lineWidth = 1.3;
            for (let i = 2; i >= 0; i--) {
                const fx = -4 - i * 5, fy = -8 + i * 2;
                const feder = ctx.createLinearGradient(fx, fy - 12, fx, fy + 12);
                feder.addColorStop(0, '#ffffff');
                feder.addColorStop(1, i === 0 ? '#d4e7fa' : '#c2dbf4');
                ctx.fillStyle = feder;
                ctx.beginPath();
                ctx.ellipse(fx, fy, 5, 13 - i * 2, -0.35 - i * 0.25, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }
            glanzlicht(-5, -14, 1.6, 5, -0.35, 0.8);
            ctx.restore();

            ctx.restore();
        }

        // Weicher Schatten von Glacier auf der Wiese: je höher, desto kleiner und blasser
        function zeichneBodenschatten(cx, unterkante) {
            const vorneVersatz = hintergrundZeit * 70;
            const boden = huegelHoehe(cx + vorneVersatz, 355, 10, 70) + 10;
            const abstand = Math.max(0, boden - unterkante);
            const s = Math.max(0.35, 1 - abstand / 380);
            const g = ctx.createRadialGradient(cx, boden, 2, cx, boden, 34 * s);
            g.addColorStop(0, `rgba(30, 50, 40, ${0.35 * s})`);
            g.addColorStop(1, 'rgba(30, 50, 40, 0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.ellipse(cx, boden, 34 * s, 8 * s, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        function zeichneFiligraneWolke(x, y, width, height) {
            // Rosa Gewitterwolke: kräftiger als der Himmel, damit man sie gut sieht
            ctx.save();
            const r = height * 0.35;
            const blasen = [
                [0.3, 0.5, 1], [0.5, 0.4, 1.2], [0.7, 0.5, 1], [0.5, 0.6, 1.1]
            ];
            const wolkenPfad = () => {
                ctx.beginPath();
                for (const [fx, fy, fr] of blasen) {
                    ctx.moveTo(x + width * fx + r * fr, y + height * fy);
                    ctx.arc(x + width * fx, y + height * fy, r * fr, 0, Math.PI * 2);
                }
            };

            // Blitz unter der Wolke (flackert)
            if (Math.floor(spielRahmen / 8 + x / 50) % 5 === 0) {
                ctx.fillStyle = '#ffe14d';
                ctx.strokeStyle = '#e0a800';
                ctx.lineWidth = 1.5;
                const bx = x + width * 0.5, by = y + height * 0.8;
                ctx.beginPath();
                ctx.moveTo(bx, by);
                ctx.lineTo(bx - 8, by + 16);
                ctx.lineTo(bx - 1, by + 16);
                ctx.lineTo(bx - 6, by + 30);
                ctx.lineTo(bx + 8, by + 11);
                ctx.lineTo(bx + 1, by + 11);
                ctx.lineTo(bx + 5, by);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            // Außenkontur: erst dick umranden, dann füllen -> nur der Rand bleibt sichtbar
            wolkenPfad();
            ctx.strokeStyle = '#7a2f6e';
            ctx.lineWidth = 5;
            ctx.stroke();
            ctx.fillStyle = '#d46fb4';
            ctx.fill();

            // hellere Oberseite
            ctx.fillStyle = '#ec9fd2';
            ctx.beginPath();
            ctx.ellipse(x + width * 0.45, y + height * 0.32, r * 0.8, r * 0.45, 0, 0, Math.PI * 2);
            ctx.fill();

            // grimmiges Gesicht
            const gx = x + width * 0.5, gy = y + height * 0.55;
            ctx.strokeStyle = '#5a1f52';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(gx - 15, gy - 7); ctx.lineTo(gx - 6, gy - 3);
            ctx.moveTo(gx + 15, gy - 7); ctx.lineTo(gx + 6, gy - 3);
            ctx.stroke();
            ctx.fillStyle = '#5a1f52';
            ctx.beginPath();
            ctx.arc(gx - 9, gy + 2, 2.5, 0, Math.PI * 2);
            ctx.arc(gx + 9, gy + 2, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(gx, gy + 14, 5, Math.PI * 1.15, Math.PI * 1.85);
            ctx.stroke();
            ctx.restore();
        }

        function zeichneEchtenStern(cx, cy, spikes, outerRadius, innerRadius, istPowerUp) {
            ctx.save();
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;
            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;
                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            
            if (istPowerUp) {
                ctx.fillStyle = Math.floor(spielRahmen / 5) % 2 === 0 ? '#00ffff' : '#ff00ff';
            } else {
                ctx.fillStyle = '#ffdf00';
            }
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
        }

        function zeichneMagnetSymbol(x, y, groesse) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(groesse / 20, groesse / 20);
            ctx.lineCap = 'butt';
            ctx.lineWidth = 7;
            ctx.strokeStyle = '#7a1f2e';
            ctx.beginPath();
            ctx.arc(0, 0, 9, Math.PI, 0, false);
            ctx.stroke();
            ctx.strokeStyle = '#ff4d5e';
            ctx.lineWidth = 5;
            ctx.stroke();
            ctx.fillStyle = '#e8eef5';
            ctx.strokeStyle = '#7a1f2e';
            ctx.lineWidth = 1.5;
            ctx.fillRect(-12.5, 0, 7, 8); ctx.strokeRect(-12.5, 0, 7, 8);
            ctx.fillRect(5.5, 0, 7, 8); ctx.strokeRect(5.5, 0, 7, 8);
            glanzlicht(-5, -7, 3, 1.2, -0.4, 0.8);
            ctx.restore();
        }

        function zeichneSchildSymbol(x, y, groesse) {
            ctx.save();
            const r = groesse * 0.55;
            ctx.fillStyle = kugelVerlauf(x, y, r, 'rgba(230, 250, 255, 0.95)', 'rgba(120, 200, 255, 0.75)', 'rgba(40, 120, 220, 0.9)');
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold ' + Math.round(r * 1.1) + 'px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('★', x, y + 1);
            glanzlicht(x - r * 0.35, y - r * 0.4, r * 0.3, r * 0.15, -0.6, 0.9);
            ctx.restore();
        }

        function zeichneSammelobjekt(st) {
            const wippen = Math.sin(spielRahmen / 10 + st.x / 60) * 3;
            if (st.typ === 'herz') zeichneHerz(st.x, st.y + wippen, 26, true);
            else if (st.typ === 'magnet') zeichneMagnetSymbol(st.x, st.y + wippen, 30);
            else if (st.typ === 'schild') zeichneSchildSymbol(st.x, st.y + wippen, 34);
            else zeichneEchtenStern(st.x, st.y, 5, st.radius, st.radius / 2, st.typ === 'kraft');
        }

        function erstelleStern(typ) {
            const yPosition = Math.random() * (H - 80) + 40;
            if (!typ) {
                const r = Math.random();
                typ = 'stern';
                if (bossPhase) {
                    if (herzen < MAX_HERZEN && r < 0.12) typ = 'herz';
                } else if (r < 0.13) typ = 'kraft';
                else if (level >= 2 && r < 0.19 && magnetTimer <= 0) typ = 'magnet';
                else if (level >= 4 && r < 0.25 && !schildAktiv) typ = 'schild';
                else if (herzen < MAX_HERZEN && r < 0.31) typ = 'herz';
            }
            sterne.push({
                x: W + 20,
                y: yPosition,
                radius: typ === 'stern' ? 15 : 18,
                baseSpeed: 140,
                typ: typ
            });
        }

        function erstelleHindernis() {
            const breite = 85;
            const hoehe = 60 + Math.random() * 40; 
            const yPosition = Math.random() * (H - hoehe);
            hindernisse.push({ 
                x: W, 
                y: yPosition, 
                width: breite, 
                height: hoehe, 
                baseSpeed: 140 
            });
        }


        // ===== DRACHEN =====
        // Ab Level 3 fliegen Drachen auf Glacier zu. Mit jedem Level kommen
        // sie öfter, schneller und mit größeren Wellenbewegungen.
        // Ab Level 7 versuchen manche, Glacier zu verfolgen.
        const DRACHE_B = 80;
        const DRACHE_H = 50;

        function drachenEinstellung(lvl) {
            if (lvl < 3) return null;
            const stufe = lvl - 3;
            return {
                takt: Math.max(2.0, 5.5 - stufe * 0.5),   // Sekunden zwischen Drachen
                tempo: 230 + stufe * 25,                  // Pixel pro Sekunde
                amplitude: 15 + stufe * 7,                // Höhe der Wellenbewegung
                wellenTempo: 2 + stufe * 0.25,
                verfolgerChance: lvl >= 7 ? 0.25 + (lvl - 7) * 0.1 : 0
            };
        }

        function erstelleDrache(e) {
            // Startposition so wählen, dass keine undurchdringliche Wand
            // mit einer gerade erschienenen Wolke entsteht
            let y = 0;
            for (let versuch = 0; versuch < 12; versuch++) {
                y = 30 + Math.random() * (H - DRACHE_H - 60);
                const blockiert = hindernisse.some(w =>
                    w.x > W - 260 &&
                    y + DRACHE_H + 50 > w.y && y - 50 < w.y + w.height);
                if (!blockiert) break;
            }
            Klang.spiele('warnung');
            drachen.push({
                x: W + 10,
                basisY: y,
                y: y,
                phase: Math.random() * Math.PI * 2,
                tempo: e.tempo,
                amplitude: e.amplitude,
                wellenTempo: e.wellenTempo,
                verfolgt: Math.random() < e.verfolgerChance,
                warnung: 0.9,          // Sekunden Vorwarnung am rechten Rand
                verscheucht: false,
                drehung: 0
            });
        }

        function zeichneWarnung(y, verfolgt) {
            if (Math.floor(spielRahmen / 6) % 2 === 0) return;
            const cx = W - 26, cy = y + DRACHE_H / 2;
            ctx.save();
            ctx.fillStyle = verfolgt ? '#ff5a5a' : '#ff9a3c';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(cx, cy, 16, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 22px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('!', cx, cy + 8);
            ctx.restore();
        }

        function zeichneDrache(d) {
            const t = spielRahmen / 60;
            const umriss = d.boss ? '#4b2a7a' : (d.verfolgt ? '#7a2b2b' : '#2f7a50');
            const koerper = d.boss ? '#a77be6' : (d.verfolgt ? '#ff7d6b' : '#5cc98a');
            ctx.save();
            ctx.translate(d.x + DRACHE_B / 2, d.y + DRACHE_H / 2);
            ctx.rotate(d.drehung);
            ctx.translate(-DRACHE_B / 2, -DRACHE_H / 2);
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.lineWidth = 2;

            // Schwanz mit Spitze (nach rechts, Drache schaut nach links)
            ctx.strokeStyle = umriss;
            ctx.lineWidth = 9;
            ctx.beginPath();
            const wedeln = Math.sin(t * 6 + d.phase) * 5;
            ctx.moveTo(52, 30);
            ctx.quadraticCurveTo(68, 34 + wedeln, 76, 24 - wedeln);
            ctx.stroke();
            ctx.strokeStyle = koerper;
            ctx.lineWidth = 6;
            ctx.stroke();
            ctx.fillStyle = '#ffd34d';
            ctx.strokeStyle = umriss;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(74, 26 - wedeln);
            ctx.lineTo(84, 18 - wedeln);
            ctx.lineTo(79, 30 - wedeln);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // hinterer Flügel
            const schlag = Math.sin(t * 9 + d.phase);
            const zeichneFluegel = (dx, farbe) => {
                // Fledermaus-Flügel, der von der Schulter aus auf- und zuklappt
                ctx.save();
                ctx.translate(40 + dx, 22);
                ctx.scale(1, 0.45 + 0.55 * (schlag * 0.5 + 0.5));
                ctx.fillStyle = farbe;
                ctx.strokeStyle = '#6a46b8';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(-4, 0);
                ctx.lineTo(2, -24);                       // Flügelspitze
                ctx.quadraticCurveTo(6, -14, 9, -14);
                ctx.lineTo(14, -20);                      // zweite Spitze
                ctx.quadraticCurveTo(15, -8, 20, -6);
                ctx.lineTo(22, -10);
                ctx.quadraticCurveTo(20, -2, 14, 0);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                // Flügelknochen
                ctx.beginPath();
                ctx.moveTo(-2, -1); ctx.lineTo(9, -14);
                ctx.moveTo(-1, -1); ctx.lineTo(18, -7);
                ctx.stroke();
                ctx.restore();
            };
            zeichneFluegel(6, '#9a76e8');

            // Körper + Bauch
            ctx.fillStyle = koerper;
            ctx.strokeStyle = umriss;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(40, 30, 18, 12, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#ffe9a8';
            ctx.beginPath();
            ctx.ellipse(38, 35, 12, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            // Beinchen
            ctx.strokeStyle = umriss;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(32, 40); ctx.lineTo(30, 46);
            ctx.moveTo(46, 40); ctx.lineTo(45, 46);
            ctx.stroke();

            // Kopf
            ctx.fillStyle = koerper;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(18, 20, 13, 11, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(8, 25, 9, 7, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            // Hals-Naht überdecken
            ctx.beginPath();
            ctx.ellipse(27, 26, 7, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            // Hörner
            ctx.fillStyle = '#fff3c4';
            ctx.strokeStyle = umriss;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(20, 10); ctx.lineTo(26, 0); ctx.lineTo(25, 11);
            ctx.moveTo(14, 10); ctx.lineTo(16, 1); ctx.lineTo(19, 10);
            ctx.fill();
            ctx.stroke();

            // Nasenloch, Auge, Augenbraue
            ctx.fillStyle = umriss;
            ctx.beginPath();
            ctx.arc(3, 23, 1.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(16, 18, 4.5, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#2b2440';
            ctx.beginPath();
            ctx.arc(14.8, 18.5, 2.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(14, 17.5, 0.9, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = umriss;
            ctx.lineWidth = 2;
            ctx.beginPath();
            if (d.verscheucht) {
                ctx.moveTo(11, 11); ctx.lineTo(20, 13);   // erschrocken
            } else {
                ctx.moveTo(11, 13); ctx.lineTo(20, 10);   // frech
            }
            ctx.stroke();

            // kleine Rauchwölkchen aus der Nase
            if (!d.verscheucht) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                const r = (t * 2 + d.phase) % 1;
                ctx.beginPath();
                ctx.arc(-3 - r * 10, 22 - r * 6, 2 + r * 3, 0, Math.PI * 2);
                ctx.fill();
            }

            // vorderer Flügel
            zeichneFluegel(-4, '#b48cff');

            ctx.restore();
        }

        function aktualisiereDrachen() {
            const e = drachenEinstellung(level);
            if (e && !bossPhase) {
                drachenTimer += dt;
                if (drachenTimer >= e.takt) {
                    erstelleDrache(e);
                    drachenTimer = 0;
                }
            }

            for (let i = drachen.length - 1; i >= 0; i--) {
                const d = drachen[i];

                if (d.warnung > 0) {
                    d.warnung -= dt;
                    zeichneWarnung(d.basisY, d.verfolgt);
                    continue;
                }

                if (d.verscheucht) {
                    // Mit Regenbogen-Kraft berührt: Drache flieht nach oben rechts
                    d.x += 320 * dt;
                    d.y -= 260 * dt;
                    d.drehung += 6 * dt;
                } else {
                    d.x -= d.tempo * dt;
                    d.phase += d.wellenTempo * dt;
                    if (d.verfolgt && d.x > einhorn.x + 60) {
                        const ziel = einhorn.y - 5;
                        d.basisY += Math.sign(ziel - d.basisY) * Math.min(Math.abs(ziel - d.basisY), 70 * dt);
                    }
                    d.y = d.basisY + Math.sin(d.phase) * d.amplitude;
                    d.y = Math.max(0, Math.min(H - DRACHE_H, d.y));
                }

                zeichneDrache(d);

                if (!d.verscheucht &&
                    einhorn.x + 8 < d.x + DRACHE_B * 0.85 &&
                    einhorn.x + einhorn.width - 6 > d.x + DRACHE_B * 0.1 &&
                    einhorn.y + 5 < d.y + DRACHE_H * 0.9 &&
                    einhorn.y + einhorn.height - 4 > d.y + DRACHE_H * 0.1
                ) {
                    if (unverwundbarTimer > 0) {
                        d.verscheucht = true;
                        Klang.spiele('verscheucht');
                        partikelExplosion(d.x + DRACHE_B / 2, d.y + DRACHE_H / 2, 14, ['#b48cff', '#5cc98a', '#ffffff'], 'stern');
                    } else if (schutzTimer <= 0 && zustand === 'spiel') {
                        d.verscheucht = true;   // fliegt nach dem Treffer davon
                        treffer('drache');
                    }
                }

                if (d.x < -DRACHE_B - 20 || d.y < -DRACHE_H - 20 || d.x > W + 120) {
                    drachen.splice(i, 1);
                }
            }
        }

        // ===== EFFEKTE =====
        let partikel = [];
        let schwebeTexte = [];
        let spurTimer = 0;
        let wackelZeit = 0, wackelStaerke = 0;
        let blitzZeit = 0;
        let komboZaehler = 0, komboTimer = 0;
        const MAX_PARTIKEL = 220;

        function neuesPartikel(p) {
            if (partikel.length >= MAX_PARTIKEL) partikel.shift();
            partikel.push(p);
        }

        function partikelExplosion(x, y, anzahl, farben, form, tempo) {
            tempo = tempo || 220;
            for (let i = 0; i < anzahl; i++) {
                const w = Math.random() * Math.PI * 2;
                const v = tempo * (0.4 + Math.random() * 0.8);
                const leben = 0.5 + Math.random() * 0.5;
                neuesPartikel({
                    x: x, y: y,
                    vx: Math.cos(w) * v, vy: Math.sin(w) * v - 40,
                    leben: leben, max: leben,
                    farbe: farben[i % farben.length],
                    r: 2.5 + Math.random() * 3,
                    form: form || 'kreis',
                    schwere: 260
                });
            }
        }

        function schwebeText(x, y, text, farbe, groesse) {
            schwebeTexte.push({ x: x, y: y, text: text, farbe: farbe || '#ffffff', groesse: groesse || 20, leben: 1.1, max: 1.1 });
        }

        function wackeln(staerke, zeit) {
            wackelStaerke = Math.max(wackelStaerke, staerke);
            wackelZeit = Math.max(wackelZeit, zeit);
        }

        function zeichneFunkeln(x, y, r) {
            ctx.beginPath();
            ctx.moveTo(x, y - r * 2); ctx.lineTo(x + r * 0.45, y - r * 0.45);
            ctx.lineTo(x + r * 2, y); ctx.lineTo(x + r * 0.45, y + r * 0.45);
            ctx.lineTo(x, y + r * 2); ctx.lineTo(x - r * 0.45, y + r * 0.45);
            ctx.lineTo(x - r * 2, y); ctx.lineTo(x - r * 0.45, y - r * 0.45);
            ctx.closePath();
            ctx.fill();
        }

        function aktualisiereEffekte() {
            // Glitzerspur hinter Glacier
            spurTimer += dt;
            while (spurTimer > 0.028) {
                spurTimer -= 0.028;
                const kraft = unverwundbarTimer > 0;
                const farbe = kraft
                    ? `hsl(${(spielRahmen * 6 + Math.random() * 60) % 360}, 100%, 72%)`
                    : ['#ffffff', '#ffd6ef', '#d8c8ff', '#c8f0ff'][Math.floor(Math.random() * 4)];
                neuesPartikel({
                    x: einhorn.x + 4 + Math.random() * 6,
                    y: einhorn.y + 24 + Math.random() * 12,
                    vx: -150 - Math.random() * 60, vy: (Math.random() - 0.5) * 30,
                    leben: kraft ? 0.7 : 0.45, max: kraft ? 0.7 : 0.45,
                    farbe: farbe, r: kraft ? 2.6 : 1.8, form: 'stern', schwere: 0
                });
            }

            for (let i = partikel.length - 1; i >= 0; i--) {
                const p = partikel[i];
                p.leben -= dt;
                if (p.leben <= 0) { partikel.splice(i, 1); continue; }
                p.vy += p.schwere * dt;
                p.x += p.vx * dt;
                p.y += p.vy * dt;
            }
            for (let i = schwebeTexte.length - 1; i >= 0; i--) {
                const t = schwebeTexte[i];
                t.leben -= dt;
                t.y -= 45 * dt;
                if (t.leben <= 0) schwebeTexte.splice(i, 1);
            }
            if (komboTimer > 0) {
                komboTimer -= dt;
                if (komboTimer <= 0) komboZaehler = 0;
            }
            if (wackelZeit > 0) wackelZeit -= dt;
            if (blitzZeit > 0) blitzZeit -= dt;
        }

        function zeichnePartikel() {
            ctx.save();
            for (const p of partikel) {
                ctx.globalAlpha = Math.max(0, p.leben / p.max);
                ctx.fillStyle = p.farbe;
                if (p.form === 'stern') {
                    zeichneFunkeln(p.x, p.y, p.r);
                } else if (p.form === 'herz') {
                    ctx.restore(); ctx.save();
                    ctx.globalAlpha = Math.max(0, p.leben / p.max);
                    zeichneHerz(p.x, p.y, p.r * 4, true);
                } else {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.restore();
            for (const t of schwebeTexte) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, Math.min(1, t.leben / t.max * 1.6));
                konturText(t.text, t.x, t.y, 'bold ' + t.groesse + 'px Arial', t.farbe, '#5a1f6a', 5);
                ctx.restore();
            }
        }

        // ===== POWER-UPS =====
        const MAGNET_DAUER = 8;
        const SCHILD_DAUER = 15;
        let magnetTimer = 0;
        let schildAktiv = false;
        let schildTimer = 0;

        function zeichnePowerUpEffekte() {
            const cx = einhorn.x + 35, cy = einhorn.y + 22;
            if (magnetTimer > 0) {
                const puls = (spielRahmen / 40) % 1;
                ctx.save();
                ctx.strokeStyle = `rgba(255, 90, 110, ${0.5 * (1 - puls)})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(cx, cy, 30 + puls * 70, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
            if (schildAktiv) {
                const endetBald = schildTimer < 3 && Math.floor(spielRahmen / 6) % 2 === 0;
                ctx.save();
                ctx.globalAlpha = endetBald ? 0.35 : 0.9;
                const g = ctx.createRadialGradient(cx - 12, cy - 14, 8, cx, cy, 50);
                g.addColorStop(0, 'rgba(255, 255, 255, 0.05)');
                g.addColorStop(0.75, 'rgba(140, 210, 255, 0.18)');
                g.addColorStop(1, 'rgba(90, 170, 255, 0.55)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(cx, cy, 48, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(200, 235, 255, 0.9)';
                ctx.lineWidth = 2;
                ctx.stroke();
                glanzlicht(cx - 20, cy - 26, 10, 4, -0.6, 0.7);
                ctx.restore();
            }
        }

        function zeichnePowerUpLeiste() {
            // kleine Anzeige oben in der Mitte für aktive Power-ups
            const eintraege = [];
            if (unverwundbarTimer > 0) eintraege.push({ text: 'Regenbogen ' + Math.ceil(unverwundbarTimer / 60) + 's', farbe: '#7dffe0', anteil: unverwundbarTimer / 420 });
            if (magnetTimer > 0) eintraege.push({ text: 'Magnet ' + Math.ceil(magnetTimer) + 's', farbe: '#ff8a98', anteil: magnetTimer / MAGNET_DAUER });
            if (schildAktiv) eintraege.push({ text: 'Schild ' + Math.ceil(schildTimer) + 's', farbe: '#9fd6ff', anteil: schildTimer / SCHILD_DAUER });
            if (komboZaehler >= 3) eintraege.push({ text: 'Kombo x' + komboZaehler, farbe: '#ffe14d', anteil: komboTimer / 1.8 });
            // links neben den runden Knöpfen, damit nichts die Punkteanzeige verdeckt
            const y0 = bossPhase ? 58 : 14;
            const b = 112, abstand = 6;
            let x = bossPhase ? W / 2 - (eintraege.length * b + (eintraege.length - 1) * abstand) / 2 : 110;
            for (const e of eintraege) {
                ctx.fillStyle = 'rgba(60, 30, 90, 0.45)';
                ctx.beginPath();
                ctx.roundRect(x, y0, b, 30, 10);
                ctx.fill();
                ctx.fillStyle = e.farbe;
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(e.text, x + b / 2, y0 + 18);
                ctx.fillRect(x + 10, y0 + 23, (b - 20) * Math.max(0, Math.min(1, e.anteil)), 3);
                x += b + abstand;
            }
        }

        // ===== LEVEL-BILDSCHIRM =====
        let levelUpAusstehend = null;
        let levelUpInfo = null;

        function levelInfo(lvl, neueWelt) {
            const texte = {
                2: ['Neu: Sternen-Magnet! Er zieht Sterne zu dir.', 'Die Wolken kommen jetzt öfter.'],
                3: ['Achtung, Drachen! Sie fliegen in Wellen auf dich zu.', 'Ein „!“ am rechten Rand warnt dich vorher.'],
                4: ['Neu: Schutzschild! Er fängt einen Treffer ab.', 'Die Drachen werden schneller.'],
                5: ['Die Drachen kommen jetzt öfter.', 'Sammle Regenbogen-Sterne und verscheuche sie!'],
                6: ['Die Drachen werden noch schneller.', 'Bleib in Bewegung!'],
                7: ['Rote Drachen verfolgen dich!', 'Weiche ihnen geschickt aus.'],
                8: ['Noch mehr rote Drachen!', 'Kombos geben Extra-Sterne.'],
                9: ['Fast geschafft!', 'Glühwürmchen leuchten dir den Weg.'],

            };
            return {
                titel: 'Level ' + lvl + ' erreicht!',

        const FINALE_INFO = {
            titel: 'Finale: Der Drachenkönig!',
            unter: 'Du hast 100 Sterne – jetzt wird es ernst!',
            zeilen: ['Er spuckt Feuerbälle – weiche ihnen aus.',
                     'Hol dir einen Regenbogen-Stern und flieg in ihn hinein.',
                     'Drei Treffer, und der Himmel ist gerettet!'],
